          items:
            $ref: "#/components/schemas/UserEnrollmentInput"
    UserUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        givenName:
          $ref: "#/components/schemas/PersonName"
        familyName:
          $ref: "#/components/schemas/PersonName"
        systemRole:
          $ref: "#/components/schemas/SystemRole"
        preferredLocale:
          $ref: "#/components/schemas/Locale"
    AccountInvitation:
      type: object
      description: |
        A single-use activation link, returned only once when issued. `activationPath` is relative to
        the web app origin; the token is in the URL fragment so browsers never send it to a server.
        Synthetic local demonstration only (local link delivery).
      required: [id, expiresAt, delivery, activationPath]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        delivery:
          type: string
          enum: [local_link]
        activationPath:
          type: string
          description: "`/activate#token=…`"
    UserCreateResult:
      type: object
      required: [user, invitation, invitationStatus]
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/UserDetail"
        invitation:
          oneOf:
            - $ref: "#/components/schemas/AccountInvitation"
            - type: "null"
        invitationStatus:
          type: string
          description: |
            `issued`: a local activation link is included. `disabled`: activation links are turned off
            in this environment. `synthetic_only`: local links are only issued for synthetic addresses.
          enum: [issued, disabled, synthetic_only]
    ActivationPreviewRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    ActivationPreview:
      type: object
      required: [email, givenName, familyName, expiresAt]
      additionalProperties: false
      properties:
        email:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        expiresAt:
          type: string
          format: date-time
    ActivationRequest:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        password:
          type: string
          format: password
          writeOnly: true
          description: 12 to 256 characters; must not contain the account's email name (`PASSWORD_TOO_WEAK`).
          minLength: 12
          maxLength: 256
    EnrollmentUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/CourseRole"
        status:
          type: string
          enum: [active, inactive]
    EnrollmentImportRequest:
      type: object
      required: [csv]
      additionalProperties: false
      properties:
        csv:
          type: string
          minLength: 1
          maxLength: 100000
        apply:
