        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/courses/{id}/tutor/messages:
    post:
      operationId: askTutor
      summary: Ask the course tutor a question (local mock provider, grounded in approved lessons)
      description: |
        Students, instructors and non-editing instructors of the course only (`tutor.use`; the
        administrator and design-team roles never grant it). Students must be enrolled in a published
        course. The answer is built only from approved lesson text this user may read in this course
        (students: visible lessons in visible sections). Draft, submitted or returned revisions,
        quizzes and answer keys, assignments, submissions, grades, review comments and audit entries
        are never used. When a lesson has an unapproved revision, only the approved version is used.

        Responses come from a local, deterministic mock provider (`provider.mode` = `mock`): it quotes
        the retrieved passages verbatim with citations, uses fixed English or Spanish wording, does
        not translate sources, and does not use a language model. Lesson text is treated as data,
        never as instructions. When nothing relevant is found, `grounding` is `insufficient_material`
        and no citations are returned. Requests are limited per user and course (`RATE_LIMITED`) and
        recorded without the question text.
      tags: [Tutor]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TutorMessageRequest"
      responses:
        "200":
          description: The grounded (or insufficient-material) mock response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorMessageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/courses/{id}/tutor/practice:
    post:
      operationId: suggestTutorPractice
      summary: Suggest practice prompts from approved lessons (local mock provider)
      description: |
        Same access, sources, limits and recording as `askTutor`. Returns up to three clearly labelled,
        ungraded practice prompts, each built from a cited approved lesson passage (optionally about
        `topic`). Prompts never contain assessment questions or answer keys.
      tags: [Tutor]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TutorPracticeRequest"
      responses:
        "200":
          description: Practice prompts (or an insufficient-material response).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorPracticeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/courses/{id}/tutor/usage:
    get:
      operationId: getMyTutorUsage
      summary: The signed-in user's own tutor usage in this course
      description: |
        Same access as `askTutor`. Only the caller's own records are returned (most recent first,
        at most 20); other users' usage is never exposed.
      tags: [Tutor]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Usage summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorUsage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `nextCursor`.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    CourseId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SectionId:
      name: sectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActivityId:
      name: activityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuestionId:
      name: questionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProgramId:
      name: programId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TermId:
      name: termId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ap_session
      description: HttpOnly session cookie. Named `__Host-ap_session` in production.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF token from the login response or `GET /api/v1/auth/csrf`.
  headers:
    NoStore:
      description: Authenticated responses must not be cached.
      schema:
        type: string
        const: no-store
  responses:
    ValidationError:
      description: "The request body is missing or invalid (`code`: `VALIDATION_ERROR`)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: Request validation failed.
            code: VALIDATION_ERROR
    Unauthorized:
      description: |
        `code` is `INVALID_CREDENTIALS` for failed sign-in (generic; does not reveal whether the email
        exists), or `UNAUTHENTICATED` when the session cookie is missing, invalid, expired or revoked.
        An invalid session cookie is cleared.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: Invalid email or password.
            code: INVALID_CREDENTIALS
    Forbidden:
      description: "`code` is `CSRF_TOKEN_INVALID`, `ORIGIN_NOT_ALLOWED`, `FORBIDDEN` or `SELF_REVIEW_NOT_ALLOWED`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: Missing or invalid CSRF token.
            code: CSRF_TOKEN_INVALID
    RateLimited:
      description: "Too many sign-in attempts or tutor requests (`code`: `RATE_LIMITED`)."
      headers:
        Retry-After:
          description: Seconds until another attempt is allowed.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            detail: Too many attempts. Try again later.
            code: RATE_LIMITED
    NotFound:
      description: "The resource does not exist or the caller cannot access it (`code`: `NOT_FOUND`)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: Course not found.
            code: NOT_FOUND
    Conflict:
      description: |
        A uniqueness rule was violated: `PROGRAM_CODE_TAKEN`, `TERM_CODE_TAKEN`, `COURSE_CODE_TAKEN`,
        `ENROLLMENT_EXISTS`, `TEMPLATE_CODE_TAKEN` or `TEMPLATE_VERSION_CONFLICT`; or an invalid review transition:
        `ACTIVITY_UNDER_REVIEW`, `INVALID_REVIEW_STATE`; or a quiz rule: `QUIZ_QUESTION_LIMIT`,
        `ATTEMPT_LIMIT_REACHED`, `ATTEMPT_NOT_IN_PROGRESS`, `ATTEMPT_EXPIRED`, `ATTEMPT_CONFLICT`; or an
        assignment rule: `SUBMISSION_EXISTS`, `SUBMISSION_CLOSED`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Conflict
            status: 409
            detail: The user is already enrolled in this course.
            code: ENROLLMENT_EXISTS
    UnprocessableContent:
      description: |
        The request is well-formed but refers to missing or incompatible data: `INVALID_TERM_DATES`,
        `TERM_YEAR_MISMATCH`,
        `PROGRAM_NOT_FOUND`, `PROGRAM_INACTIVE`, `TERM_NOT_FOUND`, `TEMPLATE_NOT_FOUND`,
        `TEMPLATE_VERSION_NOT_FOUND`, `TEMPLATE_PROGRAM_MISMATCH`, `USER_NOT_FOUND`, `USER_INACTIVE`,
        `INVALID_URL`, `CONTENT_TYPE_MISMATCH`, `REVIEW_COMMENT_REQUIRED`, `QUIZ_HAS_NO_QUESTIONS`,
        `INVALID_ANSWER_KEY`, `INVALID_ANSWER`, `INVALID_DUE_DATE` or `INVALID_RUBRIC_SCORES`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Unprocessable Entity
            status: 422
            detail: The course template belongs to a different program.
            code: TEMPLATE_PROGRAM_MISMATCH
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
        - timestamp
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
          examples:
            - academiapath-api
        timestamp:
          type: string
          format: date-time
    LoginRequest:
      type: object
      required:
        - email
        - password
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 1024
    CurrentUser:
      type: object
      required:
        - id
        - email
        - givenName
        - familyName
        - systemRole
        - preferredLocale
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        systemRole:
          type: string
          description: Platform-wide role. Only `administrator` grants system-level permissions.
          enum:
            - administrator
            - user
        preferredLocale:
          type: string
          enum:
            - es
            - en
    LoginResponse:
      type: object
      required:
        - user
        - csrfToken
        - expiresAt
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/CurrentUser"
        csrfToken:
          type: string
          description: Send as `X-CSRF-Token` on state-changing requests.
        expiresAt:
          type: string
          format: date-time
    MeResponse:
      type: object
      required:
        - user
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/CurrentUser"
    CsrfTokenResponse:
      type: object
      required:
        - csrfToken
      additionalProperties: false
      properties:
        csrfToken:
          type: string
    ProblemDetails:
      type: object
      description: |
        RFC 9457 Problem Details, served as `application/problem+json`. `type` is `about:blank`, so
        `title` is the HTTP status phrase. `code` is an application-specific extension member for
        programmatic handling. Clients must ignore unknown members.
      required:
        - type
        - title
        - status
        - detail
        - code
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Human-readable explanation. Never contains credentials or internal details.
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Application-specific error code.
          enum:
            - VALIDATION_ERROR
            - INVALID_CREDENTIALS
            - UNAUTHENTICATED
            - CSRF_TOKEN_INVALID
            - ORIGIN_NOT_ALLOWED
            - FORBIDDEN
            - RATE_LIMITED
            - BAD_REQUEST
            - NOT_FOUND
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - REQUEST_ERROR
            - INTERNAL_ERROR
            - INVALID_CURSOR
            - PROGRAM_CODE_TAKEN
            - TERM_CODE_TAKEN
            - COURSE_CODE_TAKEN
            - ENROLLMENT_EXISTS
            - TEMPLATE_VERSION_CONFLICT
            - INVALID_TERM_DATES
            - PROGRAM_NOT_FOUND
            - PROGRAM_INACTIVE
            - TERM_NOT_FOUND
            - TEMPLATE_NOT_FOUND
            - TEMPLATE_VERSION_NOT_FOUND
            - TEMPLATE_PROGRAM_MISMATCH
            - USER_NOT_FOUND
            - USER_INACTIVE
            - INVALID_URL
            - CONTENT_TYPE_MISMATCH
            - ACTIVITY_UNDER_REVIEW
            - INVALID_REVIEW_STATE
            - SELF_REVIEW_NOT_ALLOWED
            - REVIEW_COMMENT_REQUIRED
            - QUIZ_HAS_NO_QUESTIONS
            - QUIZ_QUESTION_LIMIT
            - INVALID_ANSWER_KEY
            - INVALID_ANSWER
            - ATTEMPT_LIMIT_REACHED
            - ATTEMPT_NOT_IN_PROGRESS
            - ATTEMPT_EXPIRED
            - ATTEMPT_CONFLICT
            - SUBMISSION_EXISTS
            - SUBMISSION_CLOSED
            - INVALID_DUE_DATE
            - INVALID_RUBRIC_SCORES
            - TERM_YEAR_MISMATCH
            - TEMPLATE_CODE_TAKEN
    Code:
      type: string
      minLength: 1
      maxLength: 32
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
    CourseRole:
      type: string
      description: Course-level role. `administrator` is system-level and never a course role.
      enum:
        - design_team
        - instructor
        - non_editing_instructor
        - student
    CourseStatus:
      type: string
      enum:
        - draft
        - published
        - archived
    Program:
      type: object
      required: [id, code, name, description, isActive, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        code:
          $ref: "#/components/schemas/Code"
        name:
          type: string
        description:
          type: [string, "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProgramCreate:
      type: object
      required: [code, name]
      additionalProperties: false
      properties:
        code:
          $ref: "#/components/schemas/Code"
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
    ProgramPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Program"
        nextCursor:
          type: [string, "null"]
    Term:
      type: object
      required: [id, code, name, academicYear, startsOn, endsOn, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        code:
          $ref: "#/components/schemas/Code"
        name:
          type: string
        academicYear:
          type: integer
          description: Academic year the term belongs to (for example 2026 for `2026-2`).
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TermCreate:
      type: object
      required: [code, name, startsOn, endsOn]
      additionalProperties: false
      properties:
        code:
          $ref: "#/components/schemas/Code"
          description: Peru-style labels such as `2026-1` and `2026-2` are recommended.
        name:
          type: string
          minLength: 1
          maxLength: 200
        academicYear:
          type: integer
          minimum: 2000
          maximum: 2100
          description: |
            Defaults to the year in a `YYYY-…` code, otherwise to the year of `startsOn`. When the code
            starts with a year, it must match (`TERM_YEAR_MISMATCH`).
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
    TermPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Term"
        nextCursor:
          type: [string, "null"]
    TemplateSectionInput:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        summary:
          type: string
          maxLength: 2000
        isVisible:
          type: boolean
          default: true
    CourseTemplateCreate:
      type: object
      required: [code, title, sections]
      additionalProperties: false
      properties:
        code:
          $ref: "#/components/schemas/Code"
        programId:
          type: [string, "null"]
          format: uuid
          description: Omit or null for templates shared across programs.
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        baseVersion:
          type: integer
          minimum: 0
          description: |
            Optional guard. `0`: create a new subject only (`TEMPLATE_CODE_TAKEN` if the code exists).
            `n`: create version `n + 1` only if `n` is still the latest (`TEMPLATE_VERSION_CONFLICT`
            otherwise). Omit for the original behaviour (create or add a version).
        sections:
          type: array
          maxItems: 100
          description: Ordered sections; positions are assigned from array order.
          items:
            $ref: "#/components/schemas/TemplateSectionInput"
    TemplateSection:
      type: object
      required: [id, title, summary, position, isVisible]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        summary:
          type: [string, "null"]
        position:
          type: integer
          minimum: 0
        isVisible:
          type: boolean
    CourseTemplateVersion:
      type: object
      description: An immutable template version and its sections.
      required: [id, templateId, programId, code, version, title, description, sections, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
        programId:
          type: [string, "null"]
          format: uuid
        code:
          $ref: "#/components/schemas/Code"
        version:
          type: integer
          minimum: 1
        title:
          type: string
        description:
          type: [string, "null"]
        sections:
          type: array
          items:
            $ref: "#/components/schemas/TemplateSection"
        createdAt:
          type: string
          format: date-time
    CourseTemplate:
      type: object
      required: [id, programId, code, title, description, latestVersion, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        programId:
          type: [string, "null"]
          format: uuid
        code:
          $ref: "#/components/schemas/Code"
        title:
          type: string
          description: Title of the latest version.
        description:
          type: [string, "null"]
        latestVersion:
          type: [object, "null"]
          description: Null only for templates created before versioning (no versions yet).
          required: [id, version, createdAt]
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            version:
              type: integer
              minimum: 1
            createdAt:
              type: string
              format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CourseTemplatePage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CourseTemplate"
        nextCursor:
          type: [string, "null"]
    Course:
      type: object
      required:
        - id
        - programId
        - termId
        - templateId
        - templateVersionId
        - code
        - title
        - description
        - status
        - viewerRole
        - createdAt
        - updatedAt
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        programId:
          type: [string, "null"]
          format: uuid
        termId:
          type: string
          format: uuid
        templateId:
          type: [string, "null"]
          format: uuid
        templateVersionId:
          type: [string, "null"]
          format: uuid
        code:
          $ref: "#/components/schemas/Code"
        title:
          type: string
        description:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/CourseStatus"
        viewerRole:
          description: The caller's role in this course, or null (e.g. an administrator who is not enrolled).
          oneOf:
            - $ref: "#/components/schemas/CourseRole"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CourseCreate:
      type: object
      required: [programId, termId, templateId, code]
      additionalProperties: false
      properties:
        programId:
          type: string
          format: uuid
        termId:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
        templateVersion:
          type: integer
          minimum: 1
          description: Defaults to the template's latest version.
        code:
          $ref: "#/components/schemas/Code"
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Defaults to the template version's title.
        description:
          type: string
          maxLength: 2000
        status:
          type: string
          enum: [draft, published]
          default: draft
    CoursePage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Course"
        nextCursor:
          type: [string, "null"]
    Section:
      type: object
      required: [id, title, summary, position, isVisible]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        summary:
          type: [string, "null"]
        position:
          type: integer
          minimum: 0
        isVisible:
          type: boolean
    SectionPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Section"
        nextCursor:
          type: [string, "null"]
    EnrollmentCreate:
      type: object
      required: [role]
      additionalProperties: false
      oneOf:
        - required: [userId]
        - required: [email]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          minLength: 1
          maxLength: 254
        role:
          $ref: "#/components/schemas/CourseRole"
    Enrollment:
      type: object
      required: [id, courseId, role, status, user, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/CourseRole"
        status:
          type: string
          enum: [active, inactive]
        user:
          type: object
          required: [id, email, givenName, familyName]
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            givenName:
              type: string
            familyName:
              type: string
        createdAt:
          type: string
          format: date-time
    EnrollmentPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Enrollment"
        nextCursor:
          type: [string, "null"]
    ActivityType:
      type: string
      description: Content types supported by the content API.
      enum: [page, link, quiz, assignment]
    ReviewStatus:
      type: string
      enum: [draft, submitted, approved, returned]
    PageContent:
      type: object
      description: Plain-text lesson. Clients must render `body` as text, never as HTML.
      required: [body]
      additionalProperties: false
      properties:
        body:
          type: string
    LinkContent:
      type: object
      description: External resource. `url` is an absolute http(s) URL.
      required: [url, description]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
        description:
          type: [string, "null"]
    QuizContent:
      type: object
      description: Quiz settings and totals. Questions and answer keys are never part of an activity.
      required: [instructions, attemptLimit, timeLimitMinutes, shuffleQuestions, shuffleOptions, questionCount, totalPoints]
      additionalProperties: false
      properties:
        instructions:
          type: [string, "null"]
        attemptLimit:
          type: integer
          minimum: 1
        timeLimitMinutes:
          type: [integer, "null"]
        shuffleQuestions:
          type: boolean
        shuffleOptions:
          type: boolean
        questionCount:
          type: integer
        totalPoints:
          type: integer
    RubricCriterion:
      type: object
      required: [id, title, description, maxPoints]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: [string, "null"]
        maxPoints:
          type: integer
          minimum: 1
          maximum: 100
    AssignmentContent:
      type: object
      description: Assignment instructions, deadline, late-submission window and points-based rubric.
      required: [instructions, dueAt, lateUntil, rubric, totalPoints]
      additionalProperties: false
      properties:
        instructions:
          type: string
        dueAt:
          type: string
          format: date-time
        lateUntil:
          type: [string, "null"]
          format: date-time
          description: When set, submissions after `dueAt` and up to this time are accepted and flagged late.
        rubric:
          type: array
          items:
            $ref: "#/components/schemas/RubricCriterion"
        totalPoints:
          type: integer
    ActivityContent:
      oneOf:
        - $ref: "#/components/schemas/PageContent"
        - $ref: "#/components/schemas/LinkContent"
        - $ref: "#/components/schemas/QuizContent"
        - $ref: "#/components/schemas/AssignmentContent"
    PageContentInput:
      type: object
      required: [title, body]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        body:
          type: string
          minLength: 1
          maxLength: 20000
          pattern: "\\S"
          description: Plain text; line breaks are preserved. HTML is not interpreted.
    LinkContentInput:
      type: object
      required: [title, url]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        url:
          type: string
          minLength: 1
          maxLength: 2048
          description: Absolute http or https URL without embedded credentials.
        description:
          type: string
          maxLength: 1000
    QuizSettingsInput:
      type: object
      required: [title, attemptLimit]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        instructions:
          type: string
          maxLength: 5000
        attemptLimit:
          type: integer
          minimum: 1
          maximum: 10
        timeLimitMinutes:
          type: [integer, "null"]
          minimum: 1
          maximum: 300
          description: Enforced by the server clock. Omit or null for no time limit.
        shuffleQuestions:
          type: boolean
          default: false
        shuffleOptions:
          type: boolean
          default: false
          description: Shuffles options of choice questions (not true/false).
    RubricCriterionInput:
      type: object
      required: [title, maxPoints]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        description:
          type: string
          maxLength: 1000
        maxPoints:
          type: integer
          minimum: 1
          maximum: 100
    AssignmentInput:
      type: object
      required: [title, instructions, dueAt, rubric]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        instructions:
          type: string
          minLength: 1
          maxLength: 20000
          pattern: "\\S"
          description: Plain text; line breaks are preserved. HTML is not interpreted.
        dueAt:
          type: string
          format: date-time
        lateUntil:
          type: [string, "null"]
          format: date-time
          description: |
            Optional end of the late-submission window. Must be after `dueAt` and at most 30 days
            later (`INVALID_DUE_DATE`). Omit or null to reject submissions after `dueAt`.
        rubric:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/RubricCriterionInput"
    ActivityCreate:
      oneOf:
        - allOf:
            - $ref: "#/components/schemas/PageContentInput"
            - type: object
              required: [type]
              properties:
                type:
                  type: string
                  const: page
        - allOf:
            - $ref: "#/components/schemas/LinkContentInput"
            - type: object
              required: [type]
              properties:
                type:
                  type: string
                  const: link
        - allOf:
            - $ref: "#/components/schemas/QuizSettingsInput"
            - type: object
              required: [type]
              properties:
                type:
                  type: string
                  const: quiz
        - allOf:
            - $ref: "#/components/schemas/AssignmentInput"
            - type: object
              required: [type]
              properties:
                type:
                  type: string
                  const: assignment
    ActivityUpdate:
      description: Must match the activity's type.
      oneOf:
        - $ref: "#/components/schemas/PageContentInput"
        - $ref: "#/components/schemas/LinkContentInput"
        - $ref: "#/components/schemas/QuizSettingsInput"
        - $ref: "#/components/schemas/AssignmentInput"
    ActivityReviewDecision:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [approve, return]
        comment:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: "\\S"
          description: Required when returning content.
    ActivityReview:
      type: object
      description: Review metadata (staff only).
      required: [status, comment, submittedAt, submittedByUserId, reviewedAt, reviewedByUserId]
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/ReviewStatus"
        comment:
          type: [string, "null"]
        submittedAt:
          type: [string, "null"]
          format: date-time
        submittedByUserId:
          type: [string, "null"]
          format: uuid
        reviewedAt:
          type: [string, "null"]
          format: date-time
        reviewedByUserId:
          type: [string, "null"]
          format: uuid
    ActivityLiveVersion:
      type: object
      description: The approved version students currently see (staff only).
      required: [title, content, approvedAt]
      additionalProperties: false
      properties:
        title:
          type: string
        content:
          $ref: "#/components/schemas/ActivityContent"
        approvedAt:
          type: string
          format: date-time
    Activity:
      type: object
      description: |
        For staff, `title`/`content` are the working copy and `review`/`liveVersion` are present.
        For students, `title`/`content` are the approved live version and `review`/`liveVersion` are null.
      required: [id, courseId, sectionId, type, position, isVisible, title, content, review, liveVersion, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        sectionId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/ActivityType"
        position:
          type: integer
          minimum: 0
        isVisible:
          type: boolean
        title:
          type: string
        content:
          $ref: "#/components/schemas/ActivityContent"
        review:
          oneOf:
            - $ref: "#/components/schemas/ActivityReview"
            - type: "null"
        liveVersion:
          oneOf:
            - $ref: "#/components/schemas/ActivityLiveVersion"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ActivityPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
        nextCursor:
          type: [string, "null"]

    QuizQuestionType:
      type: string
      description: Supported now. Matching, short answer and essay are not implemented.
      enum: [single_choice, multiple_choice, true_false]
    QuizChoiceQuestionInput:
      type: object
      required: [type, prompt, points, options]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [single_choice, multiple_choice]
        prompt:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: "\\S"
        points:
          type: integer
          minimum: 1
          maximum: 100
        options:
          type: array
          minItems: 2
          maxItems: 10
          description: Single choice needs exactly one correct option; multiple choice at least one.
          items:
            type: object
            required: [text, isCorrect]
            additionalProperties: false
            properties:
              text:
                type: string
                minLength: 1
                maxLength: 500
                pattern: "\\S"
              isCorrect:
                type: boolean
    QuizTrueFalseQuestionInput:
      type: object
      required: [type, prompt, points, correctAnswer]
      additionalProperties: false
      properties:
        type:
          type: string
          const: true_false
        prompt:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: "\\S"
        points:
          type: integer
          minimum: 1
          maximum: 100
        correctAnswer:
          type: boolean
    QuizQuestionInput:
      oneOf:
        - $ref: "#/components/schemas/QuizChoiceQuestionInput"
        - $ref: "#/components/schemas/QuizTrueFalseQuestionInput"
    QuizOptionWithKey:
      type: object
      required: [id, text, isCorrect]
      additionalProperties: false
      properties:
        id:
          type: string
        text:
          type: string
        isCorrect:
          type: boolean
    QuizOption:
      type: object
      required: [id, text]
      additionalProperties: false
      properties:
        id:
          type: string
        text:
          type: string
    QuizQuestion:
      type: object
      description: Staff view of a question, including the answer key. True/false questions use the options `true` and `false`.
      required: [id, position, type, prompt, points, options]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
        type:
          $ref: "#/components/schemas/QuizQuestionType"
        prompt:
          type: string
        points:
          type: integer
        options:
          type: array
          items:
            $ref: "#/components/schemas/QuizOptionWithKey"
    QuizQuestionList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuizQuestion"
    QuizAnswerInput:
      type: object
      required: [questionId, selectedOptionIds]
      additionalProperties: false
      properties:
        questionId:
          type: string
          format: uuid
        selectedOptionIds:
          type: array
          maxItems: 10
          items:
            type: string
    QuizAnswersSave:
      type: object
      required: [answers]
      additionalProperties: false
      properties:
        answers:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/QuizAnswerInput"
    QuizAttemptSubmit:
      type: object
      description: Only answers may be sent. Scores or results are rejected (`400`).
      additionalProperties: false
      properties:
        answers:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/QuizAnswerInput"
    QuizAttemptStatus:
      type: string
      enum: [in_progress, submitted]
    StudentQuizAttempt:
      type: object
      description: A student's own attempt. Never contains answer keys, correctness or scores.
      required: [id, activityId, attemptNumber, attemptLimit, status, startedAt, deadlineAt, submittedAt, closedByTimeLimit, resultsReleased, questions]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        activityId:
          type: string
          format: uuid
        attemptNumber:
          type: integer
        attemptLimit:
          type: integer
        status:
          $ref: "#/components/schemas/QuizAttemptStatus"
        startedAt:
          type: string
          format: date-time
        deadlineAt:
          type: [string, "null"]
          format: date-time
          description: Server deadline; the server enforces it regardless of the browser clock.
        submittedAt:
          type: [string, "null"]
          format: date-time
        closedByTimeLimit:
          type: boolean
        resultsReleased:
          type: boolean
          description: |
            True once staff have released this student's grade for the quiz (see
            `GET /api/v1/courses/{id}/grades/mine`). Per-attempt scores and answer keys are never
            returned to students.
        questions:
          type: array
          items:
            type: object
            required: [questionId, position, type, prompt, points, options, selectedOptionIds]
            additionalProperties: false
            properties:
              questionId:
                type: string
                format: uuid
              position:
                type: integer
              type:
                $ref: "#/components/schemas/QuizQuestionType"
              prompt:
                type: string
              points:
                type: integer
              options:
                type: array
                description: In the order fixed for this attempt.
                items:
                  $ref: "#/components/schemas/QuizOption"
              selectedOptionIds:
                type: array
                items:
                  type: string
    QuizAttemptStatusItem:
      type: object
      required: [id, attemptNumber, status, startedAt, deadlineAt, submittedAt, closedByTimeLimit]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        attemptNumber:
          type: integer
        status:
          $ref: "#/components/schemas/QuizAttemptStatus"
        startedAt:
          type: string
          format: date-time
        deadlineAt:
          type: [string, "null"]
          format: date-time
        submittedAt:
          type: [string, "null"]
          format: date-time
        closedByTimeLimit:
          type: boolean
    StudentQuizAttemptSummary:
      type: object
      required: [attemptLimit, attemptsUsed, timeLimitMinutes, activeAttemptId, gradeReleased, items]
      additionalProperties: false
      properties:
        attemptLimit:
          type: integer
        attemptsUsed:
          type: integer
        gradeReleased:
          type: boolean
          description: True once staff have released this student's grade for the quiz.
        timeLimitMinutes:
          type: [integer, "null"]
        activeAttemptId:
          type: [string, "null"]
          format: uuid
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuizAttemptStatusItem"
    QuizResultStudent:
      type: object
      required: [id, email, givenName, familyName]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        givenName:
          type: string
        familyName:
          type: string
    QuizResult:
      type: object
      required: [attemptId, attemptNumber, status, startedAt, deadlineAt, submittedAt, closedByTimeLimit, score, maxScore, student]
      additionalProperties: false
      properties:
        attemptId:
          type: string
          format: uuid
        attemptNumber:
          type: integer
        status:
          $ref: "#/components/schemas/QuizAttemptStatus"
        startedAt:
          type: string
          format: date-time
        deadlineAt:
          type: [string, "null"]
          format: date-time
        submittedAt:
          type: [string, "null"]
          format: date-time
        closedByTimeLimit:
          type: boolean
        score:
          type: [integer, "null"]
          description: Server-computed; null while in progress.
        maxScore:
          type: integer
        student:
          $ref: "#/components/schemas/QuizResultStudent"
    QuizResultPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuizResult"
        nextCursor:
          type: [string, "null"]
    QuizAttemptResult:
      allOf:
        - $ref: "#/components/schemas/QuizResult"
        - type: object
          required: [questions]
          properties:
            questions:
              type: array
              items:
                type: object
                required: [questionId, position, type, prompt, points, options, selectedOptionIds, awardedPoints, isCorrect]
                additionalProperties: false
                properties:
                  questionId:
                    type: string
                    format: uuid
                  position:
                    type: integer
                  type:
                    $ref: "#/components/schemas/QuizQuestionType"
                  prompt:
                    type: string
                  points:
                    type: integer
                  options:
                    type: array
                    items:
                      $ref: "#/components/schemas/QuizOptionWithKey"
                  selectedOptionIds:
                    type: array
                    items:
                      type: string
                  awardedPoints:
                    type: [integer, "null"]
                  isCorrect:
                    type: [boolean, "null"]
    Grade20:
      type: number
      minimum: 0
      maximum: 20
      description: |
        Grade on the 0–20 scale: points × 20 / maxPoints, rounded half up to one decimal place
        (for example 15.55 → 15.6). Always calculated by the server.
    GradableType:
      type: string
      enum: [quiz, assignment]
    AssignmentSubmissionCreate:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 50000
          pattern: "\\S"
          description: Plain text; rendered as text, never as HTML.
    RubricScore:
      type: object
      required: [criterionId, title, points, maxPoints]
      additionalProperties: false
      properties:
        criterionId:
          type: string
          format: uuid
        title:
          type: string
        points:
          type: integer
        maxPoints:
          type: integer
    ReleasedGrade:
      type: object
      description: A grade exactly as released to the student. Never includes answer keys.
      required: [points, maxPoints, grade20, releasedAt, feedback, criteria]
      additionalProperties: false
      properties:
        points:
          type: integer
        maxPoints:
          type: integer
        grade20:
          $ref: "#/components/schemas/Grade20"
        releasedAt:
          type: string
          format: date-time
        feedback:
          type: [string, "null"]
        criteria:
          type: array
          description: Rubric scores (assignments); empty for quizzes.
          items:
            $ref: "#/components/schemas/RubricScore"
    StudentGradeStatus:
      type: string
      description: "`pending` covers every unreleased state; no numbers are returned for it."
      enum: [pending, released]
    StudentAssignmentSubmission:
      type: object
      required: [id, activityId, body, submittedAt, isLate, gradeStatus, grade]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        activityId:
          type: string
          format: uuid
        body:
          type: string
        submittedAt:
          type: string
          format: date-time
          description: Recorded by the server clock.
        isLate:
          type: boolean
        gradeStatus:
          $ref: "#/components/schemas/StudentGradeStatus"
        grade:
          oneOf:
            - $ref: "#/components/schemas/ReleasedGrade"
            - type: "null"
    StudentAssignmentStatus:
      type: object
      required: [dueAt, lateUntil, acceptingSubmissions, submission]
      additionalProperties: false
      properties:
        dueAt:
          type: string
          format: date-time
        lateUntil:
          type: [string, "null"]
          format: date-time
        acceptingSubmissions:
          type: boolean
          description: Whether the server would accept a submission from this student now.
        submission:
          oneOf:
            - $ref: "#/components/schemas/StudentAssignmentSubmission"
            - type: "null"
    GradeStatus:
      type: string
      description: |
        Staff view of one gradebook entry: `not_submitted`, `needs_grading` (submitted, not graded),
        `unreleased` (graded, never released), `released`, or `changed_since_release` (the student
        still sees the previously released grade).
      enum: [not_submitted, needs_grading, unreleased, released, changed_since_release]
    StaffGrade:
      type: object
      required: [points, maxPoints, grade20, gradedAt, releasedAt]
      additionalProperties: false
      properties:
        points:
          type: integer
        maxPoints:
          type: integer
        grade20:
          $ref: "#/components/schemas/Grade20"
        gradedAt:
          type: string
          format: date-time
        releasedAt:
          type: [string, "null"]
          format: date-time
          description: Time of the last release, if any.
    AssignmentSubmissionSummary:
      type: object
      required: [id, student, submittedAt, isLate, status, grade]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        student:
          $ref: "#/components/schemas/QuizResultStudent"
        submittedAt:
          type: string
          format: date-time
        isLate:
          type: boolean
        status:
          $ref: "#/components/schemas/GradeStatus"
        grade:
          oneOf:
            - $ref: "#/components/schemas/StaffGrade"
            - type: "null"
    AssignmentSubmissionPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AssignmentSubmissionSummary"
        nextCursor:
          type: [string, "null"]
    AssignmentSubmissionDetail:
      type: object
      required: [id, student, submittedAt, isLate, status, grade, body, rubric, scores, feedback]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        student:
          $ref: "#/components/schemas/QuizResultStudent"
        submittedAt:
          type: string
          format: date-time
        isLate:
          type: boolean
        status:
          $ref: "#/components/schemas/GradeStatus"
        grade:
          oneOf:
            - $ref: "#/components/schemas/StaffGrade"
            - type: "null"
        body:
          type: string
        rubric:
          type: array
          description: The rubric as approved when the student submitted.
          items:
            $ref: "#/components/schemas/RubricCriterion"
        scores:
          type: array
          items:
            $ref: "#/components/schemas/RubricScore"
        feedback:
          type: [string, "null"]
    RubricScoreInput:
      type: object
      required: [criterionId, points]
      additionalProperties: false
      properties:
        criterionId:
          type: string
          format: uuid
        points:
          type: integer
          minimum: 0
          maximum: 100
    AssignmentGradeInput:
      type: object
      required: [scores]
      additionalProperties: false
      properties:
        scores:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/RubricScoreInput"
        feedback:
          type: string
          maxLength: 5000
    GradeReleaseResult:
      type: object
      required: [activityId, releasedCount, releasedAt]
      additionalProperties: false
      properties:
        activityId:
          type: string
          format: uuid
        releasedCount:
          type: integer
          description: Grades released by this call (0 when nothing changed since the last release).
        releasedAt:
          type: [string, "null"]
          format: date-time
    GradebookColumn:
      type: object
      required: [activityId, title, type, maxPoints]
      additionalProperties: false
      properties:
        activityId:
          type: string
          format: uuid
        title:
          type: string
        type:
          $ref: "#/components/schemas/GradableType"
        maxPoints:
          type: integer
          description: Points of the approved version.
    GradebookCell:
      type: object
      required: [activityId, status, points, maxPoints, grade20, releasedAt]
      additionalProperties: false
      properties:
        activityId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/GradeStatus"
        points:
          type: [integer, "null"]
        maxPoints:
          type: [integer, "null"]
        grade20:
          oneOf:
            - $ref: "#/components/schemas/Grade20"
            - type: "null"
        releasedAt:
          type: [string, "null"]
          format: date-time
    CourseTotal:
      type: object
      description: Sum of points over the counted items, converted to the 0–20 scale (null when none).
      required: [points, maxPoints, grade20, gradedItems]
      additionalProperties: false
      properties:
        points:
          type: integer
        maxPoints:
          type: integer
        grade20:
          oneOf:
            - $ref: "#/components/schemas/Grade20"
            - type: "null"
        gradedItems:
          type: integer
    GradebookRow:
      type: object
      required: [student, cells, total]
      additionalProperties: false
      properties:
        student:
          $ref: "#/components/schemas/QuizResultStudent"
        cells:
          type: array
          description: One cell per column, in column order.
          items:
            $ref: "#/components/schemas/GradebookCell"
        total:
          $ref: "#/components/schemas/CourseTotal"
    Gradebook:
      type: object
      required: [scaleMax, columns, items, nextCursor]
      additionalProperties: false
      properties:
        scaleMax:
          type: integer
          const: 20
        columns:
          type: array
          items:
            $ref: "#/components/schemas/GradebookColumn"
        items:
          type: array
          items:
            $ref: "#/components/schemas/GradebookRow"
        nextCursor:
          type: [string, "null"]
    StudentGradeItem:
      type: object
      required: [activityId, title, type, status, grade]
      additionalProperties: false
      properties:
        activityId:
          type: string
          format: uuid
        title:
          type: string
        type:
          $ref: "#/components/schemas/GradableType"
        status:
          $ref: "#/components/schemas/StudentGradeStatus"
        grade:
          oneOf:
            - $ref: "#/components/schemas/ReleasedGrade"
            - type: "null"
    StudentGrades:
      type: object
      required: [scaleMax, items, total]
      additionalProperties: false
      properties:
        scaleMax:
          type: integer
          const: 20
        items:
          type: array
          items:
            $ref: "#/components/schemas/StudentGradeItem"
        total:
          $ref: "#/components/schemas/CourseTotal"
    TutorLanguage:
      type: string
      description: Response language. Sources are never translated.
      enum: [en, es]
    TutorProvider:
      type: object
      required: [mode, label]
      additionalProperties: false
      properties:
        mode:
          type: string
          description: "`mock`: a local, deterministic provider that quotes approved lesson passages. No language model is used."
          enum: [mock]
        label:
          type: string
          description: Notice to display with every response (for example "Mock AI — local demonstration").
    TutorGrounding:
      type: string
      description: "`grounded` when approved lesson passages support the response; otherwise `insufficient_material`."
      enum: [grounded, insufficient_material]
    TutorMessageRequest:
      type: object
      required: [question, language]
      additionalProperties: false
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 500
          pattern: "\\S"
        language:
          $ref: "#/components/schemas/TutorLanguage"
    TutorPracticeRequest:
      type: object
      required: [language]
      additionalProperties: false
      properties:
        language:
          $ref: "#/components/schemas/TutorLanguage"
        topic:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
    TutorCitation:
      type: object
      required: [ref, activityId, sectionId, title, excerpt, sourceLanguage, matchesRequestedLanguage]
      additionalProperties: false
      properties:
        ref:
          type: integer
          minimum: 1
          description: Number used in the response text, e.g. [1].
        activityId:
          type: string
          format: uuid
          description: The approved lesson the excerpt comes from.
        sectionId:
          type: string
          format: uuid
        title:
          type: string
          description: Title of the approved lesson version.
        excerpt:
          type: string
          maxLength: 402
          description: Verbatim text from the approved lesson, possibly shortened with "…"; never translated.
        sourceLanguage:
          type: string
          description: Detected language of the source passage (simple word-list heuristic).
          enum: [en, es, unknown]
        matchesRequestedLanguage:
          type: boolean
    TutorUsageSummary:
      type: object
      required: [limit, windowMinutes, usedInWindow]
      additionalProperties: false
      properties:
        limit:
          type: integer
        windowMinutes:
          type: integer
        usedInWindow:
          type: integer
    TutorMessageResponse:
      type: object
      required: [provider, language, grounding, text, citations, usage]
      additionalProperties: false
      properties:
        provider:
          $ref: "#/components/schemas/TutorProvider"
        language:
          $ref: "#/components/schemas/TutorLanguage"
        grounding:
          $ref: "#/components/schemas/TutorGrounding"
        text:
          type: string
          maxLength: 4000
          description: Plain text to render as text, never as HTML.
        citations:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/TutorCitation"
        usage:
          $ref: "#/components/schemas/TutorUsageSummary"
    TutorPracticePrompt:
      type: object
      required: [ref, kind, text, citation]
      additionalProperties: false
      properties:
        ref:
          type: integer
          minimum: 1
        kind:
          type: string
          enum: [explain, key_terms]
        text:
          type: string
          maxLength: 800
        citation:
          $ref: "#/components/schemas/TutorCitation"
    TutorPracticeResponse:
      type: object
      required: [provider, language, grounding, prompts, usage]
      additionalProperties: false
      properties:
        provider:
          $ref: "#/components/schemas/TutorProvider"
        language:
          $ref: "#/components/schemas/TutorLanguage"
        grounding:
          $ref: "#/components/schemas/TutorGrounding"
        prompts:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/TutorPracticePrompt"
        usage:
          $ref: "#/components/schemas/TutorUsageSummary"
    TutorUsageRecord:
      type: object
      required: [id, kind, language, outcome, providerMode, sourceActivityIds, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [message, practice]
        language:
          $ref: "#/components/schemas/TutorLanguage"
        outcome:
          $ref: "#/components/schemas/TutorGrounding"
        providerMode:
          type: string
          enum: [mock]
        sourceActivityIds:
          type: array
          items:
            type: string
            format: uuid
        createdAt:
          type: string
          format: date-time
    TutorUsage:
      type: object
      required: [limit, windowMinutes, usedInWindow, totalRequests, items]
      additionalProperties: false
      properties:
        limit:
          type: integer
        windowMinutes:
          type: integer
        usedInWindow:
          type: integer
        totalRequests:
          type: integer
        items:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/TutorUsageRecord"
    ProgramUpdate:
      type: object
      required: [name, isActive]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        description:
          type: [string, "null"]
          maxLength: 2000
          description: Omit, null or blank to clear.
        isActive:
          type: boolean
          description: Inactive programs keep their subjects and courses but cannot receive new courses.
    TermUpdate:
      type: object
      required: [name, startsOn, endsOn]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
    CourseTemplateDetail:
      type: object
      description: A reusable subject (course template) with its latest version, including sections.
      required: [id, programId, code, title, description, versionCount, latestVersion, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        programId:
          type: [string, "null"]
          format: uuid
        code:
          $ref: "#/components/schemas/Code"
        title:
          type: string
        description:
          type: [string, "null"]
        versionCount:
          type: integer
        latestVersion:
          oneOf:
            - $ref: "#/components/schemas/CourseTemplateVersion"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
