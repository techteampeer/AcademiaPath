        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/courses/{id}/sections/{sectionId}/resource-folders/order:
    put:
      operationId: orderResourceFolders
      summary: Reorder a section's resource folders
      description: |
        Requires `content.edit` or the administrator role. `folderIds` must list every folder of the
        section exactly once; otherwise `409 RESOURCE_ORDER_STALE`. Audited as `resource_folder.reordered`.
      tags: [Content]
      security:
        - sessionCookie: []
          csrfToken: []
