        - draft
        - published
        - archived
    Program:
      type: object
      required: [id, code, name, description, isActive, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        code:
          $ref: "#/components/schemas/Code"
        name:
          type: string
        description:
          type: [string, "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProgramCreate:
      type: object
      required: [code, name]
      additionalProperties: false
      properties:
        code:
          $ref: "#/components/schemas/Code"
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
    ProgramPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Program"
        nextCursor:
          type: [string, "null"]
    Term:
      type: object
      required: [id, code, name, academicYear, startsOn, endsOn, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        code:
          $ref: "#/components/schemas/Code"
        name:
          type: string
        academicYear:
          type: integer
          description: Academic year the term belongs to (for example 2026 for `2026-2`).
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TermCreate:
      type: object
      required: [code, name, startsOn, endsOn]
      additionalProperties: false
      properties:
        code:
          $ref: "#/components/schemas/Code"
          description: Peru-style labels such as `2026-1` and `2026-2` are recommended.
        name:
          type: string
          minLength: 1
          maxLength: 200
        academicYear:
          type: integer
          minimum: 2000
          maximum: 2100
          description: |
            Defaults to the year in a `YYYY-…` code, otherwise to the year of `startsOn`. When the code
            starts with a year, it must match (`TERM_YEAR_MISMATCH`).
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
    TermPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Term"
        nextCursor:
          type: [string, "null"]
    TemplateSectionInput:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        summary:
          type: string
          maxLength: 2000
        isVisible:
          type: boolean
          default: true
    CourseTemplateCreate:
      type: object
      required: [code, title, sections]
      additionalProperties: false
      properties:
        code:
          $ref: "#/components/schemas/Code"
        programId:
          type: [string, "null"]
          format: uuid
          description: Omit or null for templates shared across programs.
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        baseVersion:
          type: integer
          minimum: 0
          description: |
            Optional guard. `0`: create a new subject only (`TEMPLATE_CODE_TAKEN` if the code exists).
            `n`: create version `n + 1` only if `n` is still the latest (`TEMPLATE_VERSION_CONFLICT`
            otherwise). Omit for the original behaviour (create or add a version).
        sections:
          type: array
          maxItems: 100
          description: Ordered sections; positions are assigned from array order.
          items:
            $ref: "#/components/schemas/TemplateSectionInput"
    TemplateSection:
      type: object
      required: [id, title, summary, position, isVisible]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        summary:
          type: [string, "null"]
        position:
          type: integer
          minimum: 0
        isVisible:
          type: boolean
    CourseTemplateVersion:
      type: object
      description: An immutable template version and its sections.
      required: [id, templateId, programId, code, version, title, description, sections, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
        programId:
          type: [string, "null"]
          format: uuid
        code:
          $ref: "#/components/schemas/Code"
        version:
          type: integer
          minimum: 1
        title:
          type: string
        description:
          type: [string, "null"]
        sections:
          type: array
          items:
            $ref: "#/components/schemas/TemplateSection"
        createdAt:
          type: string
          format: date-time
    CourseTemplate:
      type: object
      required: [id, programId, code, title, description, latestVersion, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        programId:
          type: [string, "null"]
          format: uuid
        code:
          $ref: "#/components/schemas/Code"
        title:
          type: string
          description: Title of the latest version.
        description:
          type: [string, "null"]
        latestVersion:
          type: [object, "null"]
          description: Null only for templates created before versioning (no versions yet).
          required: [id, version, createdAt]
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            version:
              type: integer
              minimum: 1
            createdAt:
              type: string
              format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CourseTemplatePage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CourseTemplate"
        nextCursor:
          type: [string, "null"]
    Course:
      type: object
      required:
        - id
        - programId
        - termId
        - templateId
        - templateVersionId
        - code
        - title
        - description
        - status
        - viewerRole
        - version
        - createdAt
        - updatedAt
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        programId:
          type: [string, "null"]
          format: uuid
        termId:
          type: string
          format: uuid
        templateId:
          type: [string, "null"]
          format: uuid
        templateVersionId:
          type: [string, "null"]
          format: uuid
        code:
          $ref: "#/components/schemas/Code"
        title:
          type: string
        description:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/CourseStatus"
        viewerRole:
          description: The caller's role in this course, or null (e.g. an administrator who is not enrolled).
          oneOf:
            - $ref: "#/components/schemas/CourseRole"
            - type: "null"
        version:
          type: integer
          minimum: 1
          description: Concurrency token for course administration; incremented by every lifecycle change.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CourseCreate:
      type: object
      required: [programId, termId, templateId, code]
      additionalProperties: false
      properties:
        programId:
          type: string
          format: uuid
        termId:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
        templateVersion:
          type: integer
          minimum: 1
          description: Defaults to the template's latest version.
        code:
          $ref: "#/components/schemas/Code"
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Defaults to the template version's title.
        description:
          type: string
          maxLength: 2000
        status:
          type: string
          enum: [draft, published]
          default: draft
    CoursePage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Course"
        nextCursor:
          type: [string, "null"]
    Section:
      type: object
      required: [id, title, summary, position, isVisible]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        summary:
          type: [string, "null"]
        position:
          type: integer
          minimum: 0
        isVisible:
          type: boolean
    SectionPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Section"
        nextCursor:
          type: [string, "null"]
    EnrollmentCreate:
      type: object
      required: [role]
      additionalProperties: false
      oneOf:
        - required: [userId]
        - required: [email]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          minLength: 1
          maxLength: 254
        role:
          $ref: "#/components/schemas/CourseRole"
    Enrollment:
      type: object
      required: [id, courseId, role, status, user, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/CourseRole"
        status:
          type: string
          enum: [active, inactive]
        user:
          type: object
          required: [id, email, givenName, familyName]
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            givenName:
              type: string
            familyName:
              type: string
        createdAt:
          type: string
          format: date-time
    EnrollmentPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Enrollment"
        nextCursor:
          type: [string, "null"]
    ActivityType:
      type: string
      description: Content types supported by the content API. `file` activities are documents, created only by uploading.
      enum: [page, link, quiz, assignment, file]
    ReviewStatus:
      type: string
      enum: [draft, submitted, approved, returned]
    PageContent:
      type: object
      description: Plain-text lesson. Clients must render `body` as text, never as HTML.
      required: [body]
      additionalProperties: false
      properties:
        body:
          type: string
    LinkContent:
      type: object
      description: External resource. `url` is an absolute https URL (http only for links stored before AP-021).
      required: [url, description, kind]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
        description:
          type: [string, "null"]
        kind:
          $ref: "#/components/schemas/ResourceKind"
    QuizContent:
      type: object
      description: Quiz settings and totals. Questions and answer keys are never part of an activity.
      required: [instructions, attemptLimit, timeLimitMinutes, shuffleQuestions, shuffleOptions, passingScorePercent, showFeedback, questionsPerAttempt, questionCount, totalPoints]
      additionalProperties: false
      properties:
        instructions:
          type: [string, "null"]
        attemptLimit:
          type: integer
          minimum: 1
        timeLimitMinutes:
          type: [integer, "null"]
        shuffleQuestions:
          type: boolean
        shuffleOptions:
          type: boolean
        passingScorePercent:
          type: [integer, "null"]
          description: Minimum percentage to pass; null when the quiz has no passing threshold.
        showFeedback:
          type: boolean
          description: Students may review per-question correctness after their grade is released (never the answer key).
        questionsPerAttempt:
          type: [integer, "null"]
          description: Questions drawn at random from the approved questions for each attempt; null = all.
        questionCount:
          type: integer
        totalPoints:
          type: integer
    RubricCriterion:
      type: object
      required: [id, title, description, maxPoints]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: [string, "null"]
        maxPoints:
          type: integer
          minimum: 1
          maximum: 100
    AssignmentContent:
      type: object
      description: Assignment instructions, deadline, late-submission window and points-based rubric.
      required: [instructions, dueAt, lateUntil, rubric, totalPoints]
      additionalProperties: false
      properties:
        instructions:
          type: string
        dueAt:
          type: string
          format: date-time
        lateUntil:
          type: [string, "null"]
          format: date-time
          description: When set, submissions after `dueAt` and up to this time are accepted and flagged late.
        rubric:
          type: array
          items:
            $ref: "#/components/schemas/RubricCriterion"
        totalPoints:
          type: integer
    DocumentContent:
      type: object
      description: |
        Uploaded document (activity type `file`). Text and summaries are read from the document
        endpoint; `summaryRevision` is the summary revision of this version (working or live).
      required: [documentId, fileName, format, summaryRevision]
      additionalProperties: false
      properties:
        documentId:
          type: string
          format: uuid
        fileName:
          type: string
        format:
          $ref: "#/components/schemas/DocumentFormat"
        summaryRevision:
          type: integer
          minimum: 1
    ActivityContent:
      oneOf:
        - $ref: "#/components/schemas/PageContent"
        - $ref: "#/components/schemas/LinkContent"
        - $ref: "#/components/schemas/QuizContent"
        - $ref: "#/components/schemas/AssignmentContent"
        - $ref: "#/components/schemas/DocumentContent"
    PageContentInput:
      type: object
      required: [title, body]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        body:
          type: string
          minLength: 1
          maxLength: 20000
          pattern: "\\S"
          description: Plain text; line breaks are preserved. HTML is not interpreted.
    LinkContentInput:
      type: object
      required: [title, url]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        url:
          type: string
          minLength: 1
          maxLength: 2048
          description: Absolute `https:` URL on a domain name (no IP addresses or localhost), without embedded credentials.
        description:
          type: string
          maxLength: 1000
        kind:
          $ref: "#/components/schemas/ResourceKind"
    QuizSettingsInput:
      type: object
      required: [title, attemptLimit]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        instructions:
          type: string
          maxLength: 5000
        attemptLimit:
          type: integer
          minimum: 1
          maximum: 10
        timeLimitMinutes:
          type: [integer, "null"]
          minimum: 1
          maximum: 300
          description: Enforced by the server clock. Omit or null for no time limit.
        shuffleQuestions:
          type: boolean
          default: false
        shuffleOptions:
          type: boolean
          default: false
          description: Shuffles options of choice questions (not true/false).
        passingScorePercent:
          type: [integer, "null"]
          minimum: 1
          maximum: 100
          description: Minimum percentage to pass. Omit or null for no threshold.
        showFeedback:
          type: boolean
          default: false
          description: Lets students review per-question correctness (not the answer key) after their grade is released.
        questionsPerAttempt:
          type: [integer, "null"]
          minimum: 1
          maximum: 100
          description: |
            Draw this many questions at random from the approved questions for each attempt. The quiz must then
            have at least that many questions, all worth the same points (`422 QUIZ_POOL_TOO_SMALL`,
            `422 QUIZ_POOL_POINTS_MIXED` on submission for review and approval). Omit or null to use every question.
    RubricCriterionInput:
      type: object
      required: [title, maxPoints]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        description:
          type: string
          maxLength: 1000
        maxPoints:
          type: integer
          minimum: 1
          maximum: 100
    AssignmentInput:
      type: object
      required: [title, instructions, dueAt, rubric]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        instructions:
          type: string
          minLength: 1
          maxLength: 20000
          pattern: "\\S"
          description: Plain text; line breaks are preserved. HTML is not interpreted.
        dueAt:
          type: string
          format: date-time
        lateUntil:
          type: [string, "null"]
          format: date-time
          description: |
            Optional end of the late-submission window. Must be after `dueAt` and at most 30 days
            later (`INVALID_DUE_DATE`). Omit or null to reject submissions after `dueAt`.
        rubric:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/RubricCriterionInput"
    ActivityCreate:
      oneOf:
        - allOf:
            - $ref: "#/components/schemas/PageContentInput"
            - type: object
              required: [type]
              properties:
                type:
                  type: string
                  const: page
                folderId:
                  type: string
                  format: uuid
                  description: Optional resource folder of the same section.
        - allOf:
            - $ref: "#/components/schemas/LinkContentInput"
            - type: object
              required: [type]
              properties:
                type:
                  type: string
                  const: link
                folderId:
                  type: string
                  format: uuid
                  description: Optional resource folder of the same section.
        - allOf:
            - $ref: "#/components/schemas/QuizSettingsInput"
            - type: object
              required: [type]
              properties:
                type:
                  type: string
                  const: quiz
        - allOf:
            - $ref: "#/components/schemas/AssignmentInput"
            - type: object
              required: [type]
              properties:
                type:
                  type: string
                  const: assignment
    ActivityUpdate:
      description: Must match the activity's type.
      oneOf:
        - $ref: "#/components/schemas/PageContentInput"
        - $ref: "#/components/schemas/LinkContentInput"
        - $ref: "#/components/schemas/QuizSettingsInput"
        - $ref: "#/components/schemas/AssignmentInput"
    ActivityReviewDecision:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [approve, return]
        comment:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: "\\S"
          description: Required when returning content.
    ActivityReview:
      type: object
      description: Review metadata (staff only).
      required: [status, comment, submittedAt, submittedByUserId, reviewedAt, reviewedByUserId]
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/ReviewStatus"
        comment:
          type: [string, "null"]
        submittedAt:
          type: [string, "null"]
          format: date-time
        submittedByUserId:
          type: [string, "null"]
          format: uuid
        reviewedAt:
          type: [string, "null"]
          format: date-time
        reviewedByUserId:
          type: [string, "null"]
          format: uuid
    ActivityLiveVersion:
      type: object
      description: The approved version students currently see (staff only).
      required: [title, content, approvedAt]
      additionalProperties: false
      properties:
        title:
          type: string
        content:
          $ref: "#/components/schemas/ActivityContent"
        approvedAt:
          type: string
          format: date-time
    QualityIssueCode:
      type: string
      description: |
        Stable code of a content quality finding (AP-029). Blocking: ACTIVITY_TITLE_EMPTY, PAGE_BODY_EMPTY,
        LINK_URL_INVALID, QUIZ_NO_QUESTIONS, QUIZ_POOL_TOO_SMALL, QUIZ_POOL_POINTS_MIXED, QUIZ_QUESTION_PROMPT_EMPTY,
        QUIZ_QUESTION_OPTIONS_INCOMPLETE, QUIZ_QUESTION_ANSWER_INVALID, QUIZ_QUESTION_POINTS_INVALID,
        ASSIGNMENT_INSTRUCTIONS_EMPTY, ASSIGNMENT_RUBRIC_EMPTY, ASSIGNMENT_RUBRIC_CRITERION_INVALID,
        ASSIGNMENT_DATES_INVALID, DOCUMENT_REFERENCE_INVALID. Every other code is a warning.
      enum:
        - ACTIVITY_TITLE_EMPTY
        - PAGE_BODY_EMPTY
        - LINK_URL_INVALID
        - QUIZ_NO_QUESTIONS
        - QUIZ_POOL_TOO_SMALL
        - QUIZ_POOL_POINTS_MIXED
        - QUIZ_QUESTION_PROMPT_EMPTY
        - QUIZ_QUESTION_OPTIONS_INCOMPLETE
        - QUIZ_QUESTION_ANSWER_INVALID
        - QUIZ_QUESTION_POINTS_INVALID
        - ASSIGNMENT_INSTRUCTIONS_EMPTY
        - ASSIGNMENT_RUBRIC_EMPTY
        - ASSIGNMENT_RUBRIC_CRITERION_INVALID
        - ASSIGNMENT_DATES_INVALID
        - DOCUMENT_REFERENCE_INVALID
        - PLACEHOLDER_TEXT
        - TEXT_LINK_UNSAFE_SCHEME
        - TEXT_LINK_INSECURE
        - INTERNAL_LINK_BROKEN
        - LINK_MEDIA_DESCRIPTION_MISSING
        - QUIZ_DUPLICATE_OPTIONS
        - ASSIGNMENT_DEADLINE_PASSED
        - DOCUMENT_NO_TEXT
        - DOCUMENT_TEXT_TRUNCATED
        - SECTION_EMPTY
        - PREREQUISITE_SECTION_HIDDEN
        - PREREQUISITE_SECTION_EMPTY
        - COURSE_DESCRIPTION_MISSING
        - COURSE_NO_SECTIONS
        - COURSE_NO_STUDENT_CONTENT
    QualityFinding:
      type: object
      additionalProperties: false
      required: [code, severity, target, sectionId, activityId, field, itemId, itemNumber, value]
      properties:
        code:
          $ref: "#/components/schemas/QualityIssueCode"
        severity:
          type: string
          enum: [blocking, warning]
        target:
          type: string
          enum: [course, section, activity]
        sectionId:
          type: ["string", "null"]
          format: uuid
        activityId:
          type: ["string", "null"]
          format: uuid
        field:
          type: ["string", "null"]
          description: |
            Part of the target to correct: title, description, summary, body, url, instructions, settings,
            questions, question, option, rubric, criterion, dates, document, activities, prerequisites or sections.
        itemId:
          type: ["string", "null"]
          description: Quiz question or rubric criterion the finding is about.
        itemNumber:
          type: ["integer", "null"]
          minimum: 1
          description: 1-based number of that question or criterion, for display.
        value:
          type: ["string", "null"]
          description: |
            One short value for the message (authored text, never translated): the placeholder found, the URL,
            the number of questions drawn, the file name, the deadline, or the id of the required section.
    QualityReport:
      type: object
      additionalProperties: false
      required: [courseId, scope, activityId, checkedAt, summary, sections, activities, findings]
      properties:
        courseId:
          type: string
          format: uuid
        scope:
          type: string
          enum: [course, activity]
        activityId:
          type: ["string", "null"]
          format: uuid
        checkedAt:
          type: string
          format: date-time
        summary:
          type: object
          additionalProperties: false
          required: [blocking, warnings, sections, activities, questions]
          properties:
            blocking: { type: integer, minimum: 0 }
            warnings: { type: integer, minimum: 0 }
            sections: { type: integer, minimum: 0 }
            activities: { type: integer, minimum: 0 }
            questions: { type: integer, minimum: 0 }
        sections:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, title, position, isVisible]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              position: { type: integer }
              isVisible: { type: boolean }
        activities:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, sectionId, type, title, reviewStatus]
            properties:
              id: { type: string, format: uuid }
              sectionId: { type: string, format: uuid }
              type:
                type: string
                enum: [page, link, quiz, assignment, file]
              title: { type: string }
              reviewStatus:
                type: string
                enum: [draft, submitted, approved, returned]
        findings:
          type: array
          items:
            $ref: "#/components/schemas/QualityFinding"
    Activity:
      type: object
      description: |
        For staff, `title`/`content` are the working copy and `review`/`liveVersion` are present.
        For students, `title`/`content` are the approved live version and `review`/`liveVersion` are null.
      required: [id, courseId, sectionId, folderId, type, position, isVisible, title, content, review, liveVersion, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        sectionId:
          type: string
          format: uuid
        folderId:
          type: [string, "null"]
          format: uuid
          description: Resource folder (reading activities only), or null.
        type:
          $ref: "#/components/schemas/ActivityType"
        position:
          type: integer
          minimum: 0
        isVisible:
          type: boolean
        title:
          type: string
        content:
          $ref: "#/components/schemas/ActivityContent"
        review:
          oneOf:
            - $ref: "#/components/schemas/ActivityReview"
            - type: "null"
        liveVersion:
          oneOf:
            - $ref: "#/components/schemas/ActivityLiveVersion"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ActivityPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
        nextCursor:
          type: [string, "null"]

    DocumentFormat:
      type: string
      enum: [pdf, docx, pptx]
    DocumentUpload:
      type: object
      required: [file]
      properties:
        title:
          type: string
          maxLength: 200
          description: Optional display title (send before `file`). Defaults to the file name without its extension.
        file:
          type: string
          contentMediaType: application/octet-stream
          description: One PDF, DOCX or PPTX file.
    DocumentSegment:
      type: object
      description: |
        One block of extracted plain text: a PDF page (`Page 3`), a PPTX slide (`Slide 2`) or a DOCX
        paragraph (`Paragraph 5`; DOCX files have no fixed pages). Clients must render `text` as
        text, never as HTML.
      required: [index, kind, label, text]
      additionalProperties: false
      properties:
        index:
          type: integer
          minimum: 0
        kind:
          type: string
          enum: [page, slide, paragraph]
        label:
          type: string
        text:
          type: string
    DocumentExtraction:
      type: object
      required: [status, detail, characterCount, segmentCount, truncated]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [extracted, no_text]
          description: "`no_text`: the file is valid but has no selectable text (for example scanned pages). No OCR is performed."
        detail:
          type: [string, "null"]
        characterCount:
          type: integer
          minimum: 0
        segmentCount:
          type: integer
          minimum: 0
        truncated:
          type: boolean
          description: True when the text was cut at the extraction limit.
    DocumentInfo:
      type: object
      required: [id, fileName, format, byteSize, uploadedAt, extraction, malwareScan, segments]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
        format:
          $ref: "#/components/schemas/DocumentFormat"
        byteSize:
          type: integer
          minimum: 1
        uploadedAt:
          type: string
          format: date-time
        extraction:
          $ref: "#/components/schemas/DocumentExtraction"
        malwareScan:
          type: object
          description: "No malware scanning service is connected yet, so uploads report `not_scanned` (scanner `none`)."
          required: [status, scanner]
          additionalProperties: false
          properties:
            status:
              type: string
              enum: [not_scanned, clean]
            scanner:
              type: string
        segments:
          type: array
          items:
            $ref: "#/components/schemas/DocumentSegment"
    DocumentSummaryPoint:
      type: object
      required: [text, evidence]
      additionalProperties: false
      properties:
        text:
          type: string
          description: An original sentence from the document (shortened with "…" when long).
        evidence:
          type: object
          required: [segmentIndex, label, quote]
          additionalProperties: false
          properties:
            segmentIndex:
              type: integer
            label:
              type: string
            quote:
              type: string
              description: The full original sentence (line breaks joined with spaces).
    DocumentSummary:
      type: object
      description: |
        One immutable summary revision. With `mode: mock` it is a deterministic extractive summary
        (no language model): the same text and revision always give the same points, and refreshing
        alternates between `key_sentences` and `section_coverage`. `insufficient_text` means there
        was not enough readable text; `points` is then empty.
      required: [id, revision, status, provider, strategy, points, sourceCharacterCount, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [ready, insufficient_text]
        provider:
          type: object
          required: [id, mode, label]
          additionalProperties: false
          properties:
            id:
              type: string
              examples: [mock-extractive-v1]
            mode:
              type: string
              enum: [mock]
            label:
              type: string
              examples: ["Mock AI summary — local demonstration"]
        strategy:
          type: string
          enum: [key_sentences, section_coverage]
        points:
          type: array
          items:
            $ref: "#/components/schemas/DocumentSummaryPoint"
        sourceCharacterCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
    DocumentDetail:
      type: object
      description: |
        Staff: the working document and summary revision, plus the approved summary as `liveSummary`
        (null until approved). Students: the approved document and summary; `liveSummary` is null.
      required: [activityId, courseId, document, summary, liveSummary]
      additionalProperties: false
      properties:
        activityId:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        document:
          $ref: "#/components/schemas/DocumentInfo"
        summary:
          oneOf:
            - $ref: "#/components/schemas/DocumentSummary"
            - type: "null"
        liveSummary:
          oneOf:
            - $ref: "#/components/schemas/DocumentSummary"
            - type: "null"
    StudyBriefLanguage:
      type: ["string", "null"]
      enum: [en, es, null]
      description: Detected language of the text (null when it cannot be told). Text is never translated.
    StudyBriefReference:
      type: object
      description: Where the text comes from, as labelled by the extraction (`Page 3`, `Slide 2`, `Paragraph 5`).
      required: [segmentIndex, kind, label]
      additionalProperties: false
      properties:
        segmentIndex:
          type: integer
        kind:
          type: string
          enum: [page, slide, paragraph]
        label:
          type: string
    StudyBriefText:
      type: object
      description: A sentence (or, for `excerpts_only`, a block of text) quoted from the document. Render as text, never HTML.
      required: [text, ref, language, shortened]
      additionalProperties: false
      properties:
        text:
          type: string
        ref:
          $ref: "#/components/schemas/StudyBriefReference"
        language:
          $ref: "#/components/schemas/StudyBriefLanguage"
        shortened:
          type: boolean
          description: >-
            True when the quoted text is incomplete: cut at a word boundary (ending with "…"), or, for an
            `excerpts_only` block, interrupted where a running header, footer or page number was removed ("…" on
            that side). Sentences interrupted that way are never quoted as sentences.
    DocumentStudyBrief:
      type: object
      required: [activityId, courseId, title, version, generator, document, brief]
      additionalProperties: false
      properties:
        activityId:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        title:
          type: string
        version:
          type: string
          enum: [working, approved]
        generator:
          type: object
          required: [id, mode]
          additionalProperties: false
          properties:
            id:
              type: string
            mode:
              type: string
              enum: [extractive]
              description: Selected from the document's text by fixed rules; never generated by a model.
        document:
          type: object
          required: [id, fileName, format, extraction]
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            fileName:
              type: string
            format:
              $ref: "#/components/schemas/DocumentFormat"
            extraction:
              type: object
              required: [status, characterCount, segmentCount, truncated]
              additionalProperties: false
              properties:
                status:
                  type: string
                  enum: [extracted, no_text]
                characterCount:
                  type: integer
                segmentCount:
                  type: integer
                truncated:
                  type: boolean
        brief:
          type: object
          required: [status, language, coverage, overview, outline, outlineTotal, keywords, concepts, excerpts, excerptsAvailable, reviewPoints, limitations, cleanup]
          additionalProperties: false
          properties:
            status:
              type: string
              enum: [complete, partial, excerpts_only, no_text]
            language:
              type: object
              required: [primary, mixed]
              additionalProperties: false
              properties:
                primary:
                  $ref: "#/components/schemas/StudyBriefLanguage"
                mixed:
                  type: boolean
                  description: The document contains both English and Spanish sentences.
            coverage:
              type: object
              required: [processedSegments, totalSegments, processedCharacters, totalCharacters]
              additionalProperties: false
              properties:
                processedSegments:
                  type: integer
                totalSegments:
                  type: integer
                processedCharacters:
                  type: integer
                totalCharacters:
                  type: integer
            overview:
              type: array
              description: The opening sentence and the most central sentence, quoted, in document order.
              items:
                $ref: "#/components/schemas/StudyBriefText"
            outline:
              type: array
              description: Headings detected in the text (DOCX title-like paragraphs, slide titles, PDF title lines), at most 12.
              items:
                type: object
                required: [text, ref]
                additionalProperties: false
                properties:
                  text:
                    type: string
                  ref:
                    $ref: "#/components/schemas/StudyBriefReference"
            outlineTotal:
              type: integer
            keywords:
              type: array
              description: Frequent distinctive words of the text, as written.
              items:
                type: string
            concepts:
              type: array
              description: Sentences that define a term ("X is …", "X es …"), quoted.
              items:
                type: object
                required: [term, text, ref, language]
                additionalProperties: false
                properties:
                  term:
                    type: string
                  text:
                    type: string
                  ref:
                    $ref: "#/components/schemas/StudyBriefReference"
                  language:
                    $ref: "#/components/schemas/StudyBriefLanguage"
            excerpts:
              type: array
              items:
                $ref: "#/components/schemas/StudyBriefText"
            excerptsAvailable:
              type: integer
              minimum: 0
              description: >-
                How many excerpts there were to choose from. For `excerpts_only`, the text blocks of the processed
                text, of which only the first `excerpts.length` are shown; otherwise the distinct sentences the key
                excerpts were selected from.
            reviewPoints:
              type: array
              description: Automatically selected review prompts (the client words them); `term` and `items` are quoted from the document.
              items:
                type: object
                required: [kind, term, items, ref, language]
                additionalProperties: false
                properties:
                  kind:
                    type: string
                    enum: [concept, list, section, excerpt]
                  term:
                    type: ["string", "null"]
                  items:
                    type: array
                    items:
                      type: string
                  ref:
                    $ref: "#/components/schemas/StudyBriefReference"
                  language:
                    $ref: "#/components/schemas/StudyBriefLanguage"
            limitations:
              type: array
              items:
                type: object
                required: [code, processed, total]
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum: [extraction_truncated, brief_limit, pages_without_text, few_sentences, no_text]
                    description: |
                      `brief_limit`: characters processed / total. `pages_without_text`: pages with text / total pages.
                      `few_sentences`: sentences found. Others carry no numbers.
                  processed:
                    type: ["integer", "null"]
                  total:
                    type: ["integer", "null"]
            cleanup:
              type: object
              required: [repeatedLinesRemoved, duplicateSentencesRemoved]
              additionalProperties: false
              properties:
                repeatedLinesRemoved:
                  type: integer
                  description: Running headers, footers and page numbers left out.
                duplicateSentencesRemoved:
                  type: integer
    QuizQuestionType:
      type: string
      description: Supported now. Matching, short answer and essay are not implemented.
      enum: [single_choice, multiple_choice, true_false]
    QuizChoiceQuestionInput:
      type: object
      required: [type, prompt, points, options]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [single_choice, multiple_choice]
        prompt:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: "\\S"
        points:
          type: integer
          minimum: 1
          maximum: 100
        options:
          type: array
          minItems: 2
          maxItems: 10
          description: Single choice needs exactly one correct option; multiple choice at least one.
          items:
            type: object
            required: [text, isCorrect]
            additionalProperties: false
            properties:
              text:
                type: string
                minLength: 1
                maxLength: 500
                pattern: "\\S"
              isCorrect:
                type: boolean
    QuizTrueFalseQuestionInput:
      type: object
      required: [type, prompt, points, correctAnswer]
      additionalProperties: false
      properties:
        type:
          type: string
          const: true_false
        prompt:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: "\\S"
        points:
          type: integer
          minimum: 1
          maximum: 100
        correctAnswer:
          type: boolean
    QuizQuestionInput:
      oneOf:
        - $ref: "#/components/schemas/QuizChoiceQuestionInput"
        - $ref: "#/components/schemas/QuizTrueFalseQuestionInput"
    QuizOptionWithKey:
      type: object
      required: [id, text, isCorrect]
      additionalProperties: false
      properties:
        id:
          type: string
        text:
          type: string
        isCorrect:
          type: boolean
    QuizOption:
      type: object
      required: [id, text]
      additionalProperties: false
      properties:
        id:
          type: string
        text:
          type: string
    QuizQuestion:
      type: object
      description: Staff view of a question, including the answer key. True/false questions use the options `true` and `false`.
      required: [id, position, type, prompt, points, options]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
        type:
          $ref: "#/components/schemas/QuizQuestionType"
        prompt:
          type: string
        points:
          type: integer
        options:
          type: array
          items:
            $ref: "#/components/schemas/QuizOptionWithKey"
    QuizQuestionList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuizQuestion"
    QuizAnswerInput:
      type: object
      required: [questionId, selectedOptionIds]
      additionalProperties: false
      properties:
        questionId:
          type: string
          format: uuid
        selectedOptionIds:
          type: array
          maxItems: 10
          items:
            type: string
    QuizAnswersSave:
      type: object
      required: [answers]
      additionalProperties: false
      properties:
        answers:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/QuizAnswerInput"
    QuizAttemptSubmit:
      type: object
      description: Only answers may be sent. Scores or results are rejected (`400`).
      additionalProperties: false
      properties:
        answers:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/QuizAnswerInput"
    QuizAttemptStatus:
      type: string
      enum: [in_progress, submitted]
    StudentQuizAttempt:
      type: object
      description: A student's own attempt. Never contains answer keys, correctness or scores.
      required: [id, activityId, attemptNumber, attemptLimit, status, startedAt, deadlineAt, submittedAt, closedByTimeLimit, resultsReleased, serverTime, questions]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        activityId:
          type: string
          format: uuid
        attemptNumber:
          type: integer
        attemptLimit:
          type: integer
        status:
          $ref: "#/components/schemas/QuizAttemptStatus"
        startedAt:
          type: string
          format: date-time
        deadlineAt:
          type: [string, "null"]
          format: date-time
          description: Server deadline; the server enforces it regardless of the browser clock.
        serverTime:
          type: string
          format: date-time
          description: The server's current time, so clients can show the remaining time without trusting their own clock.
        submittedAt:
          type: [string, "null"]
          format: date-time
        closedByTimeLimit:
          type: boolean
        resultsReleased:
          type: boolean
          description: |
            True once staff have released this student's grade for the quiz (see
            `GET /api/v1/courses/{id}/grades/mine`). Per-attempt scores and answer keys are never
            returned to students.
        questions:
          type: array
          items:
            type: object
            required: [questionId, position, type, prompt, points, options, selectedOptionIds]
            additionalProperties: false
            properties:
              questionId:
                type: string
                format: uuid
              position:
                type: integer
              type:
                $ref: "#/components/schemas/QuizQuestionType"
              prompt:
                type: string
              points:
                type: integer
              options:
                type: array
                description: In the order fixed for this attempt.
                items:
                  $ref: "#/components/schemas/QuizOption"
              selectedOptionIds:
                type: array
                items:
                  type: string
    QuizAttemptStatusItem:
      type: object
      required: [id, attemptNumber, status, startedAt, deadlineAt, submittedAt, closedByTimeLimit, feedbackAvailable]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        attemptNumber:
          type: integer
        status:
          $ref: "#/components/schemas/QuizAttemptStatus"
        startedAt:
          type: string
          format: date-time
        deadlineAt:
          type: [string, "null"]
          format: date-time
        submittedAt:
          type: [string, "null"]
          format: date-time
        closedByTimeLimit:
          type: boolean
        feedbackAvailable:
          type: boolean
          description: True when the student may open this attempt's correctness review (see `getQuizAttemptFeedback`).
    StudentQuizAttemptSummary:
      type: object
      required: [attemptLimit, attemptsUsed, attemptsRemaining, timeLimitMinutes, questionsPerAttempt, passingScorePercent, releasedPassingScorePercent, activeAttemptId, gradeReleased, passed, items]
      additionalProperties: false
      properties:
        attemptLimit:
          type: integer
        attemptsUsed:
          type: integer
        attemptsRemaining:
          type: integer
          minimum: 0
        questionsPerAttempt:
          type: [integer, "null"]
        passingScorePercent:
          type: [integer, "null"]
          description: The current quiz setting, which applies to new attempts.
        releasedPassingScorePercent:
          type: [integer, "null"]
          description: The threshold saved with the released attempt, which decides `passed` (null until released or without a threshold).
        passed:
          type: [boolean, "null"]
          description: Whether the released grade meets the threshold saved with the released attempt; null until released or without a threshold.
        gradeReleased:
          type: boolean
          description: True once staff have released this student's grade for the quiz.
        timeLimitMinutes:
          type: [integer, "null"]
        activeAttemptId:
          type: [string, "null"]
          format: uuid
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuizAttemptStatusItem"
    QuizFeedback:
      type: object
      description: A student's correctness review of one released attempt. Never contains the answer key.
      required: [attemptId, attemptNumber, submittedAt, score, maxScore, passed, questions]
      additionalProperties: false
      properties:
        attemptId:
          type: string
          format: uuid
        attemptNumber:
          type: integer
        submittedAt:
          type: string
          format: date-time
        score:
          type: integer
        maxScore:
          type: integer
        passed:
          type: [boolean, "null"]
        questions:
          type: array
          items:
            type: object
            required: [questionId, position, type, prompt, points, options, selectedOptionIds, isCorrect, awardedPoints]
            additionalProperties: false
            properties:
              questionId:
                type: string
                format: uuid
              position:
                type: integer
              type:
                $ref: "#/components/schemas/QuizQuestionType"
              prompt:
                type: string
              points:
                type: integer
              options:
                type: array
                items:
                  type: object
                  required: [id, text]
                  additionalProperties: false
                  properties:
                    id:
                      type: string
                    text:
                      type: string
              selectedOptionIds:
                type: array
                items:
                  type: string
              isCorrect:
                type: boolean
              awardedPoints:
                type: integer
    QuestionImport:
      type: object
      required: [sourceActivityId]
      additionalProperties: false
      properties:
        sourceActivityId:
          type: string
          format: uuid
          description: An approved quiz of the same course whose approved questions are copied.
    QuizResultStudent:
      type: object
      required: [id, email, givenName, familyName]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        givenName:
          type: string
        familyName:
          type: string
    QuizResult:
      type: object
      required: [attemptId, attemptNumber, status, startedAt, deadlineAt, submittedAt, closedByTimeLimit, score, maxScore, passingScorePercent, passed, student]
      additionalProperties: false
      properties:
        attemptId:
          type: string
          format: uuid
        attemptNumber:
          type: integer
        status:
          $ref: "#/components/schemas/QuizAttemptStatus"
        startedAt:
          type: string
          format: date-time
        deadlineAt:
          type: [string, "null"]
          format: date-time
        submittedAt:
          type: [string, "null"]
          format: date-time
        closedByTimeLimit:
          type: boolean
        score:
          type: [integer, "null"]
          description: Server-computed; null while in progress.
        maxScore:
          type: integer
        passingScorePercent:
          type: [integer, "null"]
          description: The threshold of the quiz version this attempt was started from.
        passed:
          type: [boolean, "null"]
        student:
          $ref: "#/components/schemas/QuizResultStudent"
    QuizResultPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuizResult"
        nextCursor:
          type: [string, "null"]
    QuizAttemptResult:
      allOf:
        - $ref: "#/components/schemas/QuizResult"
        - type: object
          required: [questions]
          properties:
            questions:
              type: array
              items:
                type: object
                required: [questionId, position, type, prompt, points, options, selectedOptionIds, awardedPoints, isCorrect]
                additionalProperties: false
                properties:
                  questionId:
                    type: string
                    format: uuid
                  position:
                    type: integer
                  type:
                    $ref: "#/components/schemas/QuizQuestionType"
                  prompt:
                    type: string
                  points:
                    type: integer
                  options:
                    type: array
                    items:
                      $ref: "#/components/schemas/QuizOptionWithKey"
                  selectedOptionIds:
                    type: array
                    items:
                      type: string
                  awardedPoints:
                    type: [integer, "null"]
                  isCorrect:
                    type: [boolean, "null"]
    Grade20:
      type: number
      minimum: 0
      maximum: 20
      description: |
        Grade on the 0–20 scale: points × 20 / maxPoints, rounded half up to one decimal place
        (for example 15.55 → 15.6). Always calculated by the server.
    GradableType:
      type: string
      enum: [quiz, assignment]
    AssignmentSubmissionCreate:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 50000
          pattern: "\\S"
          description: Plain text; rendered as text, never as HTML.
    RubricScore:
      type: object
      required: [criterionId, title, points, maxPoints]
      additionalProperties: false
      properties:
        criterionId:
          type: string
          format: uuid
        title:
          type: string
        points:
          type: integer
        maxPoints:
          type: integer
    ReleasedGrade:
      type: object
      description: A grade exactly as released to the student. Never includes answer keys.
      required: [points, maxPoints, grade20, releasedAt, feedback, criteria]
      additionalProperties: false
      properties:
        points:
          type: integer
        maxPoints:
          type: integer
        grade20:
          $ref: "#/components/schemas/Grade20"
        releasedAt:
          type: string
          format: date-time
        feedback:
          type: [string, "null"]
        criteria:
          type: array
          description: Rubric scores (assignments); empty for quizzes.
          items:
            $ref: "#/components/schemas/RubricScore"
    StudentGradeStatus:
      type: string
      description: "`pending` covers every unreleased state; no numbers are returned for it."
      enum: [pending, released]
    StudentAssignmentSubmission:
      type: object
      required: [id, activityId, body, submittedAt, isLate, gradeStatus, grade]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        activityId:
          type: string
          format: uuid
        body:
          type: string
        submittedAt:
          type: string
          format: date-time
          description: Recorded by the server clock.
        isLate:
          type: boolean
        gradeStatus:
          $ref: "#/components/schemas/StudentGradeStatus"
        grade:
          oneOf:
            - $ref: "#/components/schemas/ReleasedGrade"
            - type: "null"
    StudentAssignmentStatus:
      type: object
      required: [dueAt, lateUntil, acceptingSubmissions, submission]
      additionalProperties: false
      properties:
        dueAt:
          type: string
          format: date-time
        lateUntil:
          type: [string, "null"]
          format: date-time
        acceptingSubmissions:
          type: boolean
          description: Whether the server would accept a submission from this student now.
        submission:
          oneOf:
            - $ref: "#/components/schemas/StudentAssignmentSubmission"
            - type: "null"
    GradeStatus:
      type: string
      description: |
        Staff view of one gradebook entry: `not_submitted`, `needs_grading` (submitted, not graded),
        `unreleased` (graded, never released), `released`, or `changed_since_release` (the student
        still sees the previously released grade).
      enum: [not_submitted, needs_grading, unreleased, released, changed_since_release]
    StaffGrade:
      type: object
      required: [points, maxPoints, grade20, gradedAt, releasedAt]
      additionalProperties: false
      properties:
        points:
          type: integer
        maxPoints:
          type: integer
        grade20:
          $ref: "#/components/schemas/Grade20"
        gradedAt:
          type: string
          format: date-time
        releasedAt:
          type: [string, "null"]
          format: date-time
          description: Time of the last release, if any.
    AssignmentSubmissionSummary:
      type: object
      required: [id, student, submittedAt, isLate, status, grade]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        student:
          $ref: "#/components/schemas/QuizResultStudent"
        submittedAt:
          type: string
          format: date-time
        isLate:
          type: boolean
        status:
          $ref: "#/components/schemas/GradeStatus"
        grade:
          oneOf:
            - $ref: "#/components/schemas/StaffGrade"
            - type: "null"
    AssignmentSubmissionPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AssignmentSubmissionSummary"
        nextCursor:
          type: [string, "null"]
    AssignmentSubmissionDetail:
      type: object
      required: [id, student, submittedAt, isLate, status, grade, body, rubric, scores, feedback]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        student:
          $ref: "#/components/schemas/QuizResultStudent"
        submittedAt:
          type: string
          format: date-time
        isLate:
          type: boolean
        status:
          $ref: "#/components/schemas/GradeStatus"
        grade:
          oneOf:
            - $ref: "#/components/schemas/StaffGrade"
            - type: "null"
        body:
          type: string
        rubric:
          type: array
          description: The rubric as approved when the student submitted.
          items:
            $ref: "#/components/schemas/RubricCriterion"
        scores:
          type: array
          items:
            $ref: "#/components/schemas/RubricScore"
        feedback:
          type: [string, "null"]
    RubricScoreInput:
      type: object
      required: [criterionId, points]
      additionalProperties: false
      properties:
        criterionId:
          type: string
          format: uuid
        points:
          type: integer
          minimum: 0
          maximum: 100
    AssignmentGradeInput:
      type: object
      required: [scores]
      additionalProperties: false
      properties:
        scores:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/RubricScoreInput"
        feedback:
          type: string
          maxLength: 5000
    GradeReleaseResult:
      type: object
      required: [activityId, releasedCount, releasedAt]
      additionalProperties: false
      properties:
        activityId:
          type: string
          format: uuid
        releasedCount:
          type: integer
          description: Grades released by this call (0 when nothing changed since the last release).
        releasedAt:
          type: [string, "null"]
          format: date-time
    GradebookColumn:
      type: object
      required: [activityId, title, type, maxPoints, visible, categoryId]
      additionalProperties: false
      properties:
        activityId:
          type: string
          format: uuid
        title:
          type: string
        type:
          $ref: "#/components/schemas/GradableType"
        maxPoints:
          type: integer
          description: Points of the approved version.
        visible:
          type: boolean
          description: Whether students can see the activity (it and its section are visible).
        categoryId:
          type: [string, "null"]
          format: uuid
          description: Category of the published grading policy; null without one or when not in a category.
    GradebookCell:
      type: object
      required: [activityId, status, points, maxPoints, grade20, releasedAt, revision]
      additionalProperties: false
      properties:
        activityId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/GradeStatus"
        points:
          type: [integer, "null"]
        maxPoints:
          type: [integer, "null"]
        grade20:
          oneOf:
            - $ref: "#/components/schemas/Grade20"
            - type: "null"
        releasedAt:
          type: [string, "null"]
          format: date-time
        revision:
          type: [integer, "null"]
          description: The grade's current revision (name it when releasing selected grades); null without a grade.
    CourseTotal:
      type: object
      description: Sum of points over the counted items, converted to the 0–20 scale (null when none).
      required: [points, maxPoints, grade20, gradedItems]
      additionalProperties: false
      properties:
        points:
          type: integer
        maxPoints:
          type: integer
        grade20:
          oneOf:
            - $ref: "#/components/schemas/Grade20"
            - type: "null"
        gradedItems:
          type: integer
    GradebookRow:
      type: object
      required: [student, cells, total, courseGrade, counts]
      additionalProperties: false
      properties:
        student:
          $ref: "#/components/schemas/QuizResultStudent"
        cells:
          type: array
          description: One cell per column, in column order.
          items:
            $ref: "#/components/schemas/GradebookCell"
        total:
          $ref: "#/components/schemas/CourseTotal"
        courseGrade:
          $ref: "#/components/schemas/CourseGrade"
        counts:
          $ref: "#/components/schemas/GradeCounts"
    GradeCounts:
      type: object
      description: Activities of one student by status (`unreleased` includes grades changed since their release).
      required: [notSubmitted, needsGrading, unreleased, released]
      additionalProperties: false
      properties:
        notSubmitted:
          type: integer
        needsGrading:
          type: integer
        unreleased:
          type: integer
        released:
          type: integer
    GradeCategoryRef:
      type: object
      required: [id, name, weightPercent]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        weightPercent:
          type: integer
    GradingPolicySummary:
      type: object
      description: The policy status and the categories that currently weight grades (published only).
      required: [status, version, method, categories]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [none, draft, published]
        version:
          type: integer
        method:
          type: string
          enum: [points, weighted]
        categories:
          type: array
          items:
            $ref: "#/components/schemas/GradeCategoryRef"
    GradeCategorySummary:
      type: object
      required: [categoryId, name, weightPercent, points, maxPoints, gradedItems, countedItems, percent, grade20]
      additionalProperties: false
      properties:
        categoryId:
          type: string
          format: uuid
        name:
          type: string
        weightPercent:
          type: integer
        points:
          type: integer
        maxPoints:
          type: integer
        gradedItems:
          type: integer
        countedItems:
          type: integer
        percent:
          type: [number, "null"]
          minimum: 0
          maximum: 100
          description: Graded points / graded maxima (one decimal); null while the category has no graded work.
        grade20:
          oneOf:
            - $ref: "#/components/schemas/Grade20"
            - type: "null"
    CertificatePolicyRules:
      type: object
      required: [enabled, requireCompletion, requireFinalGrade, minimumGradePercent, issuerName]
      properties:
        enabled:
          type: boolean
          description: Certificates can be issued only while the policy is enabled.
        requireCompletion:
          type: boolean
          description: Every progress-tracked activity must be complete (a course without such activities never qualifies).
        requireFinalGrade:
          type: boolean
          description: The course grade must be final (every counted activity graded, released and unchanged since release).
        minimumGradePercent:
          type: [integer, "null"]
          minimum: 1
          maximum: 100
          description: Optional minimum final course grade (percent), compared exactly before rounding. Needs requireFinalGrade.
        issuerName:
          type: string
          minLength: 1
          maxLength: 120
          pattern: "\\S"
          description: The issuing institution printed on certificates (for example "AcademiaPath").
    CertificateSignatory:
      type: object
      description: |
        AP-043. A person whose printed name and official title appear on certificates, under a signature line.
        Text only: not linked to a user account, and no electronic or cryptographic signature is produced.
      required: [name, title]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          pattern: "\\S"
          description: Full printed name (for example "María Fernanda Quispe Huamán").
        title:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "\\S"
          description: Official title (for example "Decana de la Facultad de Ingeniería").
    CertificateSignatories:
      type: array
      description: AP-043. Up to three signatories, in print order (left to right). Empty when there are none.
      maxItems: 3
      items:
        $ref: "#/components/schemas/CertificateSignatory"
    CertificatePolicy:
      allOf:
        - $ref: "#/components/schemas/CertificatePolicyRules"
        - type: object
          required: [configured, version, updatedAt, signatories]
          properties:
            signatories:
              $ref: "#/components/schemas/CertificateSignatories"
            configured:
              type: boolean
            version:
              type: integer
              minimum: 0
            updatedAt:
              type: [string, "null"]
              format: date-time
    CertificatePolicyInput:
      allOf:
        - $ref: "#/components/schemas/CertificatePolicyRules"
        - type: object
          required: [expectedVersion]
          properties:
            expectedVersion:
              type: integer
              minimum: 0
            signatories:
              description: Optional; when left out, the saved signatories are kept.
              $ref: "#/components/schemas/CertificateSignatories"
    CertificateRequirement:
      type: object
      required: [key, met, reason]
      additionalProperties: false
      properties:
        key:
          type: string
          enum: [policy_enabled, course_published, active_enrollment, activities_completed, final_grade_released, minimum_grade]
        met:
          type: boolean
        reason:
          type: [string, "null"]
          enum: [not_configured, disabled, not_published, not_enrolled, inactive, no_activities, incomplete, no_graded_work, grades_pending, awaiting_final_grade, below_minimum, null]
    CertificateEligibility:
      type: object
      description: Evaluated on the server from stored records; grades are released grades only.
      required: [eligible, requirements, progress, releasedGrade]
      additionalProperties: false
      properties:
        eligible:
          type: boolean
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/CertificateRequirement"
        progress:
          type: object
          required: [completedCount, totalCount, percent]
          additionalProperties: false
          properties:
            completedCount:
              type: integer
            totalCount:
              type: integer
            percent:
              type: [integer, "null"]
        releasedGrade:
          type: object
          required: [status, percent, grade20, pendingItems]
          additionalProperties: false
          properties:
            status:
              type: string
              enum: [final, provisional]
            percent:
              type: [number, "null"]
            grade20:
              type: [number, "null"]
            pendingItems:
              type: integer
    CertificateHistoryEvent:
      type: object
      required: [action, at, actor, reason]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [certificate.issued, certificate.revoked]
        at:
          type: string
          format: date-time
        actor:
          type: [object, "null"]
          required: [id, name]
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        reason:
          type: [string, "null"]
    Certificate:
      type: object
      description: A certificate exactly as issued (snapshot). `history` is included for staff and administrators only.
      required: [id, certificateNumber, status, courseId, userId, recipientName, courseTitle, courseCode, programName, termName, academicYear, issuerName, signatories, issuedAt, policyVersion, policy, verificationPath, revokedAt, revocationReason]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        certificateNumber:
          type: string
          description: Random, non-sequential number printed on the certificate (for example AP-7K3M-Q9TX-2HDP).
        status:
          type: string
          enum: [issued, revoked]
        courseId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        recipientName:
          type: string
        courseTitle:
          type: string
        courseCode:
          type: string
        programName:
          type: [string, "null"]
        termName:
          type: string
        academicYear:
          type: integer
        issuerName:
          type: string
        signatories:
          description: The signatories saved when the certificate was issued (empty for certificates issued before AP-043), never the current policy's.
          $ref: "#/components/schemas/CertificateSignatories"
        issuedAt:
          type: string
          format: date-time
        policyVersion:
          type: integer
        policy:
          type: object
          required: [requireCompletion, requireFinalGrade, minimumGradePercent]
          additionalProperties: false
          properties:
            requireCompletion:
              type: boolean
            requireFinalGrade:
              type: boolean
            minimumGradePercent:
              type: [integer, "null"]
        verificationPath:
          type: string
          description: Application-relative verification page, `/verify/{token}`.
        revokedAt:
          type: [string, "null"]
          format: date-time
        revocationReason:
          type: [string, "null"]
        history:
          type: array
          items:
            $ref: "#/components/schemas/CertificateHistoryEvent"
    CertificateList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Certificate"
    CertificatePage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Certificate"
        nextCursor:
          type: [string, "null"]
    CertificateRef:
      type: [object, "null"]
      required: [id, certificateNumber, status, issuedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        certificateNumber:
          type: string
        status:
          type: string
          enum: [issued, revoked]
        issuedAt:
          type: string
          format: date-time
    CourseCertificateEligibility:
      type: object
      required: [policy, items]
      additionalProperties: false
      properties:
        policy:
          $ref: "#/components/schemas/CertificatePolicy"
        items:
          type: array
          items:
            type: object
            required: [student, eligibility, certificate]
            additionalProperties: false
            properties:
              student:
                $ref: "#/components/schemas/QuizResultStudent"
              eligibility:
                $ref: "#/components/schemas/CertificateEligibility"
              certificate:
                $ref: "#/components/schemas/CertificateRef"
    MyCourseCertificates:
      type: object
      required: [policy, eligibility, certificates]
      additionalProperties: false
      properties:
        policy:
          $ref: "#/components/schemas/CertificatePolicy"
        eligibility:
          oneOf:
            - $ref: "#/components/schemas/CertificateEligibility"
            - type: "null"
        certificates:
          type: array
          items:
            $ref: "#/components/schemas/Certificate"
    MyCertificates:
      type: object
      required: [certificates, courses]
      additionalProperties: false
      properties:
        certificates:
          type: array
          items:
            $ref: "#/components/schemas/Certificate"
        courses:
          type: array
          items:
            type: object
            required: [courseId, title, code, certificatesEnabled, eligible, certificate]
            additionalProperties: false
            properties:
              courseId:
                type: string
                format: uuid
              title:
                type: string
              code:
                type: string
              certificatesEnabled:
                type: boolean
              eligible:
                type: [boolean, "null"]
              certificate:
                $ref: "#/components/schemas/CertificateRef"
    CertificateIssue:
      type: object
      required: [userId]
      additionalProperties: false
      properties:
        userId:
          type: string
          format: uuid
    CertificateRevoke:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: "\\S"
    CertificateVerification:
      type: object
      description: The public verification record. Nothing else about the student or the course is revealed.
      required: [status, certificateNumber, recipientName, courseTitle, academicPeriod, issuerName, signatories, issuedAt, revokedAt]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [valid, revoked]
        certificateNumber:
          type: string
        recipientName:
          type: string
        courseTitle:
          type: string
        academicPeriod:
          type: string
        issuerName:
          type: string
        signatories:
          description: AP-043. The printed names and titles saved at issue time (empty before AP-043); nothing else about them.
          $ref: "#/components/schemas/CertificateSignatories"
        issuedAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time
    CourseRefOrNull:
      type: [object, "null"]
      required: [id, title, code]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        code:
          type: string
    AnnouncementInput:
      type: object
      required: [title, body]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        body:
          type: string
          minLength: 1
          maxLength: 10000
          pattern: "\\S"
          description: Plain text; never interpreted as HTML.
        pinned:
          type: boolean
    AnnouncementUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        body:
          type: string
          minLength: 1
          maxLength: 10000
          pattern: "\\S"
        pinned:
          type: boolean
    AnnouncementPublish:
      type: object
      additionalProperties: false
      properties:
        publishAt:
          type: [string, "null"]
          format: date-time
          description: A future instant with an explicit offset to schedule; omit or null to publish now.
    Announcement:
      type: object
      required: [id, scope, course, title, body, status, pinned, publishAt, archivedAt, read, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        scope:
          type: string
          enum: [course, institution]
        course:
          $ref: "#/components/schemas/CourseRefOrNull"
        title:
          type: string
        body:
          type: string
        status:
          type: string
          enum: [draft, scheduled, published, archived]
        pinned:
          type: boolean
        publishAt:
          type: [string, "null"]
          format: date-time
        archivedAt:
          type: [string, "null"]
          format: date-time
        read:
          type: boolean
          description: Whether the caller has marked it read.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AnnouncementPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Announcement"
        nextCursor:
          type: [string, "null"]
    UnreadCount:
      type: object
      required: [unreadCount]
      additionalProperties: false
      properties:
        unreadCount:
          type: integer
          minimum: 0
    CalendarEventInput:
      type: object
      description: Timed events send startsAt/endsAt (instants with explicit offsets); all-day events send startDate/endDate (inclusive dates).
      required: [title, allDay, status]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        description:
          type: [string, "null"]
          maxLength: 5000
        allDay:
          type: boolean
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        timeZone:
          type: string
          minLength: 1
          maxLength: 64
          description: IANA time zone (default the institution's, America/Lima).
        status:
          type: string
          enum: [hidden, published]
    CalendarEvent:
      type: object
      required: [id, scope, course, title, description, allDay, startsAt, endsAt, startDate, endDate, timeZone, status, publishedAt, cancelledAt, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        scope:
          type: string
          enum: [course, institution]
        course:
          $ref: "#/components/schemas/CourseRefOrNull"
        title:
          type: string
        description:
          type: [string, "null"]
        allDay:
          type: boolean
        startsAt:
          type: string
          format: date-time
          description: UTC instant (all-day events, midnight of startDate in timeZone).
        endsAt:
          type: string
          format: date-time
          description: UTC instant, exclusive (all-day events, midnight after endDate in timeZone).
        startDate:
          type: [string, "null"]
        endDate:
          type: [string, "null"]
        timeZone:
          type: string
        status:
          type: string
          enum: [hidden, published, cancelled]
        publishedAt:
          type: [string, "null"]
          format: date-time
        cancelledAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CalendarEventList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CalendarEvent"
    CalendarDueDate:
      type: object
      required: [activityId, course, title, dueAt, lateUntil]
      additionalProperties: false
      properties:
        activityId:
          type: string
          format: uuid
        course:
          $ref: "#/components/schemas/CourseRefOrNull"
        title:
          type: string
        dueAt:
          type: string
          format: date-time
        lateUntil:
          type: [string, "null"]
          format: date-time
    Calendar:
      type: object
      required: [timeZone, from, to, events, dueDates]
      additionalProperties: false
      properties:
        timeZone:
          type: string
          description: The institution's time zone (used for due dates).
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        events:
          type: array
          items:
            $ref: "#/components/schemas/CalendarEvent"
        dueDates:
          type: array
          items:
            $ref: "#/components/schemas/CalendarDueDate"
    CourseGrade:
      type: object
      description: |
        The course grade under the course's grading policy (see "Advanced gradebook" above). `points`: the
        unweighted sum; `weighted`: the published categories. Pending work is never counted as zero.
      required: [method, status, grade20, percent, countedItems, gradedItems, pendingItems, categories]
      additionalProperties: false
      properties:
        method:
          type: string
          enum: [points, weighted]
        status:
          type: string
          enum: [final, provisional]
        grade20:
          oneOf:
            - $ref: "#/components/schemas/Grade20"
            - type: "null"
        percent:
          type: [number, "null"]
          minimum: 0
          maximum: 100
        countedItems:
          type: integer
        gradedItems:
          type: integer
        pendingItems:
          type: integer
          description: Counted activities that students can see (or that have a grade) without a released, current grade.
        categories:
          type: array
          items:
            $ref: "#/components/schemas/GradeCategorySummary"
    GradingPolicy:
      type: object
      required: [status, version, publishedAt, updatedAt, totalWeightPercent, categories]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [none, draft, published]
        version:
          type: integer
          minimum: 0
        publishedAt:
          type: [string, "null"]
          format: date-time
        updatedAt:
          type: [string, "null"]
          format: date-time
        totalWeightPercent:
          type: integer
        categories:
          type: array
          items:
            type: object
            required: [id, name, weightPercent, activityIds]
            additionalProperties: false
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              weightPercent:
                type: integer
              activityIds:
                type: array
                items:
                  type: string
                  format: uuid
    GradingPolicyInput:
      type: object
      required: [expectedVersion, status, categories]
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [draft, published]
        categories:
          type: array
          maxItems: 20
          items:
            type: object
            required: [name, weightPercent, activityIds]
            additionalProperties: false
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 80
                pattern: "\\S"
              weightPercent:
                type: integer
                minimum: 1
                maximum: 100
              activityIds:
                type: array
                maxItems: 200
                uniqueItems: true
                items:
                  type: string
                  format: uuid
    StudentGradebookActivity:
      type: object
      required: [activity, status, grade, released, submittedAt, isLate, inProgress, attemptsUsed, passingScorePercent, passed]
      additionalProperties: false
      properties:
        activity:
          $ref: "#/components/schemas/GradebookColumn"
        status:
          $ref: "#/components/schemas/GradeStatus"
        grade:
          type: [object, "null"]
          required: [points, maxPoints, grade20, revision, gradedAt]
          additionalProperties: false
          properties:
            points:
              type: integer
            maxPoints:
              type: integer
            grade20:
              $ref: "#/components/schemas/Grade20"
            revision:
              type: integer
            gradedAt:
              type: string
              format: date-time
        released:
          type: [object, "null"]
          required: [points, maxPoints, grade20, revision, releasedAt]
          additionalProperties: false
          properties:
            points:
              type: integer
            maxPoints:
              type: integer
            grade20:
              $ref: "#/components/schemas/Grade20"
            revision:
              type: integer
            releasedAt:
              type: string
              format: date-time
        submittedAt:
          type: [string, "null"]
          format: date-time
        isLate:
          type: boolean
        inProgress:
          type: boolean
        attemptsUsed:
          type: [integer, "null"]
        passingScorePercent:
          type: [integer, "null"]
          description: Quizzes only; the threshold saved with the counted attempt.
        passed:
          type: [boolean, "null"]
    StudentGradebook:
      type: object
      required: [scaleMax, student, policy, courseGrade, releasedCourseGrade, counts, activities]
      additionalProperties: false
      properties:
        scaleMax:
          type: integer
          const: 20
        student:
          $ref: "#/components/schemas/QuizResultStudent"
        policy:
          $ref: "#/components/schemas/GradingPolicySummary"
        courseGrade:
          $ref: "#/components/schemas/CourseGrade"
        releasedCourseGrade:
          $ref: "#/components/schemas/CourseGrade"
        counts:
          $ref: "#/components/schemas/GradeCounts"
        activities:
          type: array
          items:
            $ref: "#/components/schemas/StudentGradebookActivity"
    GradeSelectionRelease:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items:
            type: object
            required: [activityId, userId, revision]
            additionalProperties: false
            properties:
              activityId:
                type: string
                format: uuid
              userId:
                type: string
                format: uuid
              revision:
                type: integer
                minimum: 1
    GradeSelectionReleaseResult:
      type: object
      required: [releasedCount, releasedAt, results]
      additionalProperties: false
      properties:
        releasedCount:
          type: integer
        releasedAt:
          type: [string, "null"]
          format: date-time
        results:
          type: array
          items:
            type: object
            required: [activityId, userId, revision, outcome]
            additionalProperties: false
            properties:
              activityId:
                type: string
                format: uuid
              userId:
                type: string
                format: uuid
              revision:
                type: integer
              outcome:
                type: string
                enum: [released, already_released, stale, not_graded, not_found]
    Gradebook:
      type: object
      required: [scaleMax, policy, columns, items, nextCursor]
      additionalProperties: false
      properties:
        scaleMax:
          type: integer
          const: 20
        policy:
          $ref: "#/components/schemas/GradingPolicySummary"
        columns:
          type: array
          items:
            $ref: "#/components/schemas/GradebookColumn"
        items:
          type: array
          items:
            $ref: "#/components/schemas/GradebookRow"
        nextCursor:
          type: [string, "null"]
    StudentGradeItem:
      type: object
      required: [activityId, title, type, categoryId, status, workStatus, grade, passed]
      additionalProperties: false
      properties:
        activityId:
          type: string
          format: uuid
        title:
          type: string
        type:
          $ref: "#/components/schemas/GradableType"
        categoryId:
          type: [string, "null"]
          format: uuid
        status:
          $ref: "#/components/schemas/StudentGradeStatus"
        workStatus:
          type: string
          description: "`submitted` means submitted and awaiting a released result (whether it is graded yet is not shown)."
          enum: [not_submitted, in_progress, submitted, released]
        grade:
          oneOf:
            - $ref: "#/components/schemas/ReleasedGrade"
            - type: "null"
        passed:
          type: [boolean, "null"]
          description: Released quizzes only; by the threshold saved with the released attempt.
    StudentGrades:
      type: object
      required: [scaleMax, policy, items, total, courseGrade]
      additionalProperties: false
      properties:
        scaleMax:
          type: integer
          const: 20
        policy:
          type: object
          required: [method, categories]
          additionalProperties: false
          properties:
            method:
              type: string
              enum: [points, weighted]
            categories:
              type: array
              items:
                $ref: "#/components/schemas/GradeCategoryRef"
        items:
          type: array
          items:
            $ref: "#/components/schemas/StudentGradeItem"
        total:
          $ref: "#/components/schemas/CourseTotal"
        courseGrade:
          $ref: "#/components/schemas/CourseGrade"
    TutorLanguage:
      type: string
      description: Response language. Sources are never translated.
      enum: [en, es]
    TutorProvider:
      type: object
      required: [mode, label]
      additionalProperties: false
      properties:
        mode:
          type: string
          description: "`mock`: a local, deterministic provider that quotes approved lesson passages. No language model is used."
          enum: [mock]
        label:
          type: string
          description: Notice to display with every response (for example "Mock AI — local demonstration").
    TutorGrounding:
      type: string
      description: "`grounded` when approved lesson passages support the response; otherwise `insufficient_material`."
      enum: [grounded, insufficient_material]
    TutorMessageRequest:
      type: object
      required: [question, language]
      additionalProperties: false
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 500
          pattern: "\\S"
        language:
          $ref: "#/components/schemas/TutorLanguage"
    TutorPracticeRequest:
      type: object
      required: [language]
      additionalProperties: false
      properties:
        language:
          $ref: "#/components/schemas/TutorLanguage"
        topic:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
    TutorCitation:
      type: object
      required: [ref, activityId, sectionId, title, excerpt, sourceLanguage, matchesRequestedLanguage]
      additionalProperties: false
      properties:
        ref:
          type: integer
          minimum: 1
          description: Number used in the response text, e.g. [1].
        activityId:
          type: string
          format: uuid
          description: The approved lesson the excerpt comes from.
        sectionId:
          type: string
          format: uuid
        title:
          type: string
          description: Title of the approved lesson version.
        excerpt:
          type: string
          maxLength: 402
          description: Verbatim text from the approved lesson, possibly shortened with "…"; never translated.
        sourceLanguage:
          type: string
          description: Detected language of the source passage (simple word-list heuristic).
          enum: [en, es, unknown]
        matchesRequestedLanguage:
          type: boolean
    TutorUsageSummary:
      type: object
      required: [limit, windowMinutes, usedInWindow]
      additionalProperties: false
      properties:
        limit:
          type: integer
        windowMinutes:
          type: integer
        usedInWindow:
          type: integer
    TutorMessageResponse:
      type: object
      required: [provider, language, grounding, text, citations, usage]
      additionalProperties: false
      properties:
        provider:
          $ref: "#/components/schemas/TutorProvider"
        language:
          $ref: "#/components/schemas/TutorLanguage"
        grounding:
          $ref: "#/components/schemas/TutorGrounding"
        text:
          type: string
          maxLength: 4000
          description: Plain text to render as text, never as HTML.
        citations:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/TutorCitation"
        usage:
          $ref: "#/components/schemas/TutorUsageSummary"
    TutorPracticePrompt:
      type: object
      required: [ref, kind, text, citation]
      additionalProperties: false
      properties:
        ref:
          type: integer
          minimum: 1
        kind:
          type: string
          enum: [explain, key_terms]
        text:
          type: string
          maxLength: 800
        citation:
          $ref: "#/components/schemas/TutorCitation"
    TutorPracticeResponse:
      type: object
      required: [provider, language, grounding, prompts, usage]
      additionalProperties: false
      properties:
        provider:
          $ref: "#/components/schemas/TutorProvider"
        language:
          $ref: "#/components/schemas/TutorLanguage"
        grounding:
          $ref: "#/components/schemas/TutorGrounding"
        prompts:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/TutorPracticePrompt"
        usage:
          $ref: "#/components/schemas/TutorUsageSummary"
    TutorUsageRecord:
      type: object
      required: [id, kind, language, outcome, providerMode, sourceActivityIds, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [message, practice]
        language:
          $ref: "#/components/schemas/TutorLanguage"
        outcome:
          $ref: "#/components/schemas/TutorGrounding"
        providerMode:
          type: string
          enum: [mock]
        sourceActivityIds:
          type: array
          items:
            type: string
            format: uuid
        createdAt:
          type: string
          format: date-time
    TutorGuideAction:
      type: string
      enum:
        - start
        - explain
        - again
        - summarize
        - simpler
        - example
        - detail
        - review
        - next
        - practice
        - material
        - quiz_prep
        - ask
    TutorSuggestedAction:
      type: string
      description: An action offered as a suggestion or follow-up button.
      enum:
        - explain
        - again
        - summarize
        - simpler
        - example
        - detail
        - review
        - next
        - practice
        - material
        - quiz_prep
    TutorGuideRequest:
      type: object
      additionalProperties: false
      required: [action, language]
      properties:
        action:
          $ref: "#/components/schemas/TutorGuideAction"
        language:
          $ref: "#/components/schemas/Locale"
        activityId:
          type: string
          format: uuid
          description: The approved lesson or document being studied.
        question:
          type: string
          minLength: 1
          maxLength: 500
          description: Free text, for `ask` only. Never stored.
        variant:
          type: integer
          minimum: 0
          maximum: 1000
          description: Which passage or practice question to use; follow-ups send the next one. For `start`, a non-zero value continues a conversation (a different lesson was chosen), so the greeting is left out.
    TutorGuideBlock:
      type: object
      additionalProperties: false
      required: [kind, text, items, ref, sourceLanguage]
      description: |
        `quote` and `list` items are verbatim course material (with `ref` when from one material); `text` is the
        tutor's own framing in the requested language; `tip` is general study advice, not from the course.
      properties:
        kind:
          type: string
          enum: [text, quote, list, tip]
        text:
          type: ["string", "null"]
        items:
          type: array
          items:
            type: string
        ref:
          type: ["integer", "null"]
        sourceLanguage:
          type: ["string", "null"]
          enum: [en, es, unknown, null]
    TutorGuideReference:
      type: object
      additionalProperties: false
      required: [ref, activityId, sectionId, sectionTitle, title, type, sourceLanguage, matchesRequestedLanguage]
      properties:
        ref:
          type: integer
        activityId:
          type: string
          format: uuid
        sectionId:
          type: string
          format: uuid
        sectionTitle:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [page, file, link, quiz, assignment]
        sourceLanguage:
          type: ["string", "null"]
          enum: [en, es, unknown, null]
        matchesRequestedLanguage:
          type: boolean
    TutorFocus:
      type: ["object", "null"]
      additionalProperties: false
      required: [activityId, title]
      properties:
        activityId:
          type: string
          format: uuid
        title:
          type: string
    TutorGuidedProvider:
      type: object
      additionalProperties: false
      required: [mode, label]
      properties:
        mode:
          type: string
          enum: [guided_demo]
        label:
          type: string
    TutorGuideResponse:
      type: object
      additionalProperties: false
      required: [provider, language, action, intent, grounding, variant, context, focus, blocks, references, practice, followUps, materials]
      properties:
        provider:
          $ref: "#/components/schemas/TutorGuidedProvider"
        language:
          $ref: "#/components/schemas/Locale"
        action:
          $ref: "#/components/schemas/TutorGuideAction"
        intent:
          description: For `ask`, the recognised request (or null).
          oneOf:
            - $ref: "#/components/schemas/TutorSuggestedAction"
            - type: "null"
        grounding:
          type: string
          enum: [grounded, guidance, insufficient_material]
        variant:
          type: integer
        context:
          type: object
          additionalProperties: false
          required: [courseId, courseTitle, lesson]
          properties:
            courseId:
              type: string
              format: uuid
            courseTitle:
              type: string
            lesson:
              type: ["object", "null"]
              additionalProperties: false
              required: [activityId, sectionId, sectionTitle, title, type, sourceLanguage]
              properties:
                activityId:
                  type: string
                  format: uuid
                sectionId:
                  type: string
                  format: uuid
                sectionTitle:
                  type: string
                title:
                  type: string
                type:
                  type: string
                  enum: [page, file]
                sourceLanguage:
                  type: ["string", "null"]
                  enum: [en, es, unknown, null]
        focus:
          $ref: "#/components/schemas/TutorFocus"
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/TutorGuideBlock"
        references:
          type: array
          items:
            $ref: "#/components/schemas/TutorGuideReference"
        practice:
          type: ["object", "null"]
          additionalProperties: false
          required: [questionId, kind, prompt, statement, options, ref]
          properties:
            questionId:
              type: string
            kind:
              type: string
              enum: [term, source]
            prompt:
              type: string
            statement:
              type: string
              description: The lesson sentence, verbatim (a defined term replaced by "_____" for `term`).
            options:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, text]
                properties:
                  id:
                    type: string
                  text:
                    type: string
            ref:
              type: integer
        followUps:
          type: array
          items:
            $ref: "#/components/schemas/TutorSuggestedAction"
        materials:
          type: array
          description: Only for `start`; the approved materials the caller may study.
          items:
            type: object
            additionalProperties: false
            required: [activityId, sectionId, sectionTitle, title, type]
            properties:
              activityId:
                type: string
                format: uuid
              sectionId:
                type: string
                format: uuid
              sectionTitle:
                type: string
              title:
                type: string
              type:
                type: string
                enum: [page, file]
    TutorPracticeCheckRequest:
      type: object
      additionalProperties: false
      required: [questionId, optionId, language]
      properties:
        questionId:
          type: string
          description: As returned with the practice question. It identifies the lesson sentence and a fingerprint of what was shown; a question whose material changed since is reported as `unavailable`.
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}~[0-9]{1,3}~[0-9a-f]{8}$"
        optionId:
          type: string
          enum: [a, b, c, d]
        language:
          $ref: "#/components/schemas/Locale"
    TutorPracticeCheckResponse:
      type: object
      additionalProperties: false
      required: [provider, language, status, correctOptionId, focus, blocks, references, followUps]
      properties:
        provider:
          $ref: "#/components/schemas/TutorGuidedProvider"
        language:
          $ref: "#/components/schemas/Locale"
        status:
          type: string
          enum: [correct, incorrect, unavailable]
        correctOptionId:
          type: ["string", "null"]
        focus:
          $ref: "#/components/schemas/TutorFocus"
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/TutorGuideBlock"
        references:
          type: array
          items:
            $ref: "#/components/schemas/TutorGuideReference"
        followUps:
          type: array
          items:
            $ref: "#/components/schemas/TutorSuggestedAction"
    TutorUsage:
      type: object
      required: [limit, windowMinutes, usedInWindow, totalRequests, items]
      additionalProperties: false
      properties:
        limit:
          type: integer
        windowMinutes:
          type: integer
        usedInWindow:
          type: integer
        totalRequests:
          type: integer
        items:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/TutorUsageRecord"
    ProgramUpdate:
      type: object
      required: [name, isActive]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        description:
          type: [string, "null"]
          maxLength: 2000
          description: Omit, null or blank to clear.
        isActive:
          type: boolean
          description: Inactive programs keep their subjects and courses but cannot receive new courses.
    TermUpdate:
      type: object
      required: [name, startsOn, endsOn]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
    CourseTemplateDetail:
      type: object
      description: A reusable subject (course template) with its latest version, including sections.
      required: [id, programId, code, title, description, versionCount, latestVersion, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        programId:
          type: [string, "null"]
          format: uuid
        code:
          $ref: "#/components/schemas/Code"
        title:
          type: string
        description:
          type: [string, "null"]
        versionCount:
          type: integer
        latestVersion:
          oneOf:
            - $ref: "#/components/schemas/CourseTemplateVersion"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SystemRole:
      type: string
      description: Platform-wide role. Only `administrator` grants system-level permissions.
      enum: [administrator, user]
    Locale:
      type: string
      enum: [es, en]
    UserActivationState:
      type: string
      description: "`activated`: the user has set a password. `pending`: not yet (no password exists)."
      enum: [activated, pending]
    PersonName:
      type: string
      minLength: 1
      maxLength: 100
      pattern: "\\S"
    UserSummary:
      type: object
      required: [id, email, givenName, familyName, systemRole, isActive, activationState, activeEnrollmentCount, courseRoles, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        systemRole:
          $ref: "#/components/schemas/SystemRole"
        isActive:
          type: boolean
          description: Deactivated accounts cannot sign in and have no valid sessions.
        activationState:
          $ref: "#/components/schemas/UserActivationState"
        activeEnrollmentCount:
          type: integer
          minimum: 0
        courseRoles:
          type: array
          description: Distinct course roles held in active enrollments.
          items:
            $ref: "#/components/schemas/CourseRole"
        createdAt:
          type: string
          format: date-time
    UserPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserSummary"
        nextCursor:
          type: [string, "null"]
    UserEnrollment:
      type: object
      description: One of the user's course enrollments (one course role per course).
      required: [id, courseId, courseCode, courseTitle, courseStatus, termCode, role, status, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        courseCode:
          type: string
        courseTitle:
          type: string
        courseStatus:
          $ref: "#/components/schemas/CourseStatus"
        termCode:
          type: string
        role:
          $ref: "#/components/schemas/CourseRole"
        status:
          type: string
          enum: [active, inactive]
        createdAt:
          type: string
          format: date-time
    UserActivation:
      type: object
      required: [state, activatedAt, pendingInvitation]
      additionalProperties: false
      properties:
        state:
          $ref: "#/components/schemas/UserActivationState"
        activatedAt:
          type: [string, "null"]
          format: date-time
        pendingInvitation:
          description: The open activation link, if any (its token is never returned again).
          oneOf:
            - type: object
              required: [id, createdAt, expiresAt, expired]
              additionalProperties: false
              properties:
                id:
                  type: string
                  format: uuid
                createdAt:
                  type: string
                  format: date-time
                expiresAt:
                  type: string
                  format: date-time
                expired:
                  type: boolean
            - type: "null"
    UserDetail:
      type: object
      required: [id, email, givenName, familyName, systemRole, isActive, activationState, activeEnrollmentCount, courseRoles, createdAt, institutionalId, preferredLocale, updatedAt, activation, enrollments]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        systemRole:
          $ref: "#/components/schemas/SystemRole"
        isActive:
          type: boolean
        activationState:
          $ref: "#/components/schemas/UserActivationState"
        activeEnrollmentCount:
          type: integer
          minimum: 0
        courseRoles:
          type: array
          items:
            $ref: "#/components/schemas/CourseRole"
        createdAt:
          type: string
          format: date-time
        institutionalId:
          type: [string, "null"]
        preferredLocale:
          $ref: "#/components/schemas/Locale"
        updatedAt:
          type: string
          format: date-time
        activation:
          $ref: "#/components/schemas/UserActivation"
        enrollments:
          type: array
          items:
            $ref: "#/components/schemas/UserEnrollment"
    UserEnrollmentInput:
      type: object
      required: [courseId, role]
      additionalProperties: false
      properties:
        courseId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/CourseRole"
    UserCreate:
      type: object
      required: [email, givenName, familyName]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        givenName:
          $ref: "#/components/schemas/PersonName"
        familyName:
          $ref: "#/components/schemas/PersonName"
        systemRole:
          allOf:
            - $ref: "#/components/schemas/SystemRole"
          default: user
        preferredLocale:
          allOf:
            - $ref: "#/components/schemas/Locale"
          default: es
        enrollments:
          type: array
          description: Initial course roles, one per course (`DUPLICATE_COURSE` otherwise).
          maxItems: 20
          items:
            $ref: "#/components/schemas/UserEnrollmentInput"
    UserUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        givenName:
          $ref: "#/components/schemas/PersonName"
        familyName:
          $ref: "#/components/schemas/PersonName"
        systemRole:
          $ref: "#/components/schemas/SystemRole"
        preferredLocale:
          $ref: "#/components/schemas/Locale"
    AccountInvitation:
      type: object
      description: |
        A single-use activation link, returned only once when issued. `activationPath` is relative to
        the web app origin; the token is in the URL fragment so browsers never send it to a server.
        Synthetic local demonstration only (local link delivery).
      required: [id, expiresAt, delivery, activationPath]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        delivery:
          type: string
          enum: [local_link]
        activationPath:
          type: string
          description: "`/activate#token=…`"
    UserCreateResult:
      type: object
      required: [user, invitation, invitationStatus]
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/UserDetail"
        invitation:
          oneOf:
            - $ref: "#/components/schemas/AccountInvitation"
            - type: "null"
        invitationStatus:
          type: string
          description: |
            `issued`: a local activation link is included. `disabled`: activation links are turned off
            in this environment. `synthetic_only`: local links are only issued for synthetic addresses.
          enum: [issued, disabled, synthetic_only]
    ActivationPreviewRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    ActivationPreview:
      type: object
      required: [email, givenName, familyName, expiresAt]
      additionalProperties: false
      properties:
        email:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        expiresAt:
          type: string
          format: date-time
    ActivationRequest:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        password:
          type: string
          format: password
          writeOnly: true
          description: 12 to 256 characters; must not contain the account's email name (`PASSWORD_TOO_WEAK`).
          minLength: 12
          maxLength: 256
    EnrollmentUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/CourseRole"
        status:
          type: string
          enum: [active, inactive]
    EnrollmentImportRequest:
      type: object
      required: [csv]
      additionalProperties: false
      properties:
        csv:
          type: string
          minLength: 1
          maxLength: 100000
        apply:
          type: boolean
          default: false
    EnrollmentImportRow:
      type: object
      required: [line, email, role, outcome, errorCode]
      additionalProperties: false
      properties:
        line:
          type: integer
          description: Line number in the CSV text (1-based).
        email:
          type: string
        role:
          type: [string, "null"]
        outcome:
          type: string
          description: "`create`: will be (or was) enrolled. `unchanged`: already an active student. `error`: see `errorCode`."
          enum: [create, unchanged, error]
        errorCode:
          type: [string, "null"]
          enum:
            - INVALID_ROW
            - INVALID_EMAIL
            - INVALID_ROLE
            - ROLE_NOT_ALLOWED
            - DUPLICATE_ROW
            - USER_NOT_FOUND
            - USER_INACTIVE
            - ROLE_CONFLICT
            - ENROLLMENT_INACTIVE
            - null
    EnrollmentImportResult:
      type: object
      required: [applied, rows, summary]
      additionalProperties: false
      properties:
        applied:
          type: boolean
        rows:
          type: array
          items:
            $ref: "#/components/schemas/EnrollmentImportRow"
        summary:
          type: object
          required: [total, create, unchanged, errors]
          additionalProperties: false
          properties:
            total:
              type: integer
            create:
              type: integer
            unchanged:
              type: integer
            errors:
              type: integer
    CourseUpdate:
      type: object
      required: [version]
      minProperties: 2
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1
          description: The course `version` the change is based on.
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        code:
          $ref: "#/components/schemas/Code"
        description:
          type: [string, "null"]
          maxLength: 2000
    CourseTransition:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1
    SectionCreate:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        summary:
          type: [string, "null"]
          maxLength: 2000
        isVisible:
          type: boolean
          default: true
    SectionUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        summary:
          type: [string, "null"]
          maxLength: 2000
        isVisible:
          type: boolean
    SectionOrder:
      type: object
      required: [sectionIds]
      additionalProperties: false
      properties:
        sectionIds:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            format: uuid
    SectionList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Section"
    CourseLifecycle:
      type: object
      required: [course, term, template, sections, enrollmentCounts, studentVisibleActivityCount, unapprovedActivityCount, awaitingReviewCount, allowedTransitions]
      additionalProperties: false
      properties:
        course:
          $ref: "#/components/schemas/Course"
        term:
          type: object
          description: Offerings take their dates from their term.
          required: [id, code, name, startsOn, endsOn]
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            code:
              type: string
            name:
              type: string
            startsOn:
              type: string
              format: date
            endsOn:
              type: string
              format: date
        template:
          description: The subject template version the offering was created from (never modified by course administration).
          oneOf:
            - type: object
              required: [id, code, title, version]
              additionalProperties: false
              properties:
                id:
                  type: string
                  format: uuid
                code:
                  type: string
                title:
                  type: string
                version:
                  type: integer
            - type: "null"
        sections:
          type: array
          items:
            type: object
            required: [id, title, summary, position, isVisible, activityCount, studentVisibleActivityCount]
            additionalProperties: false
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
              summary:
                type: [string, "null"]
              position:
                type: integer
              isVisible:
                type: boolean
              activityCount:
                type: integer
              studentVisibleActivityCount:
                type: integer
                description: Approved, visible activities (shown to students only if the section is visible too).
        enrollmentCounts:
          type: array
          items:
            type: object
            required: [role, active, inactive]
            additionalProperties: false
            properties:
              role:
                $ref: "#/components/schemas/CourseRole"
              active:
                type: integer
              inactive:
                type: integer
        studentVisibleActivityCount:
          type: integer
        unapprovedActivityCount:
          type: integer
        awaitingReviewCount:
          type: integer
        allowedTransitions:
          type: array
          items:
            type: string
            enum: [publish, unpublish]
    ManagedProgramList:
      type: object
      required: [scope, items]
      additionalProperties: false
      properties:
        scope:
          type: string
          description: "`all`: administrator. `granted`: explicit program-management grants only."
          enum: [all, granted]
        items:
          type: array
          items:
            type: object
            required: [id, code, name, description, isActive, subjectCount]
            additionalProperties: false
            properties:
              id:
                type: string
                format: uuid
              code:
                type: string
              name:
                type: string
              description:
                type: [string, "null"]
              isActive:
                type: boolean
              subjectCount:
                type: integer
                minimum: 0
    ProgramManagerGrant:
      type: object
      additionalProperties: false
      oneOf:
        - required: [userId]
        - required: [email]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          minLength: 1
          maxLength: 254
    ProgramManager:
      type: object
      required: [programId, user, grantedAt, grantedBy]
      additionalProperties: false
      properties:
        programId:
          type: string
          format: uuid
        user:
          type: object
          required: [id, email, givenName, familyName, isActive]
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            givenName:
              type: string
            familyName:
              type: string
            isActive:
              type: boolean
              description: Grants of deactivated accounts cannot be exercised.
        grantedAt:
          type: string
          format: date-time
        grantedBy:
          oneOf:
            - type: object
              required: [id, email]
              additionalProperties: false
              properties:
                id:
                  type: string
                  format: uuid
                email:
                  type: string
            - type: "null"
    ProgramManagerList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProgramManager"
    CourseTemplateVersionList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, version, title, description, sectionCount, createdAt]
            additionalProperties: false
            properties:
              id:
                type: string
                format: uuid
              version:
                type: integer
              title:
                type: string
              description:
                type: [string, "null"]
              sectionCount:
                type: integer
              createdAt:
                type: string
                format: date-time
    PersonRef:
      type: object
      required: [id, name, role]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: [string, "null"]
          enum: [student, instructor, non_editing_instructor, null]
          description: The person's course role (null when it no longer applies).
    CourseRef:
      type: object
      required: [id, title, code]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        code:
          type: string
    Conversation:
      type: object
      required: [id, kind, course, counterpart, locked, canPost, canModerate, unreadCount, lastMessage]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [direct, course]
        course:
          $ref: "#/components/schemas/CourseRef"
        counterpart:
          description: The other person of a direct conversation; null for the course conversation.
          oneOf:
            - $ref: "#/components/schemas/PersonRef"
            - type: "null"
        locked:
          type: boolean
        canPost:
          type: boolean
        canModerate:
          type: boolean
        unreadCount:
          type: integer
          minimum: 0
        lastMessage:
          type: [object, "null"]
          required: [senderName, preview, createdAt]
          additionalProperties: false
          properties:
            senderName:
              type: string
            preview:
              type: [string, "null"]
              description: Start of the text; null when the message was hidden.
            createdAt:
              type: string
              format: date-time
    ConversationPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
        nextCursor:
          type: [string, "null"]
    CourseEmailRecipients:
      type: object
      description: AP-044. The BCC list for an e-mail composed in the caller's own e-mail application. Nothing is sent by AcademiaPath.
      required: [course, recipientCount, recipients, excluded]
      additionalProperties: false
      properties:
        course:
          type: object
          required: [id, code, title]
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            code:
              type: string
            title:
              type: string
        recipientCount:
          type: integer
          minimum: 0
          description: The number of entries in `recipients`.
        recipients:
          type: array
          description: Active students with a valid, unique e-mail address, ordered by family name, given name and address.
          items:
            type: object
            required: [name, email]
            additionalProperties: false
            properties:
              name:
                type: string
              email:
                type: string
        excluded:
          type: object
          description: Active students left out of `recipients`.
          required: [invalidEmail, duplicateEmail]
          additionalProperties: false
          properties:
            invalidEmail:
              type: integer
              minimum: 0
              description: Students whose stored address is empty or not a valid e-mail address.
            duplicateEmail:
              type: integer
              minimum: 0
              description: Entries whose address repeats one already listed.
    CourseMessaging:
      type: object
      required: [course, role, courseConversation, directConversations, contacts]
      additionalProperties: false
      properties:
        course:
          $ref: "#/components/schemas/CourseRef"
        role:
          type: string
          enum: [student, instructor, non_editing_instructor]
        courseConversation:
          oneOf:
            - $ref: "#/components/schemas/Conversation"
            - type: "null"
        directConversations:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/PersonRef"
    DirectConversationInput:
      type: object
      required: [recipientUserId]
      additionalProperties: false
      properties:
        recipientUserId:
          type: string
          format: uuid
    Message:
      type: object
      required: [id, seq, sender, body, hidden, mine, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        seq:
          type: integer
          minimum: 0
          description: Server order (strictly increasing).
        sender:
          $ref: "#/components/schemas/PersonRef"
        body:
          type: [string, "null"]
          description: Plain text (never HTML); null when hidden by moderation.
        hidden:
          type: boolean
        mine:
          type: boolean
        createdAt:
          type: string
          format: date-time
    MessagePage:
      type: object
      required: [items, olderCursor, latestSeq, readSeq]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        olderCursor:
          type: [integer, "null"]
          minimum: 0
          description: Pass as `before` to load older messages; null when there are none.
        latestSeq:
          type: [integer, "null"]
          minimum: 0
        readSeq:
          type: integer
          minimum: 0
          description: The caller's read position.
    MessageInput:
      type: object
      required: [body, clientMessageId]
      additionalProperties: false
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 4000
          pattern: "\\S"
        clientMessageId:
          type: string
          format: uuid
          description: Chosen by the client for each message; a retry with the same value returns the first message.
    ReadInput:
      type: object
      required: [upToSeq]
      additionalProperties: false
      properties:
        upToSeq:
          type: integer
          minimum: 0
    MessagingSummary:
      type: object
      required: [unreadMessages, unreadNotifications]
      additionalProperties: false
      properties:
        unreadMessages:
          type: integer
          minimum: 0
        unreadNotifications:
          type: integer
          minimum: 0
    LockResult:
      type: object
      required: [conversationId, locked]
      additionalProperties: false
      properties:
        conversationId:
          type: string
          format: uuid
        locked:
          type: boolean
    AdminCourseConversationList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            required: [course, conversationId, locked, messageCount, lastMessageAt]
            additionalProperties: false
            properties:
              course:
                $ref: "#/components/schemas/CourseRef"
              conversationId:
                type: [string, "null"]
                format: uuid
              locked:
                type: boolean
              messageCount:
                type: integer
                minimum: 0
              lastMessageAt:
                type: [string, "null"]
                format: date-time
    Notification:
      type: object
      required: [id, type, course, data, link, eventAt, read]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [direct_message, course_message, announcement, grade_released, certificate_issued, forum_reply, forum_topic]
        course:
          oneOf:
            - $ref: "#/components/schemas/CourseRef"
            - type: "null"
        data:
          type: object
          maxProperties: 10
          additionalProperties:
            type: string
          description: |
            Display values the recipient may see: `senderName`, `courseCode`, `title` (announcements),
            `activityTitle` (grades), `courseTitle` (certificates), `topicTitle`, `authorName` and `postId`
            (forums), `groupName` (group discussions). Never message or post text, or grade values.
        link:
          type: string
          description: Application path of the destination (which checks access again).
        eventAt:
          type: string
          format: date-time
        read:
          type: boolean
    NotificationPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        nextCursor:
          type: [string, "null"]
    ReadAllResult:
      type: object
      required: [updated]
      additionalProperties: false
      properties:
        updated:
          type: integer
          minimum: 0
    ForumViewer:
      type: object
      required: [role, canPost, canModerate]
      additionalProperties: false
      properties:
        role:
          type: [string, "null"]
          enum: [student, instructor, non_editing_instructor, null]
          description: The caller's forum role; null for an administrator (moderation only).
        canPost:
          type: boolean
        canModerate:
          type: boolean
    ForumLastReply:
      type: [object, "null"]
      required: [authorName, createdAt]
      additionalProperties: false
      properties:
        authorName:
          type: string
        createdAt:
          type: string
          format: date-time
    ForumTopicSummary:
      type: object
      required: [id, title, group, excerpt, author, mine, pinned, locked, hidden, replyCount, lastReply, lastActivityAt, createdAt, editedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        group:
          $ref: "#/components/schemas/ForumGroupRef"
        excerpt:
          type: string
          description: The start of the topic's text (plain text).
        author:
          $ref: "#/components/schemas/PersonRef"
        mine:
          type: boolean
        pinned:
          type: boolean
        locked:
          type: boolean
        hidden:
          type: boolean
          description: Only moderators ever receive hidden topics.
        replyCount:
          type: integer
          minimum: 0
          description: Replies the caller may see.
        lastReply:
          $ref: "#/components/schemas/ForumLastReply"
        lastActivityAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: [string, "null"]
          format: date-time
    ForumTopicPage:
      type: object
      required: [course, viewer, items, nextCursor]
      additionalProperties: false
      properties:
        course:
          $ref: "#/components/schemas/CourseRef"
        viewer:
          $ref: "#/components/schemas/ForumViewer"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ForumTopicSummary"
        nextCursor:
          type: [string, "null"]
    ForumTopic:
      type: object
      required: [id, title, group, excerpt, author, mine, pinned, locked, hidden, replyCount, lastReply, lastActivityAt, createdAt, editedAt, course, body, canReply, canEdit, canModerate, editableUntil]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        group:
          $ref: "#/components/schemas/ForumGroupRef"
        excerpt:
          type: string
        author:
          $ref: "#/components/schemas/PersonRef"
        mine:
          type: boolean
        pinned:
          type: boolean
        locked:
          type: boolean
        hidden:
          type: boolean
        replyCount:
          type: integer
          minimum: 0
        lastReply:
          $ref: "#/components/schemas/ForumLastReply"
        lastActivityAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: [string, "null"]
          format: date-time
        course:
          $ref: "#/components/schemas/CourseRef"
        body:
          type: string
          description: Plain text; clients render it literally.
        canReply:
          type: boolean
        canEdit:
          type: boolean
        canModerate:
          type: boolean
        editableUntil:
          type: [string, "null"]
          format: date-time
          description: When the caller can no longer edit the topic; null when they cannot edit it now.
    ForumTopicInput:
      type: object
      required: [title, body, clientRequestId]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
        body:
          type: string
          minLength: 1
          maxLength: 10000
          pattern: \S
        clientRequestId:
          type: string
          format: uuid
          description: Chosen by the client for this topic; a retry with the same value returns the first topic.
        announce:
          type: boolean
          default: false
          description: Instructors only. Notifies the course's students and teaching staff.
    ForumTopicUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
        body:
          type: string
          minLength: 1
          maxLength: 10000
          pattern: \S
    ForumPost:
      type: object
      required: [id, number, parentPostId, author, body, hidden, mine, canEdit, editableUntil, createdAt, editedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
          description: Position in the topic (1, 2, 3… in the order replies were recorded).
        parentPostId:
          type: [string, "null"]
          format: uuid
          description: The reply this one answers, or null for a reply to the topic.
        author:
          $ref: "#/components/schemas/PersonRef"
        body:
          type: string
          description: Plain text; clients render it literally.
        hidden:
          type: boolean
          description: Only moderators ever receive hidden replies.
        mine:
          type: boolean
        canEdit:
          type: boolean
        editableUntil:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: [string, "null"]
          format: date-time
    ForumThreadItem:
      type: object
      required: [id, number, parentPostId, author, body, hidden, mine, canEdit, editableUntil, createdAt, editedAt, replies]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
        parentPostId:
          type: [string, "null"]
          format: uuid
        author:
          $ref: "#/components/schemas/PersonRef"
        body:
          type: string
        hidden:
          type: boolean
        mine:
          type: boolean
        canEdit:
          type: boolean
        editableUntil:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: [string, "null"]
          format: date-time
