          minLength: 1
          maxLength: 200
          pattern: "\\S"
        code:
          $ref: "#/components/schemas/Code"
        description:
          type: [string, "null"]
          maxLength: 2000
    CourseTransition:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1
    SectionCreate:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        summary:
          type: [string, "null"]
          maxLength: 2000
        isVisible:
          type: boolean
          default: true
    SectionUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        summary:
          type: [string, "null"]
          maxLength: 2000
        isVisible:
          type: boolean
    SectionOrder:
