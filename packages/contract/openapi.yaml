        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 500
        - name: q
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumTopicPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createGroupTopic
      summary: Start a topic in a group's workspace
      description: |
        Current members and teaching staff; `409 GROUP_ARCHIVED` in an archived group. The group's other current
        members are notified (`announce` is ignored). Same retry and rate-limit rules as course topics.
      tags: [Groups, Forums]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForumTopicInput"
      responses:
        "200":
          description: The topic of an earlier attempt with the same clientRequestId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumTopic"
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumTopic"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/forum/topics/{topicId}/read:
    put:
      operationId: markForumTopicRead
      summary: Mark the caller's notification about a topic as read
      description: Clears the topic's unread indicator for the caller (course forum and group topics alike).
      tags: [Forums]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/TopicId"
      responses:
        "204":
          description: Done (no content).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/admin/groups:
    get:
      operationId: listGroupOverviewAdmin
      summary: Group organization per published course (administrators; counts only)
      tags: [Groups]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGroupOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
