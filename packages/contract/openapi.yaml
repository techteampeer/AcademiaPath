  /api/v1/terms:
    get:
      operationId: listTerms
      summary: List academic terms
      description: Administrators only. Ordered by `code`.
      tags:
        - Academic structure
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of terms.
          content:
            application/json:
