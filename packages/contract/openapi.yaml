        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createCourseAnnouncement
      summary: Create a course announcement (draft)
      description: |
        Requires `announcements.manage` (instructor) or the administrator role; never non-editing instructors, the
        design team or program managers. Plain text title and body. Created as a draft. Audited as
