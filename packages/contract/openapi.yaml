  /api/v1/courses/{id}/forum/topics:
    get:
      operationId: listForumTopics
      summary: Topics of a course forum, pinned first, then latest activity
      description: |
        For the course's students, instructors and non-editing instructors (active enrollment, published course),
        and for administrators (read and moderate only). `403 FORUM_NOT_AVAILABLE` when the caller can see the
        course but has no forum access (design team, unpublished course). Hidden topics are listed only for
        moderators. `q` searches topic titles and texts and visible replies; counts and the last reply only
        include replies the caller may see.
      tags: [Forums]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 500
        - name: q
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumTopicPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createForumTopic
      summary: Start a topic
      description: |
        Participants only (administrators moderate but never post). Plain text. A retry with the same
        `clientRequestId` returns the first topic (200). `announce` (instructors only) notifies the course's
        participants. `429 RATE_LIMITED` beyond the per-person forum posting limit.
      tags: [Forums]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForumTopicInput"
      responses:
        "200":
          description: The topic of an earlier attempt with the same clientRequestId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumTopic"
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumTopic"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/forum/topics/{topicId}:
    get:
      operationId: getForumTopic
      summary: A topic with the caller's permissions on it
      description: A hidden topic is "not found" except for moderators.
      tags: [Forums]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TopicId"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumTopic"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateForumTopic
      summary: Edit one's own topic
      description: |
        Only its author, within `FORUM_EDIT_WINDOW_MINUTES` (default 30) of posting, while the topic is not
        locked or hidden and has no replies (`409 EDIT_WINDOW_CLOSED`, `TOPIC_LOCKED` or `EDIT_NOT_ALLOWED`).
        Sets `editedAt`.
      tags: [Forums]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/TopicId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForumTopicUpdate"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumTopic"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/forum/topics/{topicId}/moderation:
    post:
      operationId: moderateForumTopic
      summary: Pin, unpin, lock, unlock, hide or restore a topic (moderators)
      description: |
        Instructors of the course, and administrators as institutional control. Non-editing instructors and
        students get `403 FORBIDDEN`. Repeating the current state changes nothing. Every change is audited
        without the title or text. Hiding withdraws the topic's notifications.
      tags: [Forums]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/TopicId"
      requestBody:
        required: true
