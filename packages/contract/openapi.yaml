        items:
          type: array
          items:
            $ref: "#/components/schemas/ForumThreadItem"
        nextCursor:
          type: [integer, "null"]
          minimum: 1
          description: Pass as `after` for the next replies; null when there are none.
        total:
          type: integer
          minimum: 0
