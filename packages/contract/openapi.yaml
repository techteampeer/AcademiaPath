openapi: 3.1.0
info:
  title: AcademiaPath API
  version: 0.8.0
  description: |
    Backend API contract for the AcademiaPath learning management system.

    Authentication uses server-side sessions. The session token is only ever sent in an HttpOnly
    cookie (`ap_session` in development, `__Host-ap_session` in production; `SameSite=Lax`, `Path=/`,
    `Secure` in production). It never appears in a response body.

    State-changing requests made with the session cookie must also send the session's CSRF token in
    the `X-CSRF-Token` header. Browser requests to state-changing endpoints must come from an allowed
    `Origin`.

    Errors are RFC 9457 Problem Details (`application/problem+json`) with an application-specific
    `code` member.

    List endpoints are paginated: `limit` (1–100, default 20) and an opaque `cursor` taken from the
    previous page's `nextCursor` (`null` on the last page).

    Authorization is enforced server-side and denies by default. `administrator` is the only
    system-level role. Course access comes from the caller's active enrollment in that course:
    staff roles (`design_team`, `instructor`, `non_editing_instructor`) see their assigned courses,
    and students see only their published courses. Courses the caller cannot access respond `404`.

    Course content (activities) follows a review workflow: `draft` → `submitted` → `approved` or
    `returned`. Staff edit a working copy; approval publishes it as the live version, the only one
    students can read. Editing approved content creates a new revision without changing the live
    version until it is approved again.

    Quizzes are activities of type `quiz` that use the same review workflow: approval publishes the
    settings together with a snapshot of the questions. Students never receive answer keys or
    scores; grading happens on the server when an attempt is submitted.

    Assignments are activities of type `assignment` (text submissions) with a due date, an optional
    late-submission window and a points-based rubric, using the same review workflow. Each student
    submits once; the server records the time. Instructors and non-editing instructors grade against
    the rubric and release grades; the administrator role never submits work, grades or releases.

    Grades: every grade is calculated by the server and stored once per student and activity (a
    quiz counts its best submitted attempt by score / maxScore, earliest first on ties). Students see
    a grade only after staff release it; a release copies the current grade, and later changes stay
    hidden until the next release. Grades are shown on the 0–20 scale: points × 20 / maxPoints,
    rounded half up to one decimal place. Course totals sum points over the counted items before
    converting, without weighting.

    Academic hierarchy: academic year → term → program → subject. The academic year is stored on each
    term (`academicYear`, for example 2026 for term `2026-2`). Programs and subjects (course
    templates) are reusable across years and terms; a course is one offering of a subject in a term.

    Tutor: a course-grounded tutor for students, instructors and non-editing instructors. It searches
    only approved lesson text the caller may read in the course (PostgreSQL full-text search) and
    answers through a local, deterministic mock provider (`mode: mock`) that quotes passages with
    citations. No language model or external service is used.
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: System
    description: Operational endpoints
  - name: Authentication
    description: Sign-in, sign-out and CSRF bootstrap
  - name: Account
    description: The signed-in user
  - name: Academic structure
    description: Programs, terms and versioned course templates (administrators only)
  - name: Courses
    description: Courses, their sections and enrollments
  - name: Content
    description: Lessons and external resources in course sections, with review and approval
  - name: Quizzes
    description: Quiz questions, student attempts and server-side grading
  - name: Assignments
    description: Text submissions and rubric grading
  - name: Grades
    description: Gradebook, grade release and students' released grades
  - name: Tutor
    description: Course-grounded tutor (local mock provider) and usage
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Service health check
      tags:
        - System
      responses:
        "200":
          description: The API is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      description: |
        Verifies the credentials and starts a server-side session, set as an HttpOnly cookie.
        Unknown emails, wrong passwords and inactive accounts all receive the same `401` response.
        Rate limited per client IP address and email. Any session cookie already presented is revoked.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: HttpOnly session cookie.
              schema:
                type: string
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Sign out and revoke the current session
      description: Revokes the current session and clears the session cookie. Send no request body.
      tags:
        - Authentication
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Session revoked and cookie cleared.
          headers:
            Set-Cookie:
              description: Expires the session cookie.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/csrf:
    get:
      operationId: getCsrfToken
      summary: Get the CSRF token for the current session
      description: Returns the same CSRF token issued at sign-in, e.g. after a page reload.
      tags:
        - Authentication
      security:
        - sessionCookie: []
      responses:
        "200":
          description: CSRF token for the current session.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Get the signed-in user's profile
      description: |
        Returns safe profile fields only. `systemRole` is the platform-wide role; course-level roles
        come from course enrollments and are not part of this response.
      tags:
        - Account
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The signed-in user.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/programs:
    get:
      operationId: listPrograms
      summary: List academic programs
      description: Administrators only. Ordered by `code`.
      tags:
        - Academic structure
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of programs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createProgram
      summary: Create an academic program
      description: Administrators only. Audited as `program.created`.
      tags:
        - Academic structure
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramCreate"
      responses:
        "201":
          description: Program created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/terms:
    get:
      operationId: listTerms
      summary: List academic terms
      description: Administrators only. Ordered by `code`.
      tags:
        - Academic structure
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of terms.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createTerm
      summary: Create an academic term
      description: Administrators only. `endsOn` must not be before `startsOn`. Audited as `term.created`.
      tags:
        - Academic structure
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermCreate"
      responses:
        "201":
          description: Term created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Term"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/course-templates:
    get:
      operationId: listCourseTemplates
      summary: List course templates with their latest version
      description: Administrators only. Ordered by `code`.
      tags:
        - Academic structure
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of course templates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseTemplatePage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createCourseTemplateVersion
      summary: Create a course template or a new version of one
      description: |
        Administrators only. If no template has this `code`, the template is created at version 1.
        Otherwise a new version is added (latest + 1) and earlier versions are kept unchanged.
        `programId` must match the existing template's program. Audited as `course_template.created`
        or `course_template.version_created`.
      tags:
        - Academic structure
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseTemplateCreate"
      responses:
        "201":
          description: Template version created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseTemplateVersion"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/programs/{programId}:
    put:
      operationId: updateProgram
      summary: Update a program (administrators only)
      description: |
        Changes the name, description and active flag. The code is the program's stable identifier
        and cannot change. Programs are shared across academic years and terms. Audited as
        `program.updated`.
      tags: [Academic structure]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramUpdate"
      responses:
        "200":
          description: The updated program.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/terms/{termId}:
    put:
      operationId: updateTerm
      summary: Update a term (administrators only)
      description: |
        Changes the name and dates. The code (for example `2026-2`) and academic year are the term's
        stable identity and cannot change. Courses offered in the term are not affected.
        `INVALID_TERM_DATES` when the term would end before it starts. Audited as `term.updated`.
      tags: [Academic structure]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/TermId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermUpdate"
      responses:
        "200":
          description: The updated term.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Term"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/course-templates/{templateId}:
    get:
      operationId: getCourseTemplate
      summary: A subject (course template) with its latest version and sections (administrators only)
      tags: [Academic structure]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TemplateId"
      responses:
        "200":
          description: The template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseTemplateDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/courses:
    get:
      operationId: listCourses
      summary: List courses visible to the caller
      description: |
        Administrators see every course. Other users see only courses where they hold an active
        enrollment; students see only published ones. Ordered by `code`.
      tags:
        - Courses
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: termId
          in: query
          required: false
          description: Only courses offered in this term.
          schema:
            type: string
            format: uuid
        - name: programId
          in: query
          required: false
          description: Only courses of this program.
          schema:
            type: string
            format: uuid
        - name: templateId
          in: query
          required: false
          description: Only offerings of this subject (course template).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of courses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursePage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCourse
      summary: Create a course from a course template version
      description: |
        Administrators only. Copies the template version's sections into the new course in a single
        transaction. The template must belong to `programId` (or to no program). Without
        `templateVersion`, the latest version is used. Audited as `course.created`.
      tags:
        - Courses
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseCreate"
      responses:
        "201":
          description: Course created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/courses/{id}:
    get:
      operationId: getCourse
      summary: Get a course the caller can access
      tags:
        - Courses
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: The course.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/courses/{id}/enrollments:
    get:
      operationId: listCourseEnrollments
      summary: List a course's enrollments
      description: |
        Administrators and the course's staff (design team, instructors, non-editing instructors)
        see every enrollment. Students see only their own. Ordered by user email.
      tags:
        - Courses
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of enrollments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createCourseEnrollment
      summary: Enroll a user in a course with a course-level role
      description: |
        Administrators only. Identify the user by `userId` or `email` (exactly one). A user can hold
        one enrollment (one role) per course. Audited as `enrollment.created`.
      tags:
        - Courses
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentCreate"
      responses:
        "201":
          description: User enrolled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/courses/{id}/sections:
    get:
      operationId: listCourseSections
      summary: List a course's sections in order
      description: Students see only visible sections; administrators and course staff see all.
      tags:
        - Courses
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of sections ordered by `position`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/courses/{id}/sections/{sectionId}/activities:
    get:
      operationId: listSectionActivities
      summary: List a section's content in order
      description: |
        Course staff and administrators see the working copy and review status of every item.
        Students see only approved, visible content in visible sections of published courses
        they are enrolled in (the live version), without review metadata.
      tags:
        - Content
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SectionId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of activities ordered by `position`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createSectionActivity
      summary: Add a text lesson or external link to a section
      description: |
        Requires `content.edit` in the course (instructor, design team) or the administrator role.
        New content is always a `draft` and is appended after the section's existing content.
        Link URLs must be absolute `http`/`https` URLs without credentials; they are never fetched
        by the server. Audited as `activity.created`.
      tags:
        - Content
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityCreate"
      responses:
        "201":
          description: Draft created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/courses/{id}/activities/{activityId}:
    get:
      operationId: getActivity
      summary: Read one activity
      description: |
        Staff receive the working copy, review status and live version. Students receive only the
        approved live version; anything else responds `404`.
      tags:
        - Content
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ActivityId"
      responses:
        "200":
          description: The activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateActivity
      summary: Replace the working copy of draft, returned or approved content
      description: |
        Requires `content.edit`. Content waiting for review cannot be edited (`409`). Editing
        approved content sets the status back to `draft`; students keep seeing the previously
        approved live version until the revision is approved. Returned content stays `returned`
        until it is resubmitted. The body must match the activity's type. Audited as
        `activity.updated`.
      tags:
        - Content
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ActivityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityUpdate"
      responses:
        "200":
          description: Working copy updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/courses/{id}/activities/{activityId}/submit:
    post:
      operationId: submitActivityForReview
      summary: Submit draft or returned content for review
      description: Requires `content.submit` (instructor, design team) or the administrator role. Send no request body. Audited as `activity.submitted`.
      tags:
        - Content
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ActivityId"
      responses:
        "200":
          description: Submitted for review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "401":
          $ref: "#/components/responses/Unauthorized"
