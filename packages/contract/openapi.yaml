          application/json:
            schema:
              $ref: "#/components/schemas/ForumTopicModeration"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumTopic"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/forum/topics/{topicId}/posts:
    get:
      operationId: listForumPosts
      summary: Replies of a topic, in order, each with the replies to it
      description: |
        Pages hold replies to the topic ordered by `number`, each with all its replies (one level deep). Pass
        `nextCursor` as `after` for the next page. Hidden replies, and replies to a hidden reply, are returned
        only to moderators; `total` counts the replies the caller may see.
      tags: [Forums]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TopicId"
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumPostPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createForumPost
      summary: Reply to a topic or to a reply
      description: |
        Participants only. `parentPostId` answers a reply to the topic (`422 REPLY_NESTING_LIMIT` for a reply
        to a reply). `409 TOPIC_LOCKED` for non-moderators in a locked topic; `TOPIC_HIDDEN` or `POST_HIDDEN`
        for moderators answering hidden content. A retry with the same `clientRequestId` returns the first
        reply (200). Notifies the topic's author and the answered reply's author (one notification per person
        and topic). `429 RATE_LIMITED` beyond the per-person forum posting limit.
      tags: [Forums]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/TopicId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForumPostInput"
      responses:
        "200":
          description: The reply of an earlier attempt with the same clientRequestId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumPost"
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumPost"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/forum/posts/{postId}:
    patch:
      operationId: updateForumPost
      summary: Edit one's own reply
      description: |
        Only its author, within `FORUM_EDIT_WINDOW_MINUTES` of posting, while the topic is open, the reply is
        visible and has no replies (`409 EDIT_WINDOW_CLOSED`, `TOPIC_LOCKED` or `EDIT_NOT_ALLOWED`). Sets
        `editedAt`.
      tags: [Forums]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForumPostUpdate"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumPost"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
