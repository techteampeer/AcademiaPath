      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectionOrder"
      responses:
        "200":
          description: Every section of the course in its new order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/courses/{id}/sections/{sectionId}:
    put:
      operationId: updateCourseSection
      summary: Rename a section or change its visibility
      description: |
        Administrators only. Send `title`, `summary` and/or `isVisible`. The section must belong to the
        course in the path (`404` otherwise). Hiding a section hides all of its activities from
        students without deleting anything; showing it again reveals only approved, visible
        activities. Audited as `section.updated`.
      tags:
        - Courses
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectionUpdate"
      responses:
        "200":
          description: The updated section.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Section"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/courses/{id}/sections/{sectionId}/activities:
    get:
      operationId: listSectionActivities
      summary: List a section's content in order
      description: |
        Course staff and administrators see the working copy and review status of every item.
        Students see only approved, visible content in visible sections of published courses
        they are enrolled in (the live version), without review metadata.
        Students receive `403 SECTION_LOCKED` (without content) while a section prerequisite locks the activity's section.
      tags:
        - Content
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SectionId"
        - $ref: "#/components/parameters/Limit"
