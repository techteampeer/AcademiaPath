    StudentAssignmentSubmission:
      type: object
      required: [id, activityId, body, submittedAt, isLate, gradeStatus, grade]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        activityId:
          type: string
          format: uuid
        body:
          type: string
        submittedAt:
          type: string
          format: date-time
          description: Recorded by the server clock.
        isLate:
          type: boolean
        gradeStatus:
          $ref: "#/components/schemas/StudentGradeStatus"
