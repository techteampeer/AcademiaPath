      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        courseCode:
          type: string
        courseTitle:
          type: string
        courseStatus:
          $ref: "#/components/schemas/CourseStatus"
        termCode:
          type: string
        role:
