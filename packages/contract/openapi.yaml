          maxLength: 254
        role:
          $ref: "#/components/schemas/CourseRole"
    Enrollment:
      type: object
      required: [id, courseId, role, status, user, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/CourseRole"
        status:
          type: string
          enum: [active, inactive]
        user:
          type: object
          required: [id, email, givenName, familyName]
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            givenName:
              type: string
            familyName:
              type: string
        createdAt:
          type: string
          format: date-time
    EnrollmentPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Enrollment"
        nextCursor:
          type: [string, "null"]
    ActivityType:
      type: string
      description: Content types supported by the content API. `file` activities are documents, created only by uploading.
      enum: [page, link, quiz, assignment, file]
    ReviewStatus:
      type: string
      enum: [draft, submitted, approved, returned]
    PageContent:
      type: object
      description: Plain-text lesson. Clients must render `body` as text, never as HTML.
      required: [body]
      additionalProperties: false
      properties:
        body:
          type: string
    LinkContent:
      type: object
      description: External resource. `url` is an absolute http(s) URL.
      required: [url, description]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
        description:
          type: [string, "null"]
    QuizContent:
      type: object
      description: Quiz settings and totals. Questions and answer keys are never part of an activity.
      required: [instructions, attemptLimit, timeLimitMinutes, shuffleQuestions, shuffleOptions, questionCount, totalPoints]
      additionalProperties: false
      properties:
        instructions:
          type: [string, "null"]
        attemptLimit:
          type: integer
          minimum: 1
        timeLimitMinutes:
          type: [integer, "null"]
        shuffleQuestions:
          type: boolean
        shuffleOptions:
          type: boolean
        questionCount:
          type: integer
        totalPoints:
          type: integer
    RubricCriterion:
      type: object
      required: [id, title, description, maxPoints]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: [string, "null"]
        maxPoints:
          type: integer
          minimum: 1
          maximum: 100
    AssignmentContent:
      type: object
      description: Assignment instructions, deadline, late-submission window and points-based rubric.
      required: [instructions, dueAt, lateUntil, rubric, totalPoints]
      additionalProperties: false
      properties:
        instructions:
          type: string
        dueAt:
          type: string
          format: date-time
        lateUntil:
          type: [string, "null"]
          format: date-time
          description: When set, submissions after `dueAt` and up to this time are accepted and flagged late.
        rubric:
          type: array
          items:
            $ref: "#/components/schemas/RubricCriterion"
        totalPoints:
          type: integer
    DocumentContent:
      type: object
      description: |
        Uploaded document (activity type `file`). Text and summaries are read from the document
        endpoint; `summaryRevision` is the summary revision of this version (working or live).
      required: [documentId, fileName, format, summaryRevision]
      additionalProperties: false
      properties:
        documentId:
          type: string
          format: uuid
        fileName:
          type: string
        format:
          $ref: "#/components/schemas/DocumentFormat"
        summaryRevision:
          type: integer
          minimum: 1
    ActivityContent:
      oneOf:
        - $ref: "#/components/schemas/PageContent"
        - $ref: "#/components/schemas/LinkContent"
        - $ref: "#/components/schemas/QuizContent"
        - $ref: "#/components/schemas/AssignmentContent"
        - $ref: "#/components/schemas/DocumentContent"
    PageContentInput:
      type: object
      required: [title, body]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        body:
          type: string
          minLength: 1
          maxLength: 20000
          pattern: "\\S"
          description: Plain text; line breaks are preserved. HTML is not interpreted.
    LinkContentInput:
      type: object
      required: [title, url]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        url:
          type: string
          minLength: 1
          maxLength: 2048
          description: Absolute http or https URL without embedded credentials.
        description:
          type: string
          maxLength: 1000
    QuizSettingsInput:
      type: object
      required: [title, attemptLimit]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        instructions:
          type: string
          maxLength: 5000
        attemptLimit:
          type: integer
          minimum: 1
          maximum: 10
        timeLimitMinutes:
          type: [integer, "null"]
          minimum: 1
          maximum: 300
          description: Enforced by the server clock. Omit or null for no time limit.
        shuffleQuestions:
          type: boolean
          default: false
        shuffleOptions:
          type: boolean
          default: false
          description: Shuffles options of choice questions (not true/false).
    RubricCriterionInput:
      type: object
      required: [title, maxPoints]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        description:
          type: string
          maxLength: 1000
        maxPoints:
          type: integer
          minimum: 1
          maximum: 100
    AssignmentInput:
      type: object
      required: [title, instructions, dueAt, rubric]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        instructions:
          type: string
          minLength: 1
          maxLength: 20000
          pattern: "\\S"
          description: Plain text; line breaks are preserved. HTML is not interpreted.
        dueAt:
          type: string
          format: date-time
        lateUntil:
          type: [string, "null"]
          format: date-time
          description: |
            Optional end of the late-submission window. Must be after `dueAt` and at most 30 days
            later (`INVALID_DUE_DATE`). Omit or null to reject submissions after `dueAt`.
        rubric:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/RubricCriterionInput"
    ActivityCreate:
      oneOf:
        - allOf:
            - $ref: "#/components/schemas/PageContentInput"
            - type: object
              required: [type]
              properties:
                type:
                  type: string
                  const: page
        - allOf:
            - $ref: "#/components/schemas/LinkContentInput"
            - type: object
              required: [type]
              properties:
                type:
                  type: string
                  const: link
        - allOf:
            - $ref: "#/components/schemas/QuizSettingsInput"
            - type: object
              required: [type]
              properties:
                type:
                  type: string
                  const: quiz
        - allOf:
            - $ref: "#/components/schemas/AssignmentInput"
            - type: object
              required: [type]
              properties:
                type:
                  type: string
                  const: assignment
    ActivityUpdate:
      description: Must match the activity's type.
      oneOf:
        - $ref: "#/components/schemas/PageContentInput"
        - $ref: "#/components/schemas/LinkContentInput"
        - $ref: "#/components/schemas/QuizSettingsInput"
        - $ref: "#/components/schemas/AssignmentInput"
    ActivityReviewDecision:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [approve, return]
        comment:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: "\\S"
          description: Required when returning content.
    ActivityReview:
      type: object
      description: Review metadata (staff only).
      required: [status, comment, submittedAt, submittedByUserId, reviewedAt, reviewedByUserId]
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/ReviewStatus"
        comment:
          type: [string, "null"]
        submittedAt:
          type: [string, "null"]
          format: date-time
        submittedByUserId:
          type: [string, "null"]
          format: uuid
        reviewedAt:
          type: [string, "null"]
          format: date-time
        reviewedByUserId:
          type: [string, "null"]
          format: uuid
    ActivityLiveVersion:
      type: object
      description: The approved version students currently see (staff only).
      required: [title, content, approvedAt]
      additionalProperties: false
      properties:
        title:
          type: string
        content:
          $ref: "#/components/schemas/ActivityContent"
        approvedAt:
          type: string
          format: date-time
    Activity:
      type: object
      description: |
        For staff, `title`/`content` are the working copy and `review`/`liveVersion` are present.
        For students, `title`/`content` are the approved live version and `review`/`liveVersion` are null.
      required: [id, courseId, sectionId, type, position, isVisible, title, content, review, liveVersion, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        sectionId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/ActivityType"
        position:
          type: integer
          minimum: 0
        isVisible:
          type: boolean
        title:
          type: string
        content:
          $ref: "#/components/schemas/ActivityContent"
        review:
          oneOf:
            - $ref: "#/components/schemas/ActivityReview"
            - type: "null"
        liveVersion:
          oneOf:
            - $ref: "#/components/schemas/ActivityLiveVersion"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ActivityPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
        nextCursor:
          type: [string, "null"]

    DocumentFormat:
      type: string
      enum: [pdf, docx, pptx]
    DocumentUpload:
      type: object
      required: [file]
      properties:
        title:
          type: string
          maxLength: 200
          description: Optional display title (send before `file`). Defaults to the file name without its extension.
        file:
          type: string
          contentMediaType: application/octet-stream
          description: One PDF, DOCX or PPTX file.
    DocumentSegment:
      type: object
      description: |
        One block of extracted plain text: a PDF page (`Page 3`), a PPTX slide (`Slide 2`) or a DOCX
        paragraph (`Paragraph 5`; DOCX files have no fixed pages). Clients must render `text` as
        text, never as HTML.
      required: [index, kind, label, text]
      additionalProperties: false
      properties:
        index:
          type: integer
          minimum: 0
        kind:
          type: string
          enum: [page, slide, paragraph]
        label:
          type: string
        text:
          type: string
    DocumentExtraction:
      type: object
      required: [status, detail, characterCount, segmentCount, truncated]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [extracted, no_text]
          description: "`no_text`: the file is valid but has no selectable text (for example scanned pages). No OCR is performed."
        detail:
          type: [string, "null"]
        characterCount:
          type: integer
          minimum: 0
        segmentCount:
          type: integer
          minimum: 0
        truncated:
          type: boolean
          description: True when the text was cut at the extraction limit.
    DocumentInfo:
      type: object
      required: [id, fileName, format, byteSize, uploadedAt, extraction, malwareScan, segments]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
        format:
          $ref: "#/components/schemas/DocumentFormat"
        byteSize:
          type: integer
          minimum: 1
        uploadedAt:
          type: string
          format: date-time
        extraction:
          $ref: "#/components/schemas/DocumentExtraction"
        malwareScan:
          type: object
          description: "No malware scanning service is connected yet, so uploads report `not_scanned` (scanner `none`)."
          required: [status, scanner]
          additionalProperties: false
          properties:
            status:
              type: string
              enum: [not_scanned, clean]
            scanner:
              type: string
        segments:
          type: array
          items:
            $ref: "#/components/schemas/DocumentSegment"
    DocumentSummaryPoint:
      type: object
      required: [text, evidence]
      additionalProperties: false
      properties:
        text:
          type: string
          description: An original sentence from the document (shortened with "…" when long).
        evidence:
          type: object
          required: [segmentIndex, label, quote]
          additionalProperties: false
          properties:
            segmentIndex:
              type: integer
            label:
              type: string
            quote:
              type: string
              description: The full original sentence (line breaks joined with spaces).
    DocumentSummary:
      type: object
      description: |
        One immutable summary revision. With `mode: mock` it is a deterministic extractive summary
        (no language model): the same text and revision always give the same points, and refreshing
        alternates between `key_sentences` and `section_coverage`. `insufficient_text` means there
        was not enough readable text; `points` is then empty.
      required: [id, revision, status, provider, strategy, points, sourceCharacterCount, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [ready, insufficient_text]
        provider:
          type: object
          required: [id, mode, label]
          additionalProperties: false
          properties:
            id:
              type: string
              examples: [mock-extractive-v1]
            mode:
              type: string
              enum: [mock]
            label:
              type: string
              examples: ["Mock AI summary — local demonstration"]
        strategy:
          type: string
          enum: [key_sentences, section_coverage]
        points:
          type: array
          items:
            $ref: "#/components/schemas/DocumentSummaryPoint"
        sourceCharacterCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
    DocumentDetail:
      type: object
      description: |
        Staff: the working document and summary revision, plus the approved summary as `liveSummary`
        (null until approved). Students: the approved document and summary; `liveSummary` is null.
      required: [activityId, courseId, document, summary, liveSummary]
      additionalProperties: false
      properties:
        activityId:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        document:
          $ref: "#/components/schemas/DocumentInfo"
        summary:
          oneOf:
            - $ref: "#/components/schemas/DocumentSummary"
            - type: "null"
        liveSummary:
          oneOf:
            - $ref: "#/components/schemas/DocumentSummary"
            - type: "null"
    QuizQuestionType:
      type: string
      description: Supported now. Matching, short answer and essay are not implemented.
      enum: [single_choice, multiple_choice, true_false]
    QuizChoiceQuestionInput:
      type: object
      required: [type, prompt, points, options]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [single_choice, multiple_choice]
        prompt:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: "\\S"
        points:
          type: integer
          minimum: 1
          maximum: 100
        options:
          type: array
          minItems: 2
          maxItems: 10
          description: Single choice needs exactly one correct option; multiple choice at least one.
          items:
            type: object
            required: [text, isCorrect]
            additionalProperties: false
            properties:
              text:
                type: string
                minLength: 1
                maxLength: 500
                pattern: "\\S"
              isCorrect:
                type: boolean
    QuizTrueFalseQuestionInput:
      type: object
      required: [type, prompt, points, correctAnswer]
      additionalProperties: false
      properties:
        type:
          type: string
          const: true_false
        prompt:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: "\\S"
        points:
          type: integer
          minimum: 1
          maximum: 100
        correctAnswer:
          type: boolean
    QuizQuestionInput:
      oneOf:
        - $ref: "#/components/schemas/QuizChoiceQuestionInput"
        - $ref: "#/components/schemas/QuizTrueFalseQuestionInput"
    QuizOptionWithKey:
      type: object
      required: [id, text, isCorrect]
      additionalProperties: false
      properties:
        id:
          type: string
        text:
          type: string
        isCorrect:
          type: boolean
    QuizOption:
      type: object
      required: [id, text]
      additionalProperties: false
      properties:
        id:
          type: string
        text:
          type: string
    QuizQuestion:
      type: object
      description: Staff view of a question, including the answer key. True/false questions use the options `true` and `false`.
      required: [id, position, type, prompt, points, options]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
        type:
          $ref: "#/components/schemas/QuizQuestionType"
        prompt:
          type: string
        points:
          type: integer
        options:
          type: array
          items:
            $ref: "#/components/schemas/QuizOptionWithKey"
    QuizQuestionList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuizQuestion"
    QuizAnswerInput:
      type: object
      required: [questionId, selectedOptionIds]
      additionalProperties: false
      properties:
        questionId:
          type: string
          format: uuid
        selectedOptionIds:
          type: array
          maxItems: 10
          items:
            type: string
    QuizAnswersSave:
      type: object
      required: [answers]
      additionalProperties: false
      properties:
        answers:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/QuizAnswerInput"
    QuizAttemptSubmit:
      type: object
      description: Only answers may be sent. Scores or results are rejected (`400`).
      additionalProperties: false
      properties:
        answers:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/QuizAnswerInput"
    QuizAttemptStatus:
      type: string
      enum: [in_progress, submitted]
    StudentQuizAttempt:
      type: object
      description: A student's own attempt. Never contains answer keys, correctness or scores.
      required: [id, activityId, attemptNumber, attemptLimit, status, startedAt, deadlineAt, submittedAt, closedByTimeLimit, resultsReleased, questions]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        activityId:
          type: string
          format: uuid
        attemptNumber:
          type: integer
        attemptLimit:
          type: integer
        status:
          $ref: "#/components/schemas/QuizAttemptStatus"
        startedAt:
          type: string
          format: date-time
        deadlineAt:
          type: [string, "null"]
          format: date-time
          description: Server deadline; the server enforces it regardless of the browser clock.
        submittedAt:
          type: [string, "null"]
          format: date-time
        closedByTimeLimit:
          type: boolean
        resultsReleased:
          type: boolean
          description: |
            True once staff have released this student's grade for the quiz (see
            `GET /api/v1/courses/{id}/grades/mine`). Per-attempt scores and answer keys are never
            returned to students.
        questions:
          type: array
          items:
            type: object
            required: [questionId, position, type, prompt, points, options, selectedOptionIds]
            additionalProperties: false
            properties:
              questionId:
                type: string
                format: uuid
              position:
                type: integer
              type:
                $ref: "#/components/schemas/QuizQuestionType"
              prompt:
                type: string
              points:
                type: integer
              options:
                type: array
                description: In the order fixed for this attempt.
                items:
                  $ref: "#/components/schemas/QuizOption"
              selectedOptionIds:
                type: array
                items:
                  type: string
    QuizAttemptStatusItem:
      type: object
      required: [id, attemptNumber, status, startedAt, deadlineAt, submittedAt, closedByTimeLimit]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        attemptNumber:
          type: integer
        status:
          $ref: "#/components/schemas/QuizAttemptStatus"
        startedAt:
          type: string
          format: date-time
        deadlineAt:
          type: [string, "null"]
          format: date-time
        submittedAt:
          type: [string, "null"]
          format: date-time
        closedByTimeLimit:
          type: boolean
    StudentQuizAttemptSummary:
      type: object
      required: [attemptLimit, attemptsUsed, timeLimitMinutes, activeAttemptId, gradeReleased, items]
      additionalProperties: false
      properties:
        attemptLimit:
          type: integer
        attemptsUsed:
          type: integer
        gradeReleased:
          type: boolean
          description: True once staff have released this student's grade for the quiz.
        timeLimitMinutes:
          type: [integer, "null"]
        activeAttemptId:
          type: [string, "null"]
          format: uuid
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuizAttemptStatusItem"
    QuizResultStudent:
      type: object
      required: [id, email, givenName, familyName]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        givenName:
          type: string
        familyName:
          type: string
    QuizResult:
      type: object
      required: [attemptId, attemptNumber, status, startedAt, deadlineAt, submittedAt, closedByTimeLimit, score, maxScore, student]
      additionalProperties: false
      properties:
        attemptId:
          type: string
          format: uuid
        attemptNumber:
          type: integer
        status:
          $ref: "#/components/schemas/QuizAttemptStatus"
        startedAt:
          type: string
          format: date-time
        deadlineAt:
          type: [string, "null"]
          format: date-time
        submittedAt:
          type: [string, "null"]
          format: date-time
        closedByTimeLimit:
          type: boolean
        score:
          type: [integer, "null"]
          description: Server-computed; null while in progress.
        maxScore:
          type: integer
        student:
          $ref: "#/components/schemas/QuizResultStudent"
    QuizResultPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuizResult"
        nextCursor:
          type: [string, "null"]
    QuizAttemptResult:
      allOf:
        - $ref: "#/components/schemas/QuizResult"
        - type: object
          required: [questions]
          properties:
            questions:
              type: array
              items:
                type: object
                required: [questionId, position, type, prompt, points, options, selectedOptionIds, awardedPoints, isCorrect]
                additionalProperties: false
                properties:
                  questionId:
                    type: string
                    format: uuid
                  position:
                    type: integer
                  type:
                    $ref: "#/components/schemas/QuizQuestionType"
                  prompt:
                    type: string
                  points:
                    type: integer
                  options:
                    type: array
                    items:
                      $ref: "#/components/schemas/QuizOptionWithKey"
                  selectedOptionIds:
                    type: array
                    items:
                      type: string
                  awardedPoints:
                    type: [integer, "null"]
                  isCorrect:
                    type: [boolean, "null"]
    Grade20:
      type: number
      minimum: 0
      maximum: 20
      description: |
        Grade on the 0–20 scale: points × 20 / maxPoints, rounded half up to one decimal place
        (for example 15.55 → 15.6). Always calculated by the server.
    GradableType:
      type: string
      enum: [quiz, assignment]
    AssignmentSubmissionCreate:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 50000
          pattern: "\\S"
          description: Plain text; rendered as text, never as HTML.
    RubricScore:
      type: object
      required: [criterionId, title, points, maxPoints]
      additionalProperties: false
      properties:
        criterionId:
          type: string
          format: uuid
        title:
          type: string
        points:
          type: integer
        maxPoints:
          type: integer
    ReleasedGrade:
      type: object
      description: A grade exactly as released to the student. Never includes answer keys.
      required: [points, maxPoints, grade20, releasedAt, feedback, criteria]
      additionalProperties: false
      properties:
        points:
          type: integer
        maxPoints:
          type: integer
        grade20:
          $ref: "#/components/schemas/Grade20"
        releasedAt:
          type: string
          format: date-time
        feedback:
          type: [string, "null"]
        criteria:
          type: array
