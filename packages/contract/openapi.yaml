          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/TrackedActivityType"
        title:
          type: string
    RequiredSection:
      type: object
      required: [sectionId, title, completed]
      additionalProperties: false
      properties:
        sectionId:
          type: string
          format: uuid
        title:
          type: string
        completed:
          type: boolean
    SectionProgressSummary:
      type: object
      required: [sectionId, title, position, locked, requiredSections, completedCount, totalCount, percent, state]
      additionalProperties: false
      properties:
        sectionId:
          type: string
          format: uuid
        title:
          type: string
        position:
          type: integer
        locked:
          type: boolean
          description: True while a visible section it requires is incomplete. Locked activities still count in `totalCount`.
        requiredSections:
          type: array
          description: Visible sections this one requires. Requirements on hidden sections are ignored and never named.
          items:
            $ref: "#/components/schemas/RequiredSection"
        completedCount:
          type: integer
          minimum: 0
        totalCount:
          type: integer
          minimum: 0
        percent:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          description: floor(completedCount × 100 / totalCount); `null` when `totalCount` is 0.
        state:
          $ref: "#/components/schemas/ProgressState"
    CourseProgress:
      type: object
      required: [courseId, continueAt, sections, completedCount, totalCount, percent, state]
      additionalProperties: false
      properties:
        courseId:
          type: string
          format: uuid
        continueAt:
          $ref: "#/components/schemas/ContinueAt"
        sections:
          type: array
          items:
            $ref: "#/components/schemas/SectionProgressSummary"
        completedCount:
          type: integer
          minimum: 0
        totalCount:
          type: integer
          minimum: 0
          description: Eligible activities (see the API description), including those in locked sections.
        percent:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
        state:
          $ref: "#/components/schemas/ProgressState"
    MyProgressList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            required: [courseId, continueAt, completedCount, totalCount, percent, state]
            additionalProperties: false
            properties:
              courseId:
                type: string
                format: uuid
              continueAt:
                $ref: "#/components/schemas/ContinueAt"
              completedCount:
                type: integer
                minimum: 0
              totalCount:
                type: integer
                minimum: 0
              percent:
                type: [integer, "null"]
                minimum: 0
                maximum: 100
              state:
                $ref: "#/components/schemas/ProgressState"
    ActivityProgress:
      type: object
      required: [activityId, type, title, completion, completed, completedAt]
      additionalProperties: false
      properties:
        activityId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/TrackedActivityType"
        title:
          type: string
        completion:
          type: string
          enum: [manual, automatic]
          description: "`manual`: the student marks it complete. `automatic`: a submitted quiz attempt or assignment submission completes it (passing is not required)."
        completed:
          type: boolean
        completedAt:
          type: [string, "null"]
          format: date-time
    SectionProgress:
      type: object
      required: [sectionId, title, position, locked, requiredSections, completedCount, totalCount, percent, state, activities]
      additionalProperties: false
      properties:
        sectionId:
          type: string
          format: uuid
        title:
          type: string
        position:
          type: integer
        locked:
          type: boolean
        requiredSections:
          type: array
          items:
            $ref: "#/components/schemas/RequiredSection"
        completedCount:
          type: integer
          minimum: 0
        totalCount:
          type: integer
          minimum: 0
        percent:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
        state:
          $ref: "#/components/schemas/ProgressState"
        activities:
          type: array
          description: Empty while the section is locked.
          items:
            $ref: "#/components/schemas/ActivityProgress"
    ActivityCompletion:
      type: object
      required: [activityId, sectionId, completed, completedAt]
      additionalProperties: false
      properties:
        activityId:
          type: string
          format: uuid
        sectionId:
          type: string
          format: uuid
        completed:
          type: boolean
        completedAt:
          type: [string, "null"]
          format: date-time
    StudentProgressPage:
      type: object
      required: [totalCount, items, nextCursor]
      additionalProperties: false
