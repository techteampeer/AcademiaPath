          oneOf:
            - type: object
              required: [id, createdAt, expiresAt, expired]
              additionalProperties: false
              properties:
                id:
                  type: string
                  format: uuid
                createdAt:
                  type: string
                  format: date-time
                expiresAt:
                  type: string
                  format: date-time
                expired:
                  type: boolean
            - type: "null"
    UserDetail:
      type: object
