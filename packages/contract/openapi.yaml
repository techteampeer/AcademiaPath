    ForumPostInput:
      type: object
      required: [body, clientRequestId]
      additionalProperties: false
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
          pattern: \S
        clientRequestId:
          type: string
          format: uuid
        parentPostId:
          type: string
          format: uuid
          description: Answer this reply (which must itself answer the topic).
    ForumPostUpdate:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
          pattern: \S
    ForumTopicModeration:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [pin, unpin, lock, unlock, hide, restore]
    ForumPostModeration:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [hide, restore]
    AdminForumCourseList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            required: [course, topicCount, replyCount, lockedTopicCount, hiddenTopicCount, hiddenReplyCount, lastActivityAt]
            additionalProperties: false
            properties:
              course:
                $ref: "#/components/schemas/CourseRef"
              topicCount:
                type: integer
                minimum: 0
              replyCount:
                type: integer
                minimum: 0
              lockedTopicCount:
                type: integer
                minimum: 0
              hiddenTopicCount:
                type: integer
                minimum: 0
              hiddenReplyCount:
                type: integer
                minimum: 0
              lastActivityAt:
                type: [string, "null"]
                format: date-time
    ForumGroupRef:
      type: [object, "null"]
      required: [id, name, archived]
      additionalProperties: false
      description: The student group whose private workspace holds the topic; null for a course-wide topic.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        archived:
          type: boolean
    GroupPersonRef:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    GroupSummary:
      type: object
      required: [id, course, name, description, archived, isMember, memberCount, topicCount, lastActivityAt, unreadCount, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        course:
          $ref: "#/components/schemas/CourseRef"
        name:
          type: string
        description:
          type: [string, "null"]
        archived:
          type: boolean
        isMember:
          type: boolean
        memberCount:
          type: integer
          minimum: 0
          description: Current members (open membership, active student enrollment, active account).
        topicCount:
          type: integer
          minimum: 0
          description: Discussions the caller may see (hidden topics only for moderators).
        lastActivityAt:
          type: [string, "null"]
          format: date-time
        unreadCount:
          type: integer
          minimum: 0
          description: The caller's unread notifications about this group's discussions.
        createdAt:
          type: string
          format: date-time
    CourseGroupList:
      type: object
      required: [course, viewer, items]
      additionalProperties: false
      properties:
        course:
          $ref: "#/components/schemas/CourseRef"
        viewer:
          type: object
          required: [role, canManage, canViewAll]
          additionalProperties: false
          properties:
            role:
              type: [string, "null"]
              enum: [design_team, instructor, non_editing_instructor, student, null]
            canManage:
              type: boolean
            canViewAll:
              type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroupSummary"
    MyGroupList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroupSummary"
    GroupDetail:
      type: object
      required: [group, viewer, members, recentTopics, membershipChanges, candidates]
      additionalProperties: false
      properties:
        group:
          $ref: "#/components/schemas/GroupSummary"
        viewer:
          type: object
          required: [role, isMember, canManage, canRead, canPost, canModerate]
          additionalProperties: false
          properties:
            role:
              type: [string, "null"]
              enum: [design_team, instructor, non_editing_instructor, student, null]
            isMember:
              type: boolean
            canManage:
              type: boolean
            canRead:
              type: boolean
              description: Can read the group's discussions (members and teaching staff; never administrators by that role).
            canPost:
              type: boolean
            canModerate:
              type: boolean
        members:
          type: array
          items:
            type: object
            required: [id, name, addedAt]
            additionalProperties: false
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              addedAt:
                type: string
                format: date-time
        recentTopics:
          type: array
          description: Latest discussion activity; empty for callers who cannot read the group's discussions.
          items:
            type: object
            required: [id, title, replyCount, lastActivityAt, pinned, locked]
            additionalProperties: false
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
              replyCount:
                type: integer
                minimum: 0
              lastActivityAt:
                type: string
                format: date-time
              pinned:
                type: boolean
              locked:
                type: boolean
        membershipChanges:
          type: array
          description: Teaching staff and administrators only (empty for students).
          items:
            type: object
            required: [kind, person, actor, at]
            additionalProperties: false
            properties:
              kind:
                type: string
                enum: [group_created, member_added, member_removed, group_archived]
              person:
                oneOf:
                  - $ref: "#/components/schemas/GroupPersonRef"
                  - type: "null"
              actor:
                oneOf:
                  - $ref: "#/components/schemas/GroupPersonRef"
                  - type: "null"
              at:
                type: string
                format: date-time
        candidates:
          type: array
          description: Active students of the course who can be added (managers of an active group only).
          items:
            $ref: "#/components/schemas/GroupPersonRef"
    GroupInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
        description:
          type: [string, "null"]
          maxLength: 1000
    GroupUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
        description:
          type: [string, "null"]
          maxLength: 1000
    GroupMemberInput:
      type: object
      required: [userIds]
      additionalProperties: false
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            format: uuid
    GroupMemberAddResult:
      type: object
      required: [added, alreadyMembers]
      additionalProperties: false
      properties:
        added:
          type: integer
          minimum: 0
        alreadyMembers:
          type: integer
          minimum: 0
    GroupMemberRemoveResult:
      type: object
      required: [removed]
      additionalProperties: false
      properties:
        removed:
          type: boolean
    AdminGroupOverview:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            required: [course, activeGroups, archivedGroups, memberships, studentsWithoutGroup]
            additionalProperties: false
            properties:
              course:
                $ref: "#/components/schemas/CourseRef"
              activeGroups:
                type: integer
                minimum: 0
              archivedGroups:
                type: integer
                minimum: 0
              memberships:
                type: integer
                minimum: 0
                description: Open memberships in active groups.
              studentsWithoutGroup:
                type: integer
                minimum: 0
