        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: The course's certificates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: issueCertificate
      summary: Issue a certificate to an eligible student
      description: |
        Requires `certificates.manage` (instructor) or the administrator role. In one transaction, with the
        course, policy and the student's enrollment locked, the server re-evaluates eligibility; an ineligible
        student gets `422 CERTIFICATE_NOT_ELIGIBLE`. If the student already has a valid certificate for the
        course, it is returned with `200` and nothing is created (repeated and concurrent requests are safe);
        otherwise `201`. The certificate stores a snapshot of the recipient name, course, program, term,
        issuer and policy. Students of other courses are `404`. Audited as `certificate.issued`.
      tags: [Certificates]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateIssue"
      responses:
        "200":
          description: The student's existing valid certificate (nothing was created).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
        "201":
          description: The issued certificate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/courses/{id}/certificates/{certificateId}/revoke:
    post:
      operationId: revokeCertificate
      summary: Revoke a certificate
      description: |
        Requires `certificates.manage` (instructor) or the administrator role. Records the reason, time and
        staff member; the certificate is kept and verifies as revoked from then on. A revoked certificate
        cannot change again (`409 CERTIFICATE_ALREADY_REVOKED`). Audited as `certificate.revoked`.
      tags: [Certificates]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/CertificateId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateRevoke"
      responses:
        "200":
          description: The revoked certificate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/me/certificates:
    get:
      operationId: getMyCertificates
      summary: The signed-in user's certificates and certificate status per course
      description: |
        The caller's own certificates (valid and revoked), and for each published course they study (active
        student enrollment) whether certificates are enabled, whether they are eligible (released grades only)
        and their valid certificate.
      tags: [Certificates]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The caller's certificates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyCertificates"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/certificates:
    get:
      operationId: listAllCertificates
      summary: Every certificate (administrators)
      description: Administrators only. Newest first, optionally filtered by status or course. Paginated.
      tags: [Certificates]
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [issued, revoked]
        - name: courseId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of certificates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificatePage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/certificates/{certificateId}:
    get:
      operationId: getCertificate
      summary: One certificate's details
      description: |
        The recipient, the course's staff with `certificates.view`, or an administrator. Staff and administrators
        also get the issue and revocation history (from the audit log). Anyone else gets
        `404 CERTIFICATE_NOT_FOUND`.
      tags: [Certificates]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CertificateId"
      responses:
        "200":
          description: The certificate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/certificates/{certificateId}/pdf:
    get:
      operationId: downloadCertificate
      summary: Download a certificate as PDF
      description: |
        Same access as the details. The PDF is generated locally from the stored certificate snapshot (name,
        course, period, issue date, certificate number and verification reference); it never contains e-mail
        addresses or grades. A revoked certificate cannot be downloaded (`409 CERTIFICATE_REVOKED`).
      tags: [Certificates]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CertificateId"
      responses:
        "200":
          description: The certificate (`Content-Disposition` attachment).
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/certificates/verify/{token}:
    get:
      operationId: verifyCertificate
      summary: Verify a certificate (public)
      description: |
        No authentication. `token` is the certificate's opaque verification token (43 base64url characters);
        malformed and unknown tokens get the same `404 CERTIFICATE_NOT_FOUND`, revealing nothing. Returns only
        the status (`valid` or `revoked`), recipient name, course title, academic period, issuer, issue date
        and certificate number. Rate limited per client.
      tags: [Certificates]
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: The certificate's public verification record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateVerification"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Too many verification requests.
  /api/v1/courses/{id}/announcements:
    get:
      operationId: listCourseAnnouncements
