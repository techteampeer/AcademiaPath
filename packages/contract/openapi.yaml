        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createCourseSection
      summary: Add a section to a course offering
      description: |
        Administrators only. Appends a section after the existing ones. Only this offering changes;
        its subject template is never modified. Hidden sections (`isVisible: false`) and their
        activities are never shown to students. Audited as `section.created`.
      tags:
        - Courses
      security:
        - sessionCookie: []
          csrfToken: []
