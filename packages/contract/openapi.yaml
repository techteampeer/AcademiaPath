      properties:
        courseId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/CourseRole"
    UserCreate:
      type: object
      required: [email, givenName, familyName]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        givenName:
          $ref: "#/components/schemas/PersonName"
        familyName:
          $ref: "#/components/schemas/PersonName"
        systemRole:
