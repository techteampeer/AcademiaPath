      summary: The course grading policy (grade categories and weights)
      description: |
        Requires `grades.view` (instructor, non-editing instructor) or the administrator role. Returns the
        saved policy, draft or published, or `status: none` (version 0) when the course has none and uses the
        unweighted calculation.
      tags: [Grades]
      security:
