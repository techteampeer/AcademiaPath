openapi: 3.1.0
info:
  title: AcademiaPath API
  version: 0.25.0
  description: |
    Backend API contract for the AcademiaPath learning management system.

    Authentication uses server-side sessions. The session token is only ever sent in an HttpOnly
    cookie (`ap_session` in development, `__Host-ap_session` in production; `SameSite=Lax`, `Path=/`,
    `Secure` in production). It never appears in a response body.

    State-changing requests made with the session cookie must also send the session's CSRF token in
    the `X-CSRF-Token` header. Browser requests to state-changing endpoints must come from an allowed
    `Origin`.

    Errors are RFC 9457 Problem Details (`application/problem+json`) with an application-specific
    `code` member.

    List endpoints are paginated: `limit` (1–100, default 20) and an opaque `cursor` taken from the
    previous page's `nextCursor` (`null` on the last page).

    Authorization is enforced server-side and denies by default. `administrator` is the only
    system-level role. Course access comes from the caller's active enrollment in that course:
    staff roles (`design_team`, `instructor`, `non_editing_instructor`) see their assigned courses,
    and students see only their published courses. Courses the caller cannot access respond `404`.

    Course content (activities) follows a review workflow: `draft` → `submitted` → `approved` or
    `returned`. Staff edit a working copy; approval publishes it as the live version, the only one
    students can read. Editing approved content creates a new revision without changing the live
    version until it is approved again.

    Quizzes are activities of type `quiz` that use the same review workflow: approval publishes the
    settings together with a snapshot of the questions. Students never receive answer keys or
    scores; grading happens on the server when an attempt is submitted.

    Assignments are activities of type `assignment` (text submissions) with a due date, an optional
    late-submission window and a points-based rubric, using the same review workflow. Each student
    submits once; the server records the time. Instructors and non-editing instructors grade against
    the rubric; only instructors release grades (since 0.16.0); the administrator role never submits work,
    grades or releases.

    Grades: every grade is calculated by the server and stored once per student and activity (a
    quiz counts its best submitted attempt by score / maxScore, earliest first on ties). Students see
    a grade only after staff release it; a release copies the current grade, and later changes stay
    hidden until the next release. Grades are shown on the 0–20 scale: points × 20 / maxPoints,
    rounded half up to one decimal place. Course totals sum points over the counted items before
    converting, without weighting.

    Academic hierarchy: academic year → term → program → subject. The academic year is stored on each
    term (`academicYear`, for example 2026 for term `2026-2`). Programs and subjects (course
    templates) are reusable across years and terms; a course is one offering of a subject in a term.

    Tutor: a course-grounded tutor for students, instructors and non-editing instructors. It searches
    only approved lesson text the caller may read in the course (PostgreSQL full-text search) and
    answers through a local, deterministic mock provider (`mode: mock`) that quotes passages with
    citations. No language model or external service is used.

    Documents: course staff who may edit content upload PDF, DOCX or PPTX files to a course section.
    The server verifies each file's signature and container structure (never trusting the extension
    or the browser's media type), rejects encrypted, macro-enabled, malformed and oversized files,
    extracts the selectable text in a time- and memory-limited worker, and keeps the original in
    private local storage under a server-generated name (never a public URL). Each upload becomes a
    `file` activity with a deterministic, extractive mock summary (`mode: mock`, "Mock AI summary —
    local demonstration"): every point is an original sentence with its page, slide or paragraph as
    evidence. No language model, OCR or external service is used, and no malware scanner is
    connected yet (uploads are recorded as `not_scanned`). Documents use the content review
    workflow: approval freezes the document and the reviewed summary revision; refreshing the summary
    creates a new revision that students do not see until it is approved again.

    User accounts: administrators list, create and edit accounts, deactivate and reactivate them,
    and assign the system role and course roles (enrollments). There is one authentication system
    (email and password with server-side sessions); no SSO. New accounts have no password: the user
    sets one through a single-use activation link that expires (only a SHA-256 hash of its random
    token is stored). Administrators can never read passwords or reuse a link. Local link delivery
    (`ACCOUNT_INVITATION_DELIVERY=local_link`) shows the link to the administrator once, for synthetic
    addresses only; it is a development-only stand-in for secure delivery and identity verification
    and is refused in production. Deactivation revokes all sessions at once, and the last active
    administrator can never be deactivated or demoted.

    Course lifecycle: administrators edit an offering's details, publish (`draft` → `published`) and
    unpublish (`published` → `draft`) it through explicit transitions, and manage its sections (add,
    rename, show or hide, reorder) and enrollments. Each lifecycle change names the course `version`
    it is based on, so concurrent edits are refused rather than lost. Publishing only changes the
    status: students still see only approved, visible content in visible sections and released
    grades. Unpublishing and deactivating enrollments never delete content, attempts, submissions,
    grades or audit records, and offering changes never modify the subject template.

    Program-scoped academic management: administrators may grant a user management of one program's
    subjects (`/programs/{programId}/managers`). A grant lets that user, while active, list, create and
    version the subjects (course templates) of that program only, through the normal course-template
    endpoints. Authorization uses the program stored on the subject, never one taken from the request,
    and is checked inside the writing transaction, so a revocation or deactivation is honored at once.
    Grants never confer administration, course lifecycle, enrollment, grading, submission, quiz-answer,
    student-progress, term or user-management permissions, and course-level design-team roles never
    imply them.

    Learning progress: calculated by the server from stored records on every request; there is no
    browser-side progress. Eligible activities (the denominator) are approved, visible lessons
    (`page`), links, documents (`file`), quizzes and assignments in visible sections of a course;
    drafts that were never approved, hidden activities, hidden sections and unsupported types never
    count, and activities in sections locked by a prerequisite still do. A student completes a
    lesson, link or document by marking it (and can unmark it); a quiz is complete once an attempt is
    submitted (passing is not required) and an assignment once it is submitted. Completion is kept
    separate from performance: progress responses never contain scores or grades, and quiz and
    assignment completion cannot be set by hand. Percentages are rounded down; a course or section
    without eligible activities reports `no_activities` and no percentage.

    Section prerequisites: administrators can make a section require other sections of the same
    course. A section opens when every eligible activity of each visible required section is
    complete (a required section that is hidden or has no eligible activities is treated as complete).
    While a section is locked, students' requests for its activities, documents, quizzes and
    assignments respond `403 SECTION_LOCKED` without content, and the tutor does not use its
    lessons. Staff and administrators are never locked. Courses without prerequisites behave as before.

    Learning resources: links declare a `kind` (`website`, `video` or `interactive`) and remain ordinary
    `link` activities with the same review, visibility, prerequisite and progress rules. Videos and
    interactive tools are referenced by URL only; nothing is embedded, hosted, fetched or executed. New and
    edited links must use `https:` on a domain name without embedded credentials (`422 INVALID_URL`;
    links stored earlier stay readable). Course editors group lessons, links and documents into resource
    folders inside a section, reorder folders and activities, and show or hide reading activities.
    Folders only organize content: students see a folder only when it holds an approved, visible activity
    in a visible, open section, and content is never deleted with a folder.

    Assessment controls: quizzes additionally define a passing threshold (`passingScorePercent`), whether
    students may review correctness after release (`showFeedback`) and a question-pool size
    (`questionsPerAttempt`); quizzes saved earlier keep their behaviour (no threshold, no feedback, every
    question). All settings are part of the reviewed quiz version. Each attempt stores the questions the
    server selected (a random subset of the approved questions when a pool size is set), their order, the
    option order, and its policy (attempt limit, time limit deadline, passing threshold, feedback); none of
    it can change afterwards. Questions are reusable: staff import the approved questions of another quiz of
    the same course, and the copies reach students only after this quiz is approved again. Deadlines are
    computed and enforced by the server clock; answers sent after the deadline are refused and the attempt
    is finalized with the answers saved in time. Expired attempts are finalized on request (no background
    job) whenever attempts, results, grades or progress are read, exactly once even under concurrent
    requests. Passing status and correctness feedback are shown to students only after their grade is
    released; answer keys are never shown to students.

    Quiz timer (0.16.0): the answer window of a timed attempt is [startedAt, deadlineAt], both taken from the
    API server clock. An answer is accepted only if the server clock, read after the attempt is locked, is at
    or before `deadlineAt` (the deadline instant itself is inside the window; one millisecond later is not).
    There is no grace period: nothing extends the answer window (the earlier 10-second grace was removed).
    A late save returns `409 ATTEMPT_EXPIRED`; a late submit closes the attempt with the answers saved in
    time. An attempt closed by its time limit is recorded as submitted at its deadline. Released quiz results
    are judged by the passing threshold saved with the released attempt, so changing a quiz never alters the
    pass/fail status of completed attempts.

    Advanced gradebook (0.16.0): instructors (and administrators) may define grade categories with integer
    weights (for example Quizzes 40 %, Assignments 60 %) and place each quiz or assignment in at most one
    category. A draft policy never affects grades; a published one must total exactly 100 %. Without a
    published policy the course grade is the original unweighted sum of points. With one, each category's
    percentage is its graded points over its graded maxima, and the course percentage is the weighted average
    over the categories that have graded work (their weights scaled up to 100 %); activities outside every
    category are not counted. Ungraded or unsubmitted work is never treated as zero (an earned 0 is), and is
    reported as pending. A course grade is `final` only when it has graded work and every counted activity
    that students can see, or that has a grade, has a released grade unchanged since its release; otherwise
    it is `provisional`. All values are calculated on the server and rounded once, half up, to one decimal.
    Staff see the calculation on current grades; students see it on released grades only. Grades are
    released per activity or selectively (individual or bulk, each item naming the reviewed revision), and
    only instructors release (non-editing instructors have read-only gradebook access). Staff may export the
    gradebook as CSV. Program-management grants give no gradebook access.

    Course roles (0.17.0, unchanged behaviour stated explicitly): editing course content and assessing
    student work are separate permissions. Instructors author content, grade, release grades, configure
    the grading and certificate policies, and issue or revoke certificates. Non-editing instructors never
    change content, policies or what students see: they grade submissions against the rubric (score and
    feedback, which stay hidden until an instructor releases them), read the gradebook, progress and
    certificates, and export the gradebook. The design team authors and reviews content only. Students take
    and submit work and see only their own released results. Administrators read everything and configure
    policies, issue and revoke certificates, but never take, grade or release work.

    Course completion certificates (0.17.0): a course issues certificates only under an enabled certificate
    policy configured by an instructor or administrator (no policy, no certificate). The policy requires
    course completion (every progress-tracked activity complete, as on the progress page), a final course
    grade (every counted activity graded and released, unchanged since release, on the course's grading
    policy, from released grades only), or both, and optionally a minimum course grade, compared exactly
    before rounding and only against a final grade. The course must be published and the student's
    enrollment active. Eligibility is evaluated on the server; staff issue each certificate, and the server
    re-evaluates eligibility in the issuing transaction. One valid certificate exists per student and course
    (repeated or concurrent requests return it). A certificate stores a snapshot of the recipient name,
    course, program, term, issuer and policy, so later changes never alter it; it is never deleted and can
    only be revoked, with a reason. The PDF is generated locally from that snapshot. Anyone can verify a
    certificate with its opaque 43-character token at `/verify/{token}` (application-relative); verification
    shows only the status, recipient name, course, period, issuer, issue date and certificate number.

    Announcements and academic calendar (0.18.0): announcements are plain text (never HTML) for one course or
    the whole institution. Instructors (and administrators) write course announcements; only administrators
    write institution-wide ones; non-editing instructors read every announcement and event of their courses
    but never write; the design team and program-management grants give no writing rights. An announcement
    is a `draft`, `published` (with a `publishAt` instant: in the future it is `scheduled`), or `archived`.
    Readers see only published announcements whose `publishAt` the server clock has reached (no background
    job): drafts, scheduled and archived announcements never appear in lists, counts or by id. Students see
    institution-wide announcements and those of courses where their enrollment is active (published courses
    only); losing the enrollment removes access immediately. Pinned announcements come first, then the
    newest. Read marks persist per user and repeated marks are no-ops. Calendar events (course or
    institution-wide) store UTC instants plus the IANA time zone they are shown in; timed events are sent as
    instants with an explicit offset, all-day events as dates (end inclusive) in a time zone, defaulting to
    the institution's (`INSTITUTION_TIME_ZONE`, America/Lima). The end must follow the start. Events are
    `hidden`, `published` or `cancelled`; students see published and cancelled ones. A published event can
    only be cancelled, never deleted. Calendars also list due dates of approved assignments the reader can
    open; quizzes have no due date. Every write is audited.

    Messaging and notifications (0.19.0): every conversation belongs to one published course. A direct
    conversation joins a student and a member of the course's teaching staff (instructor or non-editing
    instructor); the course conversation is open to the course's current students and teaching staff. Who
    may read and write is derived from current active enrollments on every request (never from a stored or
    client-supplied participant list): losing the enrollment, a deactivated account or an unpublished course
    ends access, and anything the caller may not read is "not found". Administrators and the design team
    have no access to private conversations; administrators may only list course conversations (state and
    size, never messages) and lock or unlock them. Instructors moderate the course conversation (hide a
    message, lock); non-editing instructors take part but never moderate. Messages are plain text (1–4000
    characters), ordered by a server sequence (`seq`), never deleted, never logged or audited with their
    text; a client-chosen `clientMessageId` makes a retried send return the first message. Sending is
    rate-limited per person (`MESSAGE_RATE_LIMIT_MAX` per `MESSAGE_RATE_LIMIT_WINDOW_MINUTES`). Read positions
    only move forward. In-app notifications (no e-mail or push) are recorded in the same transaction as their
    event (a message, a published announcement, a released grade, an issued certificate), one per recipient
    and event key (a repeated event refreshes it). They carry only what the recipient may see (no message
    text, grade value or answer) and are shown only while the recipient still has access to the course.
    Updates are near-real-time by polling (`/me/messaging/summary`, `/conversations/{id}/messages?after=`),
    not guaranteed instant delivery.

    Discussion forums (0.20.0): every published course has one forum of topics (a title and a plain-text
    opening) and replies; a reply answers the topic or a reply to it (one level deep). The course's students,
    instructors and non-editing instructors (active account and enrollment) read and post; instructors also
    moderate (pin, lock, hide and restore); administrators read and moderate any published course's forum as
    institutional control but never post. The design team and program managers have no forum access, and
    forums never expose private conversations. Access is derived from current enrollments on every request.
    Replies are numbered within their topic in commit order (stable, gap-free ordering under concurrency).
    Authors edit their own topic or reply for `FORUM_EDIT_WINDOW_MINUTES` (default 30) while the topic is open,
    the post is visible and nobody has replied to it. Nothing is deleted; hidden topics and replies (and
    replies to a hidden reply) are visible only to moderators and are left out of lists, counts, previews,
    search and notifications. Posting is rate-limited per person (`FORUM_POST_RATE_LIMIT_MAX` per
    `FORUM_POST_RATE_LIMIT_WINDOW_MINUTES`) and idempotent with a client-chosen `clientRequestId`. Replies
    notify the topic's and the answered reply's authors, and announced instructor topics notify the course,
    as one in-app notification per person and topic, never with the text. Moderation is audited without
    text.

    Student groups (0.21.0): instructors of a course (and administrators, as institutional control) create,
    rename, archive and restore groups and add or remove the course's active students; non-editing instructors
    see every group and take part in its discussions but never change groups; students see only the groups they
    currently belong to. A student may belong to several groups. Memberships are never deleted: removing a
    student closes the membership (history), and access is re-checked on every request, so it ends immediately
    (as it does when the enrollment is revoked or the account deactivated). A group's private workspace holds
    forum topics scoped to the group (`group`), visible only to its current members and the course's teaching
    staff: never in the course-wide forum, its search or counts, and never to administrators, the design team
    or program managers. Group topics follow every forum rule (ordering, editing, hiding, locking, rate limits);
    an archived group is read-only history (moderation still works). New group topics notify the group's other
    current members, and group notifications show only while the reader may still read the group. Every group
    management change is audited without discussion text.
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: System
    description: Operational endpoints
  - name: Authentication
    description: Sign-in, sign-out and CSRF bootstrap
  - name: Account
    description: The signed-in user
  - name: Users
    description: Account administration (administrators only)
  - name: Academic structure
    description: Programs, terms and versioned course templates (administrators only)
  - name: Courses
    description: Courses, their sections and enrollments
  - name: Content
    description: Lessons and external resources in course sections, with review and approval
  - name: Quizzes
    description: Quiz questions, student attempts and server-side grading
  - name: Assignments
    description: Text submissions and rubric grading
  - name: Grades
    description: Gradebook, grade release and students' released grades
  - name: Certificates
    description: Course completion certificates, eligibility, issuance, revocation and public verification
  - name: Announcements
    description: Course and institution-wide announcements, scheduling and read tracking
  - name: Calendar
    description: Academic calendar events and assignment due dates
  - name: Messaging
    description: Direct and course conversations (polling, no real-time channel)
  - name: Notifications
    description: In-app notification center
  - name: Forums
    description: Course discussion forums (topics, threaded replies and moderation)
  - name: Groups
    description: Student groups and their private collaborative workspaces
  - name: Tutor
    description: Course-grounded tutor (local mock provider) and usage
  - name: Documents
    description: Uploaded course documents, extracted text and mock summaries
  - name: Progress
    description: Server-calculated learning progress, completion marks and section prerequisites
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Service health check
      tags:
        - System
      responses:
        "200":
          description: The API is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      description: |
        Verifies the credentials and starts a server-side session, set as an HttpOnly cookie.
        Unknown emails, wrong passwords and inactive accounts all receive the same `401` response.
        Rate limited per client IP address and email. Any session cookie already presented is revoked.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: HttpOnly session cookie.
              schema:
                type: string
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Sign out and revoke the current session
      description: Revokes the current session and clears the session cookie. Send no request body.
      tags:
        - Authentication
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Session revoked and cookie cleared.
          headers:
            Set-Cookie:
              description: Expires the session cookie.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/csrf:
    get:
      operationId: getCsrfToken
      summary: Get the CSRF token for the current session
      description: Returns the same CSRF token issued at sign-in, e.g. after a page reload.
      tags:
        - Authentication
      security:
        - sessionCookie: []
      responses:
        "200":
          description: CSRF token for the current session.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/activation/preview:
    post:
      operationId: previewAccountActivation
      summary: Check an account activation link
      description: |
        Returns the name and email of the pending account an activation token belongs to, so the
        activation page can show whom it activates. The token is sent in the body, never in a URL,
        so it does not appear in server or proxy logs. Invalid, expired, used and revoked tokens all
        receive the same `400 INVITATION_INVALID`. Rate limited per client IP address.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivationPreviewRequest"
      responses:
        "200":
          description: The token is valid.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivationPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/activate:
    post:
      operationId: activateAccount
      summary: Activate a pending account by setting its password
      description: |
        Consumes a single-use activation token and sets the account's first password (hashed with
        Argon2id). The token must be unused, unrevoked and unexpired, the account active and still
        without a password; the token is claimed atomically, so it can never be used twice. Other
        open activation links of the account are revoked. Does not sign in: the user then signs in
        normally. Audited as `account.activated` (never with the token or password). Rate limited per
        client IP address. Activation never resets the password of an activated account.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivationRequest"
      responses:
        "204":
          description: Account activated. Sign in with the new password.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Get the signed-in user's profile
      description: |
        Returns safe profile fields only. `systemRole` is the platform-wide role; course-level roles
        come from course enrollments and are not part of this response.
      tags:
        - Account
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The signed-in user.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/me/managed-programs:
    get:
      operationId: listMyManagedPrograms
      summary: Programs whose subjects the signed-in user may manage
      description: |
        Administrators manage every program (`scope: all`). Other users see only the programs they
        hold an explicit program-management grant for (`scope: granted`; empty without grants).
        Grants confer subject (course template) management only: no course, grading, user
        management or system permission.
      tags:
        - Account
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The manageable programs.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedProgramList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/me/progress:
    get:
      operationId: getMyProgress
      summary: The signed-in student's progress in each of their courses
      description: |
        One item per published course in which the caller holds an active student enrollment, in
        course-code order. Each item carries the server-calculated counts, percentage and state, and
        `continueAt`: the first incomplete activity in a section that is open to the student. Staff
        enrollments and draft or archived courses are not listed. Scores and grades are never included.
      tags: [Progress]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Progress per course.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProgressList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/users:
    get:
      operationId: listUsers
      summary: List and search user accounts
      description: |
        Administrators only. Ordered by email. `q` matches part of the email or full name
        (case-insensitive). Never returns passwords, password hashes or activation tokens.
      tags:
        - Users
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          description: Text to find in the email or name.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: status
          in: query
          description: Only active or only deactivated accounts.
          schema:
            type: string
            enum: [active, inactive]
        - name: activation
          in: query
          description: Only accounts that have set a password (`activated`) or not yet (`pending`).
          schema:
            $ref: "#/components/schemas/UserActivationState"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of users.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createUser
      summary: Create a user account
      description: |
        Administrators only. Creates an active account without a password (activation `pending`)
        and, optionally, course enrollments with course-level roles. The email is trimmed and
        lowercased and must be unique (case-insensitive). No default password is ever set: the user
        sets one through a single-use, expiring activation link.

        Activation links (`invitation`): when `ACCOUNT_INVITATION_DELIVERY=local_link` (development
        only; refused in production) the link is returned once in this response, for synthetic
        addresses on reserved domains (`.example`, `.test`, `.invalid`, `.localhost`,
        `example.com/.net/.org`) only. Only a hash of the token is stored, so it can never be shown
        again; issue a new one with `POST /users/{userId}/invitations`. Otherwise `invitation` is
        `null` and `invitationStatus` says why.

        Audited as `user.created`, `enrollment.created` and `user.invitation_issued`.
      tags:
        - Users
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCreateResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/users/{userId}:
    get:
      operationId: getUser
      summary: Get a user account with its course roles
      description: Administrators only. Includes activation state and every enrollment (active and inactive).
      tags:
        - Users
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The user.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateUser
      summary: Update permitted account details
      description: |
        Administrators only. Send only the fields to change. The email can be corrected only while
        the account is pending activation (open activation links are then revoked); afterwards it is
        locked (`EMAIL_LOCKED`). Changing `systemRole` cannot remove the last active administrator
        (`LAST_ADMINISTRATOR`), and administrators cannot change their own system role
        (`SELF_ACCOUNT_CHANGE`). Passwords and activation state cannot be set here. Audited as
        `user.updated`.
      tags:
        - Users
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/users/{userId}/deactivate:
    post:
      operationId: deactivateUser
      summary: Deactivate an account
      description: |
        Administrators only. The account can no longer sign in, every existing session is revoked
        immediately and open activation links are revoked. Enrollments, grades and history are kept.
        The last active administrator cannot be deactivated (`LAST_ADMINISTRATOR`), and
        administrators cannot deactivate themselves (`SELF_ACCOUNT_CHANGE`). Repeating the call on an
        inactive account changes nothing. Send no request body. Audited as `user.deactivated`.
      tags:
        - Users
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The deactivated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/users/{userId}/reactivate:
    post:
      operationId: reactivateUser
      summary: Reactivate a deactivated account
      description: |
        Administrators only. The user can sign in again with their own password; sessions and
        activation links revoked at deactivation stay revoked. A pending account needs a new
        activation link. Repeating the call on an active account changes nothing. Send no request
        body. Audited as `user.reactivated`.
      tags:
        - Users
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The reactivated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/users/{userId}/invitations:
    post:
      operationId: issueUserInvitation
      summary: Issue a new activation link for a pending account
      description: |
        Administrators only. Revokes the account's open activation links and issues a new
        single-use link that expires after `ACCOUNT_INVITATION_TTL_HOURS` (default 72). Only for
        active accounts that have not set a password (`ACCOUNT_ALREADY_ACTIVATED` otherwise): this is
        not a password reset. Requires local link delivery (`INVITATIONS_DISABLED`) and a synthetic
        address (`INVITATION_SYNTHETIC_ONLY`); see `POST /users`. Send no request body. Audited as
        `user.invitation_issued`.
      tags:
        - Users
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "201":
          description: Activation link issued (shown only in this response).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountInvitation"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/programs:
    get:
      operationId: listPrograms
      summary: List academic programs
      description: Administrators only. Ordered by `code`.
      tags:
