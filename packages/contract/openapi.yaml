  /api/v1/courses/{id}/activities/{activityId}/submissions:
    post:
      operationId: submitAssignment
      summary: Submit text work for an approved assignment (students only)
      description: |
        Students only (`assignment.submit`; the administrator role never grants it), for approved,
        visible assignments in published courses they are enrolled in. The server records the
        submission time from its own clock. Submissions up to `dueAt` are on time. When the
        assignment sets `lateUntil`, submissions after `dueAt` and up to `lateUntil` are accepted and
        flagged late (no automatic deduction); otherwise, and after `lateUntil`, they are rejected
        with `SUBMISSION_CLOSED`. One final submission per student (`SUBMISSION_EXISTS`). The approved
        rubric is copied into the submission, so later revisions never change how it is graded.
        Audited as `assignment.submitted`.
      tags: [Assignments]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ActivityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentSubmissionCreate"
      responses:
        "201":
          description: The recorded submission. No grade is returned until it is released.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentAssignmentSubmission"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      operationId: listAssignmentSubmissions
      summary: Submissions to an assignment with their grading status (graders)
      description: |
        Requires `grades.view` (instructor, non-editing instructor) or the administrator role
        (read-only). Ordered by student email.
      tags: [Assignments]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ActivityId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
