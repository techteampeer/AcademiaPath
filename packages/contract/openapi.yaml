                $ref: "#/components/schemas/Conversation"
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/conversations/{conversationId}:
    get:
      operationId: getConversation
      summary: One conversation the caller can read
      tags: [Messaging]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/conversations/{conversationId}/messages:
    get:
      operationId: listMessages
      summary: Messages of a conversation, oldest first within the page
      description: |
        Without a cursor: the latest page. `before`: older messages (pass `olderCursor`). `after`: newer
        messages than a `seq` (polling). At most 100 per page; rate-limited per person.
      tags: [Messaging]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - name: before
          in: query
          schema:
            type: integer
            minimum: 0
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: sendMessage
      summary: Send a message
      description: |
        Plain text, 1–4000 characters. A retry with the same `clientMessageId` returns the first message (200)
        instead of creating another. `409 CONVERSATION_LOCKED` (course conversation locked) or
        `RECIPIENT_UNAVAILABLE` (the other person can no longer receive messages in this course); `429
        RATE_LIMITED` beyond the per-person limit.
      tags: [Messaging]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "200":
          description: The message of an earlier attempt with the same clientMessageId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
