                $ref: "#/components/schemas/TermPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createTerm
      summary: Create an academic term
      description: Administrators only. `endsOn` must not be before `startsOn`. Audited as `term.created`.
      tags:
        - Academic structure
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermCreate"
      responses:
        "201":
          description: Term created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Term"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/course-templates:
    get:
      operationId: listCourseTemplates
      summary: List course templates with their latest version
      description: |
        Administrators see every subject; program managers see only the subjects of programs they hold
        a grant for (others get `403`). Ordered by `code`. `programId` narrows the list further.
      tags:
        - Academic structure
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: programId
          in: query
          description: Only subjects of this program.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of course templates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseTemplatePage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createCourseTemplateVersion
      summary: Create a course template or a new version of one
      description: |
        Administrators, and program managers of the subject's program. If no template has this `code`,
        the template is created at version 1 (a program manager must name one of their programs as
        `programId`). Otherwise a new version is added (latest + 1) and earlier versions are kept
        unchanged; a program manager must manage the program stored on the existing subject (`403`
        otherwise), and `programId` must match it. Course offerings keep the version they were created
        from. Audited as `course_template.created` or `course_template.version_created`.
      tags:
        - Academic structure
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseTemplateCreate"
      responses:
        "201":
          description: Template version created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseTemplateVersion"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/programs/{programId}:
    put:
      operationId: updateProgram
      summary: Update a program (administrators only)
      description: |
        Changes the name, description and active flag. The code is the program's stable identifier
        and cannot change. Programs are shared across academic years and terms. Audited as
        `program.updated`.
      tags: [Academic structure]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramUpdate"
      responses:
        "200":
          description: The updated program.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/programs/{programId}/managers:
    get:
      operationId: listProgramManagers
      summary: List a program's authorized academic managers
      description: Administrators only. Ordered by email.
      tags:
        - Academic structure
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      responses:
        "200":
          description: The program's managers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramManagerList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: grantProgramManager
      summary: Grant a user program-scoped academic management
      description: |
        Administrators only. Identify an existing, active account by `userId` or `email` (exactly one).
        The user may then create and version subjects (course templates) of this program only, while
        their account is active. The grant does not make them an administrator and gives no access to
        courses, grades, submissions, quiz answers, enrollments, terms or user management. A second
        grant for the same user and program is refused (`PROGRAM_MANAGER_EXISTS`). Audited as
        `program_manager.granted`.
      tags:
        - Academic structure
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ProgramId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramManagerGrant"
      responses:
        "201":
          description: Grant created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramManager"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/programs/{programId}/managers/{userId}:
    delete:
      operationId: revokeProgramManager
      summary: Revoke a user's program-scoped academic management
      description: |
        Administrators only. Takes effect immediately: a subject change still in progress finishes
        first (it holds the grant), and every later one is refused. Subjects and versions the user
        created are kept. Audited as `program_manager.revoked`.
      tags:
        - Academic structure
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ProgramId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Grant revoked.
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/terms/{termId}:
    put:
      operationId: updateTerm
      summary: Update a term (administrators only)
      description: |
        Changes the name and dates. The code (for example `2026-2`) and academic year are the term's
        stable identity and cannot change. Courses offered in the term are not affected.
        `INVALID_TERM_DATES` when the term would end before it starts. Audited as `term.updated`.
      tags: [Academic structure]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/TermId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermUpdate"
      responses:
        "200":
          description: The updated term.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Term"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/course-templates/{templateId}:
    get:
      operationId: getCourseTemplate
      summary: A subject (course template) with its latest version and sections
      description: Administrators, and program managers of the subject's stored program (`403` otherwise).
      tags: [Academic structure]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TemplateId"
      responses:
        "200":
          description: The template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseTemplateDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/course-templates/{templateId}/versions:
    get:
      operationId: listCourseTemplateVersions
      summary: Version history of a subject (course template)
      description: |
        Administrators, and program managers of the subject's program (taken from the stored subject,
        never from the request). Newest first. Versions are immutable; course offerings keep the
        version they were created from.
      tags:
        - Academic structure
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TemplateId"
      responses:
        "200":
          description: Every version of the subject.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseTemplateVersionList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/courses:
    get:
      operationId: listCourses
      summary: List courses visible to the caller
      description: |
        Administrators see every course. Other users see only courses where they hold an active
        enrollment; students see only published ones. Ordered by `code`.
      tags:
        - Courses
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: termId
          in: query
          required: false
          description: Only courses offered in this term.
          schema:
            type: string
            format: uuid
        - name: programId
          in: query
          required: false
          description: Only courses of this program.
          schema:
            type: string
            format: uuid
        - name: templateId
          in: query
          required: false
          description: Only offerings of this subject (course template).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of courses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursePage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCourse
      summary: Create a course from a course template version
      description: |
        Administrators only. Copies the template version's sections into the new course in a single
        transaction. The template must belong to `programId` (or to no program). Without
        `templateVersion`, the latest version is used. Audited as `course.created`.
      tags:
        - Courses
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseCreate"
      responses:
        "201":
          description: Course created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/courses/{id}:
    get:
      operationId: getCourse
      summary: Get a course the caller can access
      tags:
        - Courses
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: The course.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateCourse
      summary: Edit a course offering's details
      description: |
        Administrators only. Send the `version` you last read and the fields to change. The title and
        description can always be edited. The code can be changed only while the course is a draft
        (`COURSE_CODE_LOCKED` otherwise) and must stay unique in the term (`COURSE_CODE_TAKEN`).
        Offerings take their dates from their term. Status changes use the publish and unpublish
        operations, never this one. A stale `version` is refused (`COURSE_VERSION_CONFLICT`), so
        concurrent edits cannot silently overwrite each other. Only the offering changes: its subject
        template and template version are never modified. Audited as `course.updated`.
      tags:
        - Courses
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseUpdate"
      responses:
        "200":
          description: The updated course (with its new `version`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/courses/{id}/lifecycle:
    get:
      operationId: getCourseLifecycle
      summary: Course administration overview
      description: |
        Administrators only. The offering with its term, source template version, sections (with
        activity counts), enrollment counts per role and status, and the status transitions allowed
        now. `studentVisibleActivityCount` counts approved, visible activities in visible sections:
        exactly what students can open once the course is published. Activities that were never
        approved (`unapprovedActivityCount`, including those awaiting review) stay hidden from
        students whatever the course status.
      tags:
        - Courses
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: The course overview.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseLifecycle"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/courses/{id}/publish:
    post:
      operationId: publishCourse
      summary: Publish a draft course
      description: |
        Administrators only. Explicit transition `draft` → `published`; any other current status is
        refused (`INVALID_COURSE_TRANSITION`), as is a stale `version` (`COURSE_VERSION_CONFLICT`).
        Publishing changes only the course status: students enrolled in the course can then open it,
        but still see only approved, visible content in visible sections, and only released grades.
        Audited as `course.published`.
      tags:
        - Courses
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseTransition"
      responses:
        "200":
          description: The published course.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/courses/{id}/unpublish:
    post:
      operationId: unpublishCourse
      summary: Unpublish a published course
      description: |
        Administrators only. Explicit transition `published` → `draft`. Students immediately lose
        access to the course; staff keep it. Nothing is deleted: content, enrollments, quiz attempts,
        submissions, grades and audit records stay, and reappear for students when the course is
        published again. Refused for other statuses (`INVALID_COURSE_TRANSITION`) or a stale
        `version` (`COURSE_VERSION_CONFLICT`). Audited as `course.unpublished`.
      tags:
        - Courses
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseTransition"
      responses:
        "200":
          description: The course, now a draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/courses/{id}/enrollments:
    get:
      operationId: listCourseEnrollments
      summary: List a course's enrollments
      description: |
        Administrators and the course's staff (design team, instructors, non-editing instructors)
        see every enrollment. Students see only their own. Ordered by user email.
      tags:
        - Courses
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of enrollments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createCourseEnrollment
      summary: Enroll a user in a course with a course-level role
      description: |
        Administrators only. Identify the user by `userId` or `email` (exactly one). A user can hold
        one enrollment (one role) per course. Audited as `enrollment.created`.
      tags:
        - Courses
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentCreate"
      responses:
        "201":
          description: User enrolled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/courses/{id}/enrollments/{enrollmentId}:
    put:
      operationId: updateCourseEnrollment
      summary: Change an enrollment's course role or status
      description: |
        Administrators only. The enrollment must belong to the course in the path (otherwise `404`).
        Send `role`, `status` or both. Setting `status` to `inactive` removes the user's access to the
        course while keeping their work and grades; `active` restores it (the account must be active).
        A student enrollment with quiz attempts, submissions or grades cannot change to a staff role
        (`ENROLLMENT_HAS_STUDENT_WORK`); set it inactive instead. Audited as `enrollment.updated`.
      tags:
        - Courses
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/EnrollmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentUpdate"
      responses:
        "200":
          description: The updated enrollment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
    delete:
      operationId: deleteCourseEnrollment
      summary: Remove an enrollment that has no history
      description: |
        Administrators only. Removes an enrollment created by mistake. Only allowed when it has no quiz
        attempts, submissions, grades or tutor usage (`ENROLLMENT_HAS_HISTORY` otherwise); for those,
        set `status` to `inactive` instead, which blocks access while keeping everything, and set it
        back to `active` to restore access with the student's history intact. The enrollment must
        belong to the course in the path (`404` otherwise). Audited as `enrollment.deleted`.
      tags:
        - Courses
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/EnrollmentId"
      responses:
        "204":
          description: Enrollment removed.
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/courses/{id}/enrollments/import:
    post:
      operationId: importCourseEnrollments
      summary: Preview or apply a CSV of student enrollments
      description: |
        Administrators only. `csv` holds one `email` per line, optionally followed by `,role`, with an
        optional `email,role` header (at most 500 rows). Bulk import only enrolls existing, active
        accounts as `student` (or confirms an existing active student enrollment); staff roles are
        assigned individually. Every row is validated and reported: `INVALID_EMAIL`,
        `INVALID_ROW`, `INVALID_ROLE`, `ROLE_NOT_ALLOWED`, `DUPLICATE_ROW`, `USER_NOT_FOUND`,
        `USER_INACTIVE`, `ROLE_CONFLICT` (enrolled with another role) or `ENROLLMENT_INACTIVE`.

        With `apply: false` (default) nothing changes. With `apply: true` the import is all or
        nothing: if any row has an error, nothing is applied (`422 IMPORT_HAS_ERRORS`); a concurrent
        change rolls the whole import back (`409 IMPORT_CONFLICT`). Audited as `enrollment.created`
        per new enrollment and `enrollments.imported`.
      tags:
        - Courses
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentImportRequest"
      responses:
        "200":
          description: The validated rows, and whether they were applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentImportResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/courses/{id}/sections:
    get:
      operationId: listCourseSections
      summary: List a course's sections in order
      description: Students see only visible sections; administrators and course staff see all.
      tags:
        - Courses
      security:
        - sessionCookie: []
      parameters:
