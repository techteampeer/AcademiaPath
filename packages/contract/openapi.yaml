        format: uuid
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ap_session
      description: HttpOnly session cookie. Named `__Host-ap_session` in production.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF token from the login response or `GET /api/v1/auth/csrf`.
  headers:
    NoStore:
      description: Authenticated responses must not be cached.
      schema:
        type: string
        const: no-store
  responses:
    BadRequest:
      description: |
        The request is invalid (`VALIDATION_ERROR`), or the activation token is invalid, expired,
        already used or revoked (`INVITATION_INVALID`; one code for all, so tokens cannot be probed).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: This activation link is invalid, has expired or was already used.
            code: INVITATION_INVALID
    ValidationError:
      description: "The request body is missing or invalid (`code`: `VALIDATION_ERROR`)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: Request validation failed.
            code: VALIDATION_ERROR
    Unauthorized:
      description: |
        `code` is `INVALID_CREDENTIALS` for failed sign-in (generic; does not reveal whether the email
        exists), or `UNAUTHENTICATED` when the session cookie is missing, invalid, expired or revoked.
        An invalid session cookie is cleared.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: Invalid email or password.
            code: INVALID_CREDENTIALS
    Forbidden:
      description: "`code` is `CSRF_TOKEN_INVALID`, `ORIGIN_NOT_ALLOWED`, `FORBIDDEN` (for example a non-administrator calling an administrator endpoint), `SELF_REVIEW_NOT_ALLOWED` or `SECTION_LOCKED` (a student opening content of a section that a prerequisite still locks), `FEEDBACK_NOT_AVAILABLE` (correctness review not enabled or not yet released) `MESSAGING_NOT_AVAILABLE` (messaging is for the students and teaching staff of a published course) `FORUM_NOT_AVAILABLE` (the course forum is for the students and teaching staff of a published course), `GROUPS_NOT_AVAILABLE` (student groups are for the course's students, teaching staff and administrators) or `GROUP_DISCUSSIONS_NOT_AVAILABLE` (a group's discussions are for its members and the course's teaching staff)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: Missing or invalid CSRF token.
            code: CSRF_TOKEN_INVALID
    PayloadTooLarge:
      description: "The uploaded file exceeds the configured size limit (`code`: `PAYLOAD_TOO_LARGE`)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Payload Too Large
            status: 413
            detail: The file exceeds the 10 MB upload limit.
            code: PAYLOAD_TOO_LARGE
    UnsupportedMediaType:
      description: |
        The request is not `multipart/form-data` (`UNSUPPORTED_MEDIA_TYPE`), or the file is not an
        accepted document type: not `.pdf`/`.docx`/`.pptx`, macro-enabled, a template or a slide show
        (`UNSUPPORTED_FILE_TYPE`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Unsupported Media Type
            status: 415
            detail: Only PDF (.pdf), Word (.docx) and PowerPoint (.pptx) files are accepted.
            code: UNSUPPORTED_FILE_TYPE
    RateLimited:
      description: "Too many sign-in or activation attempts, tutor requests, messages, forum posts or polling requests (`code`: `RATE_LIMITED`)."
      headers:
        Retry-After:
          description: Seconds until another attempt is allowed.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            detail: Too many attempts. Try again later.
            code: RATE_LIMITED
    NotFound:
      description: "The resource does not exist or the caller cannot access it (`code`: `NOT_FOUND`, or `CERTIFICATE_NOT_FOUND` for certificates and verification tokens)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: Course not found.
            code: NOT_FOUND
    Conflict:
      description: |
        A uniqueness rule was violated: `PROGRAM_CODE_TAKEN`, `TERM_CODE_TAKEN`, `COURSE_CODE_TAKEN`,
        `ENROLLMENT_EXISTS`, `TEMPLATE_CODE_TAKEN` or `TEMPLATE_VERSION_CONFLICT`; or an invalid review transition:
        `ACTIVITY_UNDER_REVIEW`, `INVALID_REVIEW_STATE`; or a quiz rule: `QUIZ_QUESTION_LIMIT`,
        `ATTEMPT_LIMIT_REACHED`, `ATTEMPT_NOT_IN_PROGRESS`, `ATTEMPT_EXPIRED`, `ATTEMPT_CONFLICT`; or an
        assignment rule: `SUBMISSION_EXISTS`, `SUBMISSION_CLOSED`; or an account rule: `EMAIL_TAKEN`,
        `EMAIL_LOCKED`, `LAST_ADMINISTRATOR`, `SELF_ACCOUNT_CHANGE`, `INVITATIONS_DISABLED`,
        `ACCOUNT_ALREADY_ACTIVATED`; or an enrollment rule: `ENROLLMENT_HAS_STUDENT_WORK`,
        `IMPORT_CONFLICT`, `ENROLLMENT_HAS_HISTORY`; or a course lifecycle rule:
        `COURSE_VERSION_CONFLICT`, `INVALID_COURSE_TRANSITION`, `COURSE_CODE_LOCKED`,
        `SECTION_ORDER_STALE`; or `PROGRAM_MANAGER_EXISTS` (the user already manages the program); or a
        learning-resource rule: `RESOURCE_FOLDER_NOT_EMPTY`, `RESOURCE_ORDER_STALE`; or
        `GRADING_POLICY_CONFLICT` (the grading policy changed since it was loaded); or a certificate rule:
        `CERTIFICATE_POLICY_CONFLICT`, `CERTIFICATE_ALREADY_REVOKED`, `CERTIFICATE_REVOKED`; or an
        announcement or calendar rule: `ANNOUNCEMENT_ARCHIVED`, `ANNOUNCEMENT_NOT_SCHEDULED`, `EVENT_CANCELLED`,
        `EVENT_WAS_PUBLISHED`; or a messaging rule: `CONVERSATION_LOCKED`, `RECIPIENT_UNAVAILABLE`; or a forum
        rule: `TOPIC_LOCKED`, `TOPIC_HIDDEN`, `POST_HIDDEN`, `EDIT_NOT_ALLOWED` (hidden, or already answered),
        `EDIT_WINDOW_CLOSED`, `IDEMPOTENCY_KEY_REUSED`; or a group rule: `GROUP_ARCHIVED`, `GROUP_NAME_TAKEN`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Conflict
            status: 409
            detail: The user is already enrolled in this course.
            code: ENROLLMENT_EXISTS
    UnprocessableContent:
      description: |
        The request is well-formed but refers to missing or incompatible data: `INVALID_TERM_DATES`,
        `TERM_YEAR_MISMATCH`,
        `PROGRAM_NOT_FOUND`, `PROGRAM_INACTIVE`, `TERM_NOT_FOUND`, `TEMPLATE_NOT_FOUND`,
        `TEMPLATE_VERSION_NOT_FOUND`, `TEMPLATE_PROGRAM_MISMATCH`, `USER_NOT_FOUND`, `USER_INACTIVE`,
        `INVALID_URL`, `CONTENT_TYPE_MISMATCH`, `REVIEW_COMMENT_REQUIRED`, `QUIZ_HAS_NO_QUESTIONS`,
        `INVALID_ANSWER_KEY`, `INVALID_ANSWER`, `INVALID_DUE_DATE`, `INVALID_RUBRIC_SCORES` or
        `QUALITY_CHECK_BLOCKED` (content with a blocking quality finding is neither submitted nor approved) or
        `QUALITY_REPORT_TOO_LARGE` (a course too large for one quality report); or a refused
        document upload: `FILE_SIGNATURE_MISMATCH` (content does not match the extension),
        `DOCUMENT_ENCRYPTED`, `DOCUMENT_MALFORMED`, `DOCUMENT_LIMITS_EXCEEDED` (decompressed size,
        processing time or memory) or `MALWARE_DETECTED`; or an account or enrollment rule:
        `COURSE_NOT_FOUND`, `DUPLICATE_COURSE`, `INVITATION_SYNTHETIC_ONLY`, `PASSWORD_TOO_WEAK`,
        `IMPORT_HAS_ERRORS`, `IMPORT_TOO_LARGE` or `INVALID_SECTION_ORDER`; or a progress rule:
        `COMPLETION_AUTOMATIC` (quizzes and assignments complete on submission), `PREREQUISITE_SELF`,
        `PREREQUISITE_SECTION_NOT_FOUND` or `PREREQUISITE_CYCLE`; or a learning-resource rule:
        `RESOURCE_FOLDER_NOT_FOUND` or `RESOURCE_NOT_ORGANIZABLE`; or an assessment rule:
        `QUIZ_POOL_TOO_SMALL`, `QUIZ_POOL_POINTS_MIXED` or `QUIZ_SOURCE_INVALID`; or a gradebook rule:
        `GRADE_CATEGORY_DUPLICATE`, `GRADE_CATEGORY_ACTIVITY_DUPLICATE`, `GRADE_CATEGORY_ACTIVITY_INVALID`,
        `GRADE_WEIGHTS_INVALID` or `GRADE_RELEASE_DUPLICATE`; or a certificate rule:
        `CERTIFICATE_POLICY_INVALID` or `CERTIFICATE_NOT_ELIGIBLE`; or an announcement or calendar rule:
        `PUBLISH_AT_INVALID`, `EVENT_TIME_INVALID`, `INVALID_TIME_ZONE` or `RANGE_INVALID`; or
        `RECIPIENT_NOT_ALLOWED` (a direct conversation that is not between a student and the course's teaching
        staff); or `REPLY_NESTING_LIMIT` (a forum reply to a reply to a reply); or `MEMBER_NOT_ELIGIBLE` (only
        active students of the group's course can join it).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Unprocessable Entity
            status: 422
            detail: The course template belongs to a different program.
            code: TEMPLATE_PROGRAM_MISMATCH
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
        - timestamp
      additionalProperties: false
