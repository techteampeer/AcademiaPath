                $ref: "#/components/schemas/ResourceFolderList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/courses/{id}/resource-folders/{folderId}:
    put:
      operationId: renameResourceFolder
      summary: Rename a resource folder
      description: Requires `content.edit` or the administrator role. Audited as `resource_folder.renamed`.
      tags: [Content]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/FolderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceFolderInput"
      responses:
        "200":
          description: The renamed folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceFolder"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteResourceFolder
      summary: Delete an empty resource folder
      description: |
