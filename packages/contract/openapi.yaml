openapi: 3.1.0
info:
  title: AcademiaPath API
  version: 0.1.0
  description: Backend API contract for the AcademiaPath learning management system.
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: System
    description: Operational endpoints
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Service health check
      tags:
        - System
      responses:
        "200":
          description: The API is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
        - timestamp
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
          examples:
            - academiapath-api
        timestamp:
          type: string
          format: date-time
