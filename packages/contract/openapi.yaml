openapi: 3.1.0
info:
  title: AcademiaPath API
  version: 0.5.0
  description: |
    Backend API contract for the AcademiaPath learning management system.

    Authentication uses server-side sessions. The session token is only ever sent in an HttpOnly
    cookie (`ap_session` in development, `__Host-ap_session` in production; `SameSite=Lax`, `Path=/`,
    `Secure` in production). It never appears in a response body.

    State-changing requests made with the session cookie must also send the session's CSRF token in
    the `X-CSRF-Token` header. Browser requests to state-changing endpoints must come from an allowed
    `Origin`.

    Errors are RFC 9457 Problem Details (`application/problem+json`) with an application-specific
    `code` member.

    List endpoints are paginated: `limit` (1–100, default 20) and an opaque `cursor` taken from the
    previous page's `nextCursor` (`null` on the last page).

    Authorization is enforced server-side and denies by default. `administrator` is the only
    system-level role. Course access comes from the caller's active enrollment in that course:
    staff roles (`design_team`, `instructor`, `non_editing_instructor`) see their assigned courses,
    and students see only their published courses. Courses the caller cannot access respond `404`.

    Course content (activities) follows a review workflow: `draft` → `submitted` → `approved` or
    `returned`. Staff edit a working copy; approval publishes it as the live version, the only one
    students can read. Editing approved content creates a new revision without changing the live
    version until it is approved again.

    Quizzes are activities of type `quiz` that use the same review workflow: approval publishes the
    settings together with a snapshot of the questions. Students never receive answer keys or
    scores; grading happens on the server when an attempt is submitted, and results are visible to
    course staff only until a grade-release feature exists.
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: System
    description: Operational endpoints
  - name: Authentication
    description: Sign-in, sign-out and CSRF bootstrap
  - name: Account
    description: The signed-in user
  - name: Academic structure
    description: Programs, terms and versioned course templates (administrators only)
  - name: Courses
    description: Courses, their sections and enrollments
  - name: Content
    description: Lessons and external resources in course sections, with review and approval
  - name: Quizzes
    description: Quiz questions, student attempts and server-side grading
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Service health check
      tags:
        - System
      responses:
        "200":
          description: The API is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      description: |
        Verifies the credentials and starts a server-side session, set as an HttpOnly cookie.
        Unknown emails, wrong passwords and inactive accounts all receive the same `401` response.
        Rate limited per client IP address and email. Any session cookie already presented is revoked.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: HttpOnly session cookie.
              schema:
                type: string
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Sign out and revoke the current session
      description: Revokes the current session and clears the session cookie. Send no request body.
      tags:
        - Authentication
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Session revoked and cookie cleared.
          headers:
            Set-Cookie:
              description: Expires the session cookie.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/csrf:
    get:
      operationId: getCsrfToken
      summary: Get the CSRF token for the current session
      description: Returns the same CSRF token issued at sign-in, e.g. after a page reload.
      tags:
        - Authentication
      security:
        - sessionCookie: []
      responses:
        "200":
          description: CSRF token for the current session.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Get the signed-in user's profile
      description: |
        Returns safe profile fields only. `systemRole` is the platform-wide role; course-level roles
        come from course enrollments and are not part of this response.
      tags:
        - Account
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The signed-in user.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/programs:
    get:
      operationId: listPrograms
      summary: List academic programs
      description: Administrators only. Ordered by `code`.
      tags:
        - Academic structure
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of programs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createProgram
      summary: Create an academic program
      description: Administrators only. Audited as `program.created`.
      tags:
        - Academic structure
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramCreate"
      responses:
        "201":
          description: Program created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/terms:
    get:
      operationId: listTerms
      summary: List academic terms
      description: Administrators only. Ordered by `code`.
      tags:
        - Academic structure
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of terms.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createTerm
      summary: Create an academic term
      description: Administrators only. `endsOn` must not be before `startsOn`. Audited as `term.created`.
      tags:
        - Academic structure
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermCreate"
      responses:
        "201":
          description: Term created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Term"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/course-templates:
    get:
      operationId: listCourseTemplates
      summary: List course templates with their latest version
      description: Administrators only. Ordered by `code`.
      tags:
        - Academic structure
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of course templates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseTemplatePage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createCourseTemplateVersion
      summary: Create a course template or a new version of one
      description: |
        Administrators only. If no template has this `code`, the template is created at version 1.
        Otherwise a new version is added (latest + 1) and earlier versions are kept unchanged.
        `programId` must match the existing template's program. Audited as `course_template.created`
        or `course_template.version_created`.
      tags:
        - Academic structure
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseTemplateCreate"
      responses:
        "201":
          description: Template version created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseTemplateVersion"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/courses:
    get:
      operationId: listCourses
      summary: List courses visible to the caller
      description: |
        Administrators see every course. Other users see only courses where they hold an active
        enrollment; students see only published ones. Ordered by `code`.
      tags:
        - Courses
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of courses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursePage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCourse
      summary: Create a course from a course template version
      description: |
        Administrators only. Copies the template version's sections into the new course in a single
        transaction. The template must belong to `programId` (or to no program). Without
        `templateVersion`, the latest version is used. Audited as `course.created`.
      tags:
        - Courses
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseCreate"
      responses:
        "201":
          description: Course created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/courses/{id}:
    get:
      operationId: getCourse
      summary: Get a course the caller can access
      tags:
        - Courses
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: The course.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/courses/{id}/enrollments:
    get:
      operationId: listCourseEnrollments
      summary: List a course's enrollments
      description: |
        Administrators and the course's staff (design team, instructors, non-editing instructors)
        see every enrollment. Students see only their own. Ordered by user email.
      tags:
        - Courses
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of enrollments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createCourseEnrollment
      summary: Enroll a user in a course with a course-level role
      description: |
        Administrators only. Identify the user by `userId` or `email` (exactly one). A user can hold
        one enrollment (one role) per course. Audited as `enrollment.created`.
      tags:
        - Courses
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentCreate"
      responses:
        "201":
          description: User enrolled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/courses/{id}/sections:
    get:
      operationId: listCourseSections
      summary: List a course's sections in order
      description: Students see only visible sections; administrators and course staff see all.
      tags:
        - Courses
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of sections ordered by `position`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/courses/{id}/sections/{sectionId}/activities:
    get:
      operationId: listSectionActivities
      summary: List a section's content in order
      description: |
        Course staff and administrators see the working copy and review status of every item.
        Students see only approved, visible content in visible sections of published courses
        they are enrolled in (the live version), without review metadata.
      tags:
        - Content
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SectionId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of activities ordered by `position`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createSectionActivity
      summary: Add a text lesson or external link to a section
      description: |
        Requires `content.edit` in the course (instructor, design team) or the administrator role.
        New content is always a `draft` and is appended after the section's existing content.
        Link URLs must be absolute `http`/`https` URLs without credentials; they are never fetched
        by the server. Audited as `activity.created`.
      tags:
        - Content
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityCreate"
      responses:
        "201":
          description: Draft created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/courses/{id}/activities/{activityId}:
    get:
      operationId: getActivity
      summary: Read one activity
      description: |
        Staff receive the working copy, review status and live version. Students receive only the
        approved live version; anything else responds `404`.
      tags:
        - Content
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ActivityId"
      responses:
        "200":
          description: The activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateActivity
      summary: Replace the working copy of draft, returned or approved content
      description: |
        Requires `content.edit`. Content waiting for review cannot be edited (`409`). Editing
        approved content sets the status back to `draft`; students keep seeing the previously
        approved live version until the revision is approved. Returned content stays `returned`
        until it is resubmitted. The body must match the activity's type. Audited as
        `activity.updated`.
      tags:
        - Content
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ActivityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityUpdate"
      responses:
        "200":
          description: Working copy updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/courses/{id}/activities/{activityId}/submit:
    post:
      operationId: submitActivityForReview
      summary: Submit draft or returned content for review
      description: Requires `content.submit` (instructor, design team) or the administrator role. Send no request body. Audited as `activity.submitted`.
      tags:
        - Content
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ActivityId"
      responses:
        "200":
          description: Submitted for review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/courses/{id}/activities/{activityId}/review:
    post:
      operationId: reviewActivity
      summary: Approve or return submitted content
      description: |
        Requires `content.review` (design team) or the administrator role; instructors cannot
        approve. The person who submitted the content cannot approve it
        (`SELF_REVIEW_NOT_ALLOWED`). Approving publishes the working copy as the live version;
        returning requires a `comment`. Audited as `activity.approved` or `activity.returned`.
      tags:
        - Content
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ActivityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityReviewDecision"
      responses:
        "200":
          description: Review decision recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/courses/{id}/activities/{activityId}/questions:
    get:
      operationId: listQuizQuestions
      summary: List a quiz's questions with answer keys (staff only)
      description: Requires `content.viewUnapproved` (course staff) or the administrator role. Students receive `403`.
      tags: [Quizzes]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ActivityId"
      responses:
        "200":
          description: Working questions in order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizQuestionList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addQuizQuestion
      summary: Add a question to a quiz
      description: |
        Requires `content.edit`. Not allowed while the quiz is waiting for review (`409`). Changing an
        approved quiz starts a draft revision; students keep the approved version until it is
        approved again. Audited as `quiz.question_added`.
      tags: [Quizzes]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ActivityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizQuestionInput"
      responses:
        "201":
          description: Question added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizQuestion"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/courses/{id}/activities/{activityId}/questions/{questionId}:
    put:
      operationId: updateQuizQuestion
      summary: Replace a quiz question (same rules as adding)
      description: Audited as `quiz.question_updated`. The question keeps its id.
      tags: [Quizzes]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ActivityId"
        - $ref: "#/components/parameters/QuestionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizQuestionInput"
      responses:
        "200":
          description: Question updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizQuestion"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
    delete:
      operationId: removeQuizQuestion
      summary: Remove a quiz question (same rules as adding)
      description: Audited as `quiz.question_removed`. Existing attempts keep their own copy of the question.
      tags: [Quizzes]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ActivityId"
        - $ref: "#/components/parameters/QuestionId"
      responses:
        "204":
          description: Question removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/courses/{id}/activities/{activityId}/attempts:
    post:
      operationId: startQuizAttempt
      summary: Start (or resume) an attempt at an approved quiz
      description: |
        Students only (`quiz.attempt`), for approved, visible quizzes in published courses they are
        enrolled in. Returns the active attempt (`200`) if one exists, otherwise starts a new one
        (`201`) using the approved quiz version, with question and option order fixed for the
        attempt. The attempt limit and time limit are enforced by the server and database. No
        request body. Audited as `quiz.attempt_started`.
      tags: [Quizzes]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ActivityId"
      responses:
        "200":
          description: The attempt already in progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentQuizAttempt"
        "201":
          description: A new attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentQuizAttempt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/courses/{id}/activities/{activityId}/attempts/mine:
    get:
      operationId: getMyQuizAttempts
      summary: The signed-in student's attempts at a quiz (no scores)
      tags: [Quizzes]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ActivityId"
      responses:
        "200":
          description: Attempt status summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentQuizAttemptSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/courses/{id}/attempts/{attemptId}:
    get:
      operationId: getMyQuizAttempt
      summary: One of the signed-in student's attempts, without answer keys or scores
      description: An attempt past its deadline is submitted automatically with the answers saved in time.
      tags: [Quizzes]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/AttemptId"
      responses:
        "200":
          description: The attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentQuizAttempt"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/courses/{id}/attempts/{attemptId}/answers:
    put:
      operationId: saveQuizAnswers
      summary: Save answers of an attempt in progress
      description: |
        Replaces the selections for the given questions. After the server-side deadline the attempt is
        submitted with the answers saved in time and this request is rejected (`ATTEMPT_EXPIRED`).
      tags: [Quizzes]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/AttemptId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizAnswersSave"
      responses:
        "200":
          description: Answers saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentQuizAttempt"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/courses/{id}/attempts/{attemptId}/submit:
    post:
      operationId: submitQuizAttempt
      summary: Submit an attempt for server-side grading
      description: |
        Optionally saves final `answers`, then grades every question on the server and closes the
        attempt. Scores or results in the request are rejected. After the deadline, only answers
        saved in time are graded. A submitted attempt cannot be submitted or changed again
        (`ATTEMPT_NOT_IN_PROGRESS`). The response confirms submission without the score. Audited as
        `quiz.attempt_submitted` and `quiz.attempt_graded`.
      tags: [Quizzes]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/AttemptId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizAttemptSubmit"
      responses:
        "200":
          description: Attempt submitted and graded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentQuizAttempt"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/courses/{id}/activities/{activityId}/results:
    get:
      operationId: listQuizResults
      summary: All attempts at a quiz with server-computed scores (staff only)
      description: Requires `quiz.viewResults` (instructor, non-editing instructor) or the administrator role. Ordered by student email and attempt number.
      tags: [Quizzes]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ActivityId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResultPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/courses/{id}/activities/{activityId}/results/{attemptId}:
    get:
      operationId: getQuizAttemptResult
      summary: One attempt with answers, answer keys and per-question points (staff only)
      tags: [Quizzes]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ActivityId"
        - $ref: "#/components/parameters/AttemptId"
      responses:
        "200":
          description: The graded attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizAttemptResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `nextCursor`.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    CourseId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SectionId:
      name: sectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActivityId:
      name: activityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuestionId:
      name: questionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ap_session
      description: HttpOnly session cookie. Named `__Host-ap_session` in production.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF token from the login response or `GET /api/v1/auth/csrf`.
  headers:
    NoStore:
      description: Authenticated responses must not be cached.
      schema:
        type: string
        const: no-store
  responses:
    ValidationError:
      description: "The request body is missing or invalid (`code`: `VALIDATION_ERROR`)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: Request validation failed.
            code: VALIDATION_ERROR
    Unauthorized:
      description: |
        `code` is `INVALID_CREDENTIALS` for failed sign-in (generic; does not reveal whether the email
        exists), or `UNAUTHENTICATED` when the session cookie is missing, invalid, expired or revoked.
        An invalid session cookie is cleared.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: Invalid email or password.
            code: INVALID_CREDENTIALS
    Forbidden:
      description: "`code` is `CSRF_TOKEN_INVALID`, `ORIGIN_NOT_ALLOWED`, `FORBIDDEN` or `SELF_REVIEW_NOT_ALLOWED`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: Missing or invalid CSRF token.
            code: CSRF_TOKEN_INVALID
    RateLimited:
      description: "Too many sign-in attempts (`code`: `RATE_LIMITED`)."
      headers:
        Retry-After:
          description: Seconds until another attempt is allowed.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            detail: Too many attempts. Try again later.
            code: RATE_LIMITED
    NotFound:
      description: "The resource does not exist or the caller cannot access it (`code`: `NOT_FOUND`)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: Course not found.
            code: NOT_FOUND
    Conflict:
      description: |
        A uniqueness rule was violated: `PROGRAM_CODE_TAKEN`, `TERM_CODE_TAKEN`, `COURSE_CODE_TAKEN`,
        `ENROLLMENT_EXISTS` or `TEMPLATE_VERSION_CONFLICT`; or an invalid review transition:
        `ACTIVITY_UNDER_REVIEW`, `INVALID_REVIEW_STATE`; or a quiz rule: `QUIZ_QUESTION_LIMIT`,
        `ATTEMPT_LIMIT_REACHED`, `ATTEMPT_NOT_IN_PROGRESS`, `ATTEMPT_EXPIRED`, `ATTEMPT_CONFLICT`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Conflict
            status: 409
            detail: The user is already enrolled in this course.
            code: ENROLLMENT_EXISTS
    UnprocessableContent:
      description: |
        The request is well-formed but refers to missing or incompatible data: `INVALID_TERM_DATES`,
        `PROGRAM_NOT_FOUND`, `PROGRAM_INACTIVE`, `TERM_NOT_FOUND`, `TEMPLATE_NOT_FOUND`,
        `TEMPLATE_VERSION_NOT_FOUND`, `TEMPLATE_PROGRAM_MISMATCH`, `USER_NOT_FOUND`, `USER_INACTIVE`,
        `INVALID_URL`, `CONTENT_TYPE_MISMATCH`, `REVIEW_COMMENT_REQUIRED`, `QUIZ_HAS_NO_QUESTIONS`,
        `INVALID_ANSWER_KEY` or `INVALID_ANSWER`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Unprocessable Entity
            status: 422
            detail: The course template belongs to a different program.
            code: TEMPLATE_PROGRAM_MISMATCH
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
        - timestamp
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
          examples:
            - academiapath-api
        timestamp:
          type: string
          format: date-time
    LoginRequest:
      type: object
      required:
        - email
        - password
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 1024
    CurrentUser:
      type: object
      required:
        - id
        - email
        - givenName
        - familyName
        - systemRole
        - preferredLocale
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        systemRole:
          type: string
          description: Platform-wide role. Only `administrator` grants system-level permissions.
          enum:
            - administrator
            - user
        preferredLocale:
          type: string
          enum:
            - es
            - en
    LoginResponse:
      type: object
      required:
        - user
        - csrfToken
        - expiresAt
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/CurrentUser"
        csrfToken:
          type: string
          description: Send as `X-CSRF-Token` on state-changing requests.
        expiresAt:
          type: string
          format: date-time
    MeResponse:
      type: object
      required:
        - user
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/CurrentUser"
    CsrfTokenResponse:
      type: object
      required:
        - csrfToken
      additionalProperties: false
      properties:
        csrfToken:
          type: string
    ProblemDetails:
      type: object
      description: |
        RFC 9457 Problem Details, served as `application/problem+json`. `type` is `about:blank`, so
        `title` is the HTTP status phrase. `code` is an application-specific extension member for
        programmatic handling. Clients must ignore unknown members.
      required:
        - type
        - title
        - status
        - detail
        - code
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Human-readable explanation. Never contains credentials or internal details.
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Application-specific error code.
          enum:
            - VALIDATION_ERROR
            - INVALID_CREDENTIALS
            - UNAUTHENTICATED
            - CSRF_TOKEN_INVALID
            - ORIGIN_NOT_ALLOWED
            - FORBIDDEN
            - RATE_LIMITED
            - BAD_REQUEST
            - NOT_FOUND
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - REQUEST_ERROR
            - INTERNAL_ERROR
            - INVALID_CURSOR
            - PROGRAM_CODE_TAKEN
            - TERM_CODE_TAKEN
            - COURSE_CODE_TAKEN
            - ENROLLMENT_EXISTS
            - TEMPLATE_VERSION_CONFLICT
            - INVALID_TERM_DATES
            - PROGRAM_NOT_FOUND
            - PROGRAM_INACTIVE
            - TERM_NOT_FOUND
            - TEMPLATE_NOT_FOUND
            - TEMPLATE_VERSION_NOT_FOUND
            - TEMPLATE_PROGRAM_MISMATCH
            - USER_NOT_FOUND
            - USER_INACTIVE
            - INVALID_URL
            - CONTENT_TYPE_MISMATCH
            - ACTIVITY_UNDER_REVIEW
            - INVALID_REVIEW_STATE
            - SELF_REVIEW_NOT_ALLOWED
            - REVIEW_COMMENT_REQUIRED
            - QUIZ_HAS_NO_QUESTIONS
            - QUIZ_QUESTION_LIMIT
            - INVALID_ANSWER_KEY
            - INVALID_ANSWER
            - ATTEMPT_LIMIT_REACHED
            - ATTEMPT_NOT_IN_PROGRESS
            - ATTEMPT_EXPIRED
            - ATTEMPT_CONFLICT
    Code:
      type: string
      minLength: 1
      maxLength: 32
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
    CourseRole:
      type: string
      description: Course-level role. `administrator` is system-level and never a course role.
      enum:
        - design_team
        - instructor
        - non_editing_instructor
        - student
    CourseStatus:
      type: string
      enum:
        - draft
        - published
        - archived
    Program:
      type: object
      required: [id, code, name, description, isActive, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        code:
          $ref: "#/components/schemas/Code"
        name:
          type: string
        description:
          type: [string, "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProgramCreate:
      type: object
      required: [code, name]
      additionalProperties: false
      properties:
        code:
          $ref: "#/components/schemas/Code"
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
    ProgramPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Program"
        nextCursor:
          type: [string, "null"]
    Term:
      type: object
      required: [id, code, name, startsOn, endsOn, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        code:
          $ref: "#/components/schemas/Code"
        name:
          type: string
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TermCreate:
      type: object
      required: [code, name, startsOn, endsOn]
      additionalProperties: false
      properties:
        code:
          $ref: "#/components/schemas/Code"
        name:
          type: string
          minLength: 1
          maxLength: 200
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
    TermPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Term"
        nextCursor:
          type: [string, "null"]
    TemplateSectionInput:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        summary:
          type: string
          maxLength: 2000
        isVisible:
          type: boolean
          default: true
    CourseTemplateCreate:
      type: object
      required: [code, title, sections]
      additionalProperties: false
      properties:
        code:
          $ref: "#/components/schemas/Code"
        programId:
          type: [string, "null"]
          format: uuid
          description: Omit or null for templates shared across programs.
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        sections:
          type: array
          maxItems: 100
          description: Ordered sections; positions are assigned from array order.
          items:
            $ref: "#/components/schemas/TemplateSectionInput"
    TemplateSection:
      type: object
      required: [id, title, summary, position, isVisible]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        summary:
          type: [string, "null"]
        position:
          type: integer
          minimum: 0
        isVisible:
          type: boolean
    CourseTemplateVersion:
      type: object
      description: An immutable template version and its sections.
      required: [id, templateId, programId, code, version, title, description, sections, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
        programId:
          type: [string, "null"]
          format: uuid
        code:
          $ref: "#/components/schemas/Code"
        version:
          type: integer
          minimum: 1
        title:
          type: string
        description:
          type: [string, "null"]
        sections:
          type: array
          items:
            $ref: "#/components/schemas/TemplateSection"
        createdAt:
          type: string
          format: date-time
    CourseTemplate:
      type: object
      required: [id, programId, code, title, description, latestVersion, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        programId:
          type: [string, "null"]
          format: uuid
        code:
          $ref: "#/components/schemas/Code"
        title:
          type: string
          description: Title of the latest version.
        description:
          type: [string, "null"]
        latestVersion:
          type: [object, "null"]
          description: Null only for templates created before versioning (no versions yet).
          required: [id, version, createdAt]
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            version:
              type: integer
              minimum: 1
            createdAt:
              type: string
              format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CourseTemplatePage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CourseTemplate"
        nextCursor:
          type: [string, "null"]
    Course:
      type: object
      required:
        - id
        - programId
        - termId
        - templateId
        - templateVersionId
        - code
        - title
        - description
        - status
        - viewerRole
        - createdAt
        - updatedAt
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        programId:
          type: [string, "null"]
          format: uuid
        termId:
          type: string
          format: uuid
        templateId:
          type: [string, "null"]
          format: uuid
        templateVersionId:
          type: [string, "null"]
          format: uuid
        code:
          $ref: "#/components/schemas/Code"
        title:
          type: string
        description:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/CourseStatus"
        viewerRole:
          description: The caller's role in this course, or null (e.g. an administrator who is not enrolled).
          oneOf:
            - $ref: "#/components/schemas/CourseRole"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CourseCreate:
      type: object
      required: [programId, termId, templateId, code]
      additionalProperties: false
      properties:
        programId:
          type: string
          format: uuid
        termId:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
        templateVersion:
          type: integer
          minimum: 1
          description: Defaults to the template's latest version.
        code:
          $ref: "#/components/schemas/Code"
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Defaults to the template version's title.
        description:
          type: string
          maxLength: 2000
        status:
          type: string
          enum: [draft, published]
          default: draft
    CoursePage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Course"
        nextCursor:
          type: [string, "null"]
    Section:
      type: object
      required: [id, title, summary, position, isVisible]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        summary:
          type: [string, "null"]
        position:
          type: integer
          minimum: 0
        isVisible:
          type: boolean
    SectionPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Section"
        nextCursor:
          type: [string, "null"]
    EnrollmentCreate:
      type: object
      required: [role]
      additionalProperties: false
      oneOf:
        - required: [userId]
        - required: [email]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          minLength: 1
          maxLength: 254
        role:
          $ref: "#/components/schemas/CourseRole"
    Enrollment:
      type: object
      required: [id, courseId, role, status, user, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/CourseRole"
        status:
          type: string
          enum: [active, inactive]
        user:
          type: object
          required: [id, email, givenName, familyName]
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            givenName:
              type: string
            familyName:
              type: string
        createdAt:
          type: string
          format: date-time
    EnrollmentPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Enrollment"
        nextCursor:
          type: [string, "null"]
    ActivityType:
      type: string
      description: Content types supported by the content API.
      enum: [page, link, quiz]
    ReviewStatus:
      type: string
      enum: [draft, submitted, approved, returned]
    PageContent:
      type: object
      description: Plain-text lesson. Clients must render `body` as text, never as HTML.
      required: [body]
      additionalProperties: false
      properties:
        body:
          type: string
    LinkContent:
      type: object
      description: External resource. `url` is an absolute http(s) URL.
      required: [url, description]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
        description:
          type: [string, "null"]
    QuizContent:
      type: object
      description: Quiz settings and totals. Questions and answer keys are never part of an activity.
      required: [instructions, attemptLimit, timeLimitMinutes, shuffleQuestions, shuffleOptions, questionCount, totalPoints]
      additionalProperties: false
      properties:
        instructions:
          type: [string, "null"]
        attemptLimit:
          type: integer
          minimum: 1
        timeLimitMinutes:
          type: [integer, "null"]
        shuffleQuestions:
          type: boolean
        shuffleOptions:
          type: boolean
        questionCount:
          type: integer
        totalPoints:
          type: integer
    ActivityContent:
      oneOf:
        - $ref: "#/components/schemas/PageContent"
        - $ref: "#/components/schemas/LinkContent"
        - $ref: "#/components/schemas/QuizContent"
    PageContentInput:
      type: object
      required: [title, body]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        body:
          type: string
          minLength: 1
          maxLength: 20000
          pattern: "\\S"
          description: Plain text; line breaks are preserved. HTML is not interpreted.
    LinkContentInput:
      type: object
      required: [title, url]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        url:
          type: string
          minLength: 1
          maxLength: 2048
          description: Absolute http or https URL without embedded credentials.
        description:
          type: string
          maxLength: 1000
    QuizSettingsInput:
      type: object
      required: [title, attemptLimit]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
        instructions:
          type: string
          maxLength: 5000
        attemptLimit:
          type: integer
          minimum: 1
          maximum: 10
        timeLimitMinutes:
          type: [integer, "null"]
          minimum: 1
          maximum: 300
          description: Enforced by the server clock. Omit or null for no time limit.
        shuffleQuestions:
          type: boolean
          default: false
        shuffleOptions:
          type: boolean
          default: false
          description: Shuffles options of choice questions (not true/false).
    ActivityCreate:
      oneOf:
        - allOf:
            - $ref: "#/components/schemas/PageContentInput"
            - type: object
              required: [type]
              properties:
                type:
                  type: string
                  const: page
        - allOf:
            - $ref: "#/components/schemas/LinkContentInput"
            - type: object
              required: [type]
              properties:
                type:
                  type: string
                  const: link
        - allOf:
            - $ref: "#/components/schemas/QuizSettingsInput"
            - type: object
              required: [type]
              properties:
                type:
                  type: string
                  const: quiz
    ActivityUpdate:
      description: Must match the activity's type.
      oneOf:
        - $ref: "#/components/schemas/PageContentInput"
        - $ref: "#/components/schemas/LinkContentInput"
        - $ref: "#/components/schemas/QuizSettingsInput"
    ActivityReviewDecision:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [approve, return]
        comment:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: "\\S"
          description: Required when returning content.
    ActivityReview:
      type: object
      description: Review metadata (staff only).
      required: [status, comment, submittedAt, submittedByUserId, reviewedAt, reviewedByUserId]
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/ReviewStatus"
        comment:
          type: [string, "null"]
        submittedAt:
          type: [string, "null"]
          format: date-time
        submittedByUserId:
          type: [string, "null"]
          format: uuid
        reviewedAt:
          type: [string, "null"]
          format: date-time
        reviewedByUserId:
          type: [string, "null"]
          format: uuid
    ActivityLiveVersion:
      type: object
      description: The approved version students currently see (staff only).
      required: [title, content, approvedAt]
      additionalProperties: false
      properties:
        title:
          type: string
        content:
          $ref: "#/components/schemas/ActivityContent"
        approvedAt:
          type: string
          format: date-time
    Activity:
      type: object
      description: |
        For staff, `title`/`content` are the working copy and `review`/`liveVersion` are present.
        For students, `title`/`content` are the approved live version and `review`/`liveVersion` are null.
      required: [id, courseId, sectionId, type, position, isVisible, title, content, review, liveVersion, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        sectionId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/ActivityType"
        position:
          type: integer
          minimum: 0
        isVisible:
          type: boolean
        title:
          type: string
        content:
          $ref: "#/components/schemas/ActivityContent"
        review:
          oneOf:
            - $ref: "#/components/schemas/ActivityReview"
            - type: "null"
        liveVersion:
          oneOf:
            - $ref: "#/components/schemas/ActivityLiveVersion"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ActivityPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
        nextCursor:
          type: [string, "null"]

    QuizQuestionType:
      type: string
      description: Supported now. Matching, short answer and essay are not implemented.
      enum: [single_choice, multiple_choice, true_false]
    QuizChoiceQuestionInput:
      type: object
      required: [type, prompt, points, options]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [single_choice, multiple_choice]
        prompt:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: "\\S"
        points:
          type: integer
          minimum: 1
          maximum: 100
        options:
          type: array
          minItems: 2
          maxItems: 10
          description: Single choice needs exactly one correct option; multiple choice at least one.
          items:
            type: object
            required: [text, isCorrect]
            additionalProperties: false
            properties:
              text:
                type: string
                minLength: 1
                maxLength: 500
                pattern: "\\S"
              isCorrect:
                type: boolean
    QuizTrueFalseQuestionInput:
      type: object
      required: [type, prompt, points, correctAnswer]
      additionalProperties: false
      properties:
        type:
          type: string
          const: true_false
        prompt:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: "\\S"
        points:
          type: integer
          minimum: 1
          maximum: 100
        correctAnswer:
          type: boolean
    QuizQuestionInput:
      oneOf:
        - $ref: "#/components/schemas/QuizChoiceQuestionInput"
        - $ref: "#/components/schemas/QuizTrueFalseQuestionInput"
    QuizOptionWithKey:
      type: object
      required: [id, text, isCorrect]
      additionalProperties: false
      properties:
        id:
          type: string
        text:
          type: string
        isCorrect:
          type: boolean
    QuizOption:
      type: object
      required: [id, text]
      additionalProperties: false
      properties:
        id:
          type: string
        text:
          type: string
    QuizQuestion:
      type: object
      description: Staff view of a question, including the answer key. True/false questions use the options `true` and `false`.
      required: [id, position, type, prompt, points, options]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
        type:
          $ref: "#/components/schemas/QuizQuestionType"
        prompt:
          type: string
        points:
          type: integer
        options:
          type: array
          items:
            $ref: "#/components/schemas/QuizOptionWithKey"
    QuizQuestionList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuizQuestion"
    QuizAnswerInput:
      type: object
      required: [questionId, selectedOptionIds]
      additionalProperties: false
      properties:
        questionId:
          type: string
          format: uuid
        selectedOptionIds:
          type: array
          maxItems: 10
          items:
            type: string
    QuizAnswersSave:
      type: object
      required: [answers]
      additionalProperties: false
      properties:
        answers:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/QuizAnswerInput"
    QuizAttemptSubmit:
      type: object
      description: Only answers may be sent. Scores or results are rejected (`400`).
      additionalProperties: false
      properties:
        answers:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/QuizAnswerInput"
    QuizAttemptStatus:
      type: string
      enum: [in_progress, submitted]
    StudentQuizAttempt:
      type: object
      description: A student's own attempt. Never contains answer keys, correctness or scores.
      required: [id, activityId, attemptNumber, attemptLimit, status, startedAt, deadlineAt, submittedAt, closedByTimeLimit, resultsReleased, questions]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        activityId:
          type: string
          format: uuid
        attemptNumber:
          type: integer
        attemptLimit:
          type: integer
        status:
          $ref: "#/components/schemas/QuizAttemptStatus"
        startedAt:
          type: string
          format: date-time
        deadlineAt:
          type: [string, "null"]
          format: date-time
          description: Server deadline; the server enforces it regardless of the browser clock.
        submittedAt:
          type: [string, "null"]
          format: date-time
        closedByTimeLimit:
          type: boolean
        resultsReleased:
          type: boolean
          description: Always false until grade release is implemented.
        questions:
          type: array
          items:
            type: object
            required: [questionId, position, type, prompt, points, options, selectedOptionIds]
            additionalProperties: false
            properties:
              questionId:
                type: string
                format: uuid
              position:
                type: integer
              type:
                $ref: "#/components/schemas/QuizQuestionType"
              prompt:
                type: string
              points:
                type: integer
              options:
                type: array
                description: In the order fixed for this attempt.
                items:
                  $ref: "#/components/schemas/QuizOption"
              selectedOptionIds:
                type: array
                items:
                  type: string
    QuizAttemptStatusItem:
      type: object
      required: [id, attemptNumber, status, startedAt, deadlineAt, submittedAt, closedByTimeLimit]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        attemptNumber:
          type: integer
        status:
          $ref: "#/components/schemas/QuizAttemptStatus"
        startedAt:
          type: string
          format: date-time
        deadlineAt:
          type: [string, "null"]
          format: date-time
        submittedAt:
          type: [string, "null"]
          format: date-time
        closedByTimeLimit:
          type: boolean
    StudentQuizAttemptSummary:
      type: object
      required: [attemptLimit, attemptsUsed, timeLimitMinutes, activeAttemptId, items]
      additionalProperties: false
      properties:
        attemptLimit:
          type: integer
        attemptsUsed:
          type: integer
        timeLimitMinutes:
          type: [integer, "null"]
        activeAttemptId:
          type: [string, "null"]
          format: uuid
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuizAttemptStatusItem"
    QuizResultStudent:
      type: object
      required: [id, email, givenName, familyName]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        givenName:
          type: string
        familyName:
          type: string
    QuizResult:
      type: object
      required: [attemptId, attemptNumber, status, startedAt, deadlineAt, submittedAt, closedByTimeLimit, score, maxScore, student]
      additionalProperties: false
      properties:
        attemptId:
          type: string
          format: uuid
        attemptNumber:
          type: integer
        status:
          $ref: "#/components/schemas/QuizAttemptStatus"
        startedAt:
          type: string
          format: date-time
        deadlineAt:
          type: [string, "null"]
          format: date-time
        submittedAt:
          type: [string, "null"]
          format: date-time
        closedByTimeLimit:
          type: boolean
        score:
          type: [integer, "null"]
          description: Server-computed; null while in progress.
        maxScore:
          type: integer
        student:
          $ref: "#/components/schemas/QuizResultStudent"
    QuizResultPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuizResult"
        nextCursor:
          type: [string, "null"]
    QuizAttemptResult:
      allOf:
        - $ref: "#/components/schemas/QuizResult"
        - type: object
          required: [questions]
          properties:
            questions:
              type: array
              items:
                type: object
                required: [questionId, position, type, prompt, points, options, selectedOptionIds, awardedPoints, isCorrect]
                additionalProperties: false
                properties:
                  questionId:
                    type: string
                    format: uuid
                  position:
                    type: integer
                  type:
                    $ref: "#/components/schemas/QuizQuestionType"
                  prompt:
                    type: string
                  points:
                    type: integer
                  options:
                    type: array
                    items:
                      $ref: "#/components/schemas/QuizOptionWithKey"
                  selectedOptionIds:
                    type: array
                    items:
                      type: string
                  awardedPoints:
                    type: [integer, "null"]
                  isCorrect:
                    type: [boolean, "null"]
