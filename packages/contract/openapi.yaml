              $ref: "#/components/schemas/ActivityOrganization"
      responses:
        "200":
          description: The activity's folder and visibility.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityOrganizationResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/courses/{id}/activities/{activityId}:
    get:
      operationId: getActivity
      summary: Read one activity
      description: |
        Staff receive the working copy, review status and live version. Students receive only the
        approved live version; anything else responds `404`.
        Students receive `403 SECTION_LOCKED` (without content) while a section prerequisite locks the activity's section.
      tags:
        - Content
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ActivityId"
      responses:
        "200":
          description: The activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateActivity
      summary: Replace the working copy of draft, returned or approved content
      description: |
        Requires `content.edit`. Content waiting for review cannot be edited (`409`). Editing
        approved content sets the status back to `draft`; students keep seeing the previously
        approved live version until the revision is approved. Returned content stays `returned`
        until it is resubmitted. The body must match the activity's type. Audited as
        `activity.updated`.
      tags:
        - Content
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ActivityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityUpdate"
      responses:
        "200":
          description: Working copy updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
