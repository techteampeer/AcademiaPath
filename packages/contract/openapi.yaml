  /api/v1/courses/{id}/quality:
    get:
      operationId: getCourseQualityReport
      summary: Check the content quality of a course (AP-029)
      description: |
        Inspects the course's working copies (what would be submitted and approved) and returns a structured
        report, computed on demand and never stored. Requires `content.edit` (instructor, design team) or
        `content.review` (design team), or the administrator role: non-editing instructors and students get 403,
        anyone outside the course 404. Read-only; URLs are only parsed (never fetched), documents are never
        reprocessed, and answer keys are never returned.

        Each finding has a stable `code`, a `severity` and its location; interfaces word the description and the
        correction guidance from the code. `blocking` findings are states the editors already refuse to save, or
        broken references; content with a blocking finding cannot be submitted or approved
        (`QUALITY_CHECK_BLOCKED`). `warning` findings never block anything.

        A course with more than 1000 activities is refused with 422 `QUALITY_REPORT_TOO_LARGE` instead of
        returning a partial report (which could read as "no issues"). Check its activities one at a time; the
        activity report and the submit and approve guards always inspect their activity in full.
      tags:
        - Content
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: The course's quality report (always complete).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityReport"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/courses/{id}/activities/{activityId}/quality:
    get:
      operationId: getActivityQualityReport
      summary: Check the content quality of one activity (AP-029)
      description: |
        The activity-level findings of one activity's working copy (the same rules the submit and approve
        guards apply). Same permissions as the course report; 404 for activities outside the course.
      tags:
        - Content
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ActivityId"
      responses:
        "200":
          description: The activity's quality report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityReport"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/courses/{id}/sections/{sectionId}/documents:
    post:
      operationId: uploadSectionDocument
      summary: Upload a PDF, DOCX or PPTX document to a section
      description: |
        Requires `content.edit` (instructor, design team) or the administrator role. Send
        `multipart/form-data` with an optional `title` field followed by exactly one `file` part.
        Only `.pdf`, `.docx` and `.pptx` names are accepted, and the file's content must match:
        the server checks the signature and container structure and ignores the browser's media
        type. Encrypted or password-protected files, macro-enabled Office files, templates,
        malformed files and files that exceed the processing limits are rejected and not stored
        (audited as `document.upload_rejected`). The size limit is configurable (10 MB by default).

        Accepted files are stored privately under a server-generated name. The response contains the
        extracted text (PDF pages, PPTX slides or DOCX paragraphs) and summary revision 1. A file
        without selectable text (for example scanned pages) is stored with extraction status
        `no_text`; no OCR is performed. The new `file` activity is a `draft`. Audited as
        `activity.created`, `document.uploaded` and `document.summary_generated`.
      tags:
        - Documents
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SectionId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DocumentUpload"
            encoding:
              file:
                contentType: application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document, application/vnd.openxmlformats-officedocument.presentationml.presentation, application/octet-stream
      responses:
        "201":
          description: Document stored and extracted; summary revision 1 created.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/courses/{id}/activities/{activityId}/document:
    get:
      operationId: getActivityDocument
      summary: Read a document's metadata, extracted text and summary
      description: |
        For a `file` activity. Staff receive the working copy: the document, its current summary
        revision and, once approved, the approved summary as `liveSummary`. Students receive only
        the approved document and the approved summary revision of approved, visible documents in
        visible sections of published courses they are enrolled in (`liveSummary` is null); never
        drafts, pending revisions or review comments. Anything else responds `404`.
        Students receive `403 SECTION_LOCKED` (without content) while a section prerequisite locks the activity's section.
      tags:
