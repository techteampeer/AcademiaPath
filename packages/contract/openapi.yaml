                additionalProperties: false
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                  givenName:
                    type: string
                  familyName:
                    type: string
              completedCount:
                type: integer
                minimum: 0
              totalCount:
                type: integer
                minimum: 0
              percent:
                type: [integer, "null"]
                minimum: 0
                maximum: 100
              state:
                $ref: "#/components/schemas/ProgressState"
        nextCursor:
          type: [string, "null"]
    SectionPrerequisites:
      type: object
      required: [sectionId, requiredSectionIds]
      additionalProperties: false
      properties:
        sectionId:
          type: string
          format: uuid
        requiredSectionIds:
          type: array
          items:
            type: string
            format: uuid
    SectionPrerequisiteList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SectionPrerequisites"
    SectionPrerequisitesUpdate:
      type: object
      required: [requiredSectionIds]
      additionalProperties: false
      properties:
        requiredSectionIds:
          type: array
