        rows:
          type: array
          items:
            $ref: "#/components/schemas/EnrollmentImportRow"
        summary:
          type: object
          required: [total, create, unchanged, errors]
          additionalProperties: false
          properties:
            total:
              type: integer
            create:
              type: integer
            unchanged:
              type: integer
            errors:
              type: integer
