        timestamp:
          type: string
          format: date-time
    LoginRequest:
      type: object
      required:
        - email
        - password
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 1024
    CurrentUser:
      type: object
      required:
        - id
        - email
        - givenName
        - familyName
        - systemRole
        - preferredLocale
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        systemRole:
          type: string
          description: Platform-wide role. Only `administrator` grants system-level permissions.
          enum:
            - administrator
            - user
        preferredLocale:
          type: string
          enum:
            - es
            - en
    LoginResponse:
      type: object
      required:
        - user
        - csrfToken
        - expiresAt
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/CurrentUser"
        csrfToken:
          type: string
          description: Send as `X-CSRF-Token` on state-changing requests.
        expiresAt:
          type: string
          format: date-time
    MeResponse:
      type: object
      required:
        - user
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/CurrentUser"
    CsrfTokenResponse:
      type: object
      required:
        - csrfToken
      additionalProperties: false
      properties:
        csrfToken:
          type: string
    ProblemDetails:
      type: object
      description: |
        RFC 9457 Problem Details, served as `application/problem+json`. `type` is `about:blank`, so
        `title` is the HTTP status phrase. `code` is an application-specific extension member for
        programmatic handling. Clients must ignore unknown members.
      required:
        - type
        - title
        - status
        - detail
        - code
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Human-readable explanation. Never contains credentials or internal details.
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Application-specific error code.
          enum:
            - VALIDATION_ERROR
            - INVALID_CREDENTIALS
            - UNAUTHENTICATED
            - CSRF_TOKEN_INVALID
            - ORIGIN_NOT_ALLOWED
            - FORBIDDEN
            - RATE_LIMITED
            - BAD_REQUEST
            - NOT_FOUND
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - REQUEST_ERROR
            - INTERNAL_ERROR
            - INVALID_CURSOR
            - PROGRAM_CODE_TAKEN
            - TERM_CODE_TAKEN
            - COURSE_CODE_TAKEN
            - ENROLLMENT_EXISTS
            - TEMPLATE_VERSION_CONFLICT
            - INVALID_TERM_DATES
            - PROGRAM_NOT_FOUND
            - PROGRAM_INACTIVE
            - TERM_NOT_FOUND
            - TEMPLATE_NOT_FOUND
            - TEMPLATE_VERSION_NOT_FOUND
            - TEMPLATE_PROGRAM_MISMATCH
            - USER_NOT_FOUND
            - USER_INACTIVE
            - INVALID_URL
            - CONTENT_TYPE_MISMATCH
            - ACTIVITY_UNDER_REVIEW
            - INVALID_REVIEW_STATE
            - SELF_REVIEW_NOT_ALLOWED
            - REVIEW_COMMENT_REQUIRED
            - QUIZ_HAS_NO_QUESTIONS
            - QUIZ_QUESTION_LIMIT
            - INVALID_ANSWER_KEY
            - INVALID_ANSWER
            - ATTEMPT_LIMIT_REACHED
            - ATTEMPT_NOT_IN_PROGRESS
            - ATTEMPT_EXPIRED
            - ATTEMPT_CONFLICT
            - SUBMISSION_EXISTS
            - SUBMISSION_CLOSED
            - INVALID_DUE_DATE
            - INVALID_RUBRIC_SCORES
            - TERM_YEAR_MISMATCH
            - TEMPLATE_CODE_TAKEN
            - UNSUPPORTED_FILE_TYPE
            - FILE_SIGNATURE_MISMATCH
            - DOCUMENT_ENCRYPTED
            - DOCUMENT_MALFORMED
            - DOCUMENT_LIMITS_EXCEEDED
            - MALWARE_DETECTED
            - EMAIL_TAKEN
            - EMAIL_LOCKED
            - LAST_ADMINISTRATOR
            - SELF_ACCOUNT_CHANGE
            - INVITATIONS_DISABLED
            - INVITATION_SYNTHETIC_ONLY
            - ACCOUNT_ALREADY_ACTIVATED
            - INVITATION_INVALID
            - PASSWORD_TOO_WEAK
            - COURSE_NOT_FOUND
            - DUPLICATE_COURSE
            - ENROLLMENT_HAS_STUDENT_WORK
            - IMPORT_HAS_ERRORS
            - IMPORT_TOO_LARGE
            - IMPORT_CONFLICT
            - COURSE_VERSION_CONFLICT
            - INVALID_COURSE_TRANSITION
            - COURSE_CODE_LOCKED
            - SECTION_ORDER_STALE
            - INVALID_SECTION_ORDER
            - ENROLLMENT_HAS_HISTORY
            - SECTION_LOCKED
            - COMPLETION_AUTOMATIC
            - PREREQUISITE_SELF
            - PREREQUISITE_SECTION_NOT_FOUND
            - PREREQUISITE_CYCLE
    ProgressState:
      type: string
      description: "`no_activities` when the course or section has no eligible activities (no percentage is shown)."
      enum: [no_activities, not_started, in_progress, completed]
    TrackedActivityType:
      type: string
      enum: [page, link, file, quiz, assignment]
    ContinueAt:
      type: [object, "null"]
      description: The first incomplete eligible activity in an open section, in course order; `null` when there is none.
      required: [sectionId, activityId, type, title]
      additionalProperties: false
      properties:
        sectionId:
          type: string
          format: uuid
        activityId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/TrackedActivityType"
        title:
          type: string
    RequiredSection:
      type: object
      required: [sectionId, title, completed]
      additionalProperties: false
      properties:
        sectionId:
          type: string
          format: uuid
        title:
          type: string
        completed:
          type: boolean
    SectionProgressSummary:
      type: object
      required: [sectionId, title, position, locked, requiredSections, completedCount, totalCount, percent, state]
      additionalProperties: false
      properties:
        sectionId:
          type: string
          format: uuid
        title:
          type: string
        position:
          type: integer
        locked:
          type: boolean
          description: True while a visible section it requires is incomplete. Locked activities still count in `totalCount`.
        requiredSections:
          type: array
          description: Visible sections this one requires. Requirements on hidden sections are ignored and never named.
          items:
            $ref: "#/components/schemas/RequiredSection"
        completedCount:
          type: integer
          minimum: 0
        totalCount:
          type: integer
          minimum: 0
        percent:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          description: floor(completedCount × 100 / totalCount); `null` when `totalCount` is 0.
        state:
          $ref: "#/components/schemas/ProgressState"
    CourseProgress:
      type: object
      required: [courseId, continueAt, sections, completedCount, totalCount, percent, state]
      additionalProperties: false
      properties:
        courseId:
          type: string
          format: uuid
        continueAt:
          $ref: "#/components/schemas/ContinueAt"
        sections:
          type: array
          items:
            $ref: "#/components/schemas/SectionProgressSummary"
        completedCount:
          type: integer
          minimum: 0
        totalCount:
          type: integer
          minimum: 0
          description: Eligible activities (see the API description), including those in locked sections.
        percent:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
        state:
          $ref: "#/components/schemas/ProgressState"
    MyProgressList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            required: [courseId, continueAt, completedCount, totalCount, percent, state]
            additionalProperties: false
            properties:
              courseId:
                type: string
                format: uuid
              continueAt:
                $ref: "#/components/schemas/ContinueAt"
              completedCount:
                type: integer
                minimum: 0
              totalCount:
                type: integer
                minimum: 0
              percent:
                type: [integer, "null"]
                minimum: 0
                maximum: 100
              state:
                $ref: "#/components/schemas/ProgressState"
    ActivityProgress:
      type: object
      required: [activityId, type, title, completion, completed, completedAt]
      additionalProperties: false
      properties:
        activityId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/TrackedActivityType"
        title:
          type: string
        completion:
          type: string
