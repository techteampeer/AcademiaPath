              schema:
                $ref: "#/components/schemas/DocumentDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/courses/{id}/activities/{activityId}/document/brief:
    get:
      operationId: getDocumentStudyBrief
      summary: Study brief of a document (extractive, deterministic)
      description: |
        AP-031D. A study aid computed on request from the document's stored extracted text, with the same access
        rules as reading the document: staff get the brief of the working copy (`version: working`), students only
        of approved, visible documents in open sections (`version: approved`). Nothing is generated, paraphrased or
        translated: every overview sentence, concept, excerpt and list item is the document's own wording with the
        page, slide or paragraph it comes from (the extraction's own labels; no other location is invented).
        Headings, keywords and review points are selected by fixed rules; the response contains no wording of its
        own, so clients phrase labels and prompts in the interface language. No language model or external
        service is used, the original file is not read again and nothing is stored.

        `status`: `complete`; `partial` when only part of the document could be used (see `limitations`:
        extraction stopped at its size limit, the brief's own processing limit, or PDF pages without selectable
        text); `excerpts_only` when the text has too little sentence structure to select from reliably (the text
        is shown block by block, at most 8 of `excerptsAvailable` blocks, shortened excerpts flagged); `no_text`
        when nothing could be extracted.
        Students receive `403 SECTION_LOCKED` (without content) while a section prerequisite locks the activity's section.
      tags:
        - Documents
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ActivityId"
      responses:
        "200":
          description: The study brief.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentStudyBrief"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/courses/{id}/activities/{activityId}/document/file:
    get:
      operationId: downloadActivityDocument
      summary: Download the original file
      description: |
        Same access rules as reading the document: staff download the working copy's file, students
        only approved, visible documents. Served as an attachment with the server-detected media
        type, `X-Content-Type-Options: nosniff` and a sandboxing Content-Security-Policy. The file's
        SHA-256 is verified before it is sent. Original files are never reachable through a public
        URL.
        Students receive `403 SECTION_LOCKED` (without content) while a section prerequisite locks the activity's section.
      tags:
        - Documents
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ActivityId"
      responses:
        "200":
          description: The original file.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Content-Disposition:
              description: Always `attachment`, with the sanitized original file name.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                contentMediaType: application/vnd.openxmlformats-officedocument.wordprocessingml.document
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema:
                type: string
                contentMediaType: application/vnd.openxmlformats-officedocument.presentationml.presentation
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
