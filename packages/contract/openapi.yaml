      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ActivityId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of submissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentSubmissionPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/courses/{id}/activities/{activityId}/submissions/mine:
    get:
      operationId: getMyAssignmentSubmission
      summary: The signed-in student's submission status for an assignment
      description: |
        Students only. `submission` is null until the student submits. The grade appears only after
        release; until then `gradeStatus` is `pending` and no numbers are returned.
        Students receive `403 SECTION_LOCKED` (without content) while a section prerequisite locks the activity's section.
      tags: [Assignments]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ActivityId"
      responses:
        "200":
          description: Submission window and the student's own submission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentAssignmentStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/courses/{id}/activities/{activityId}/submissions/{submissionId}:
    get:
      operationId: getAssignmentSubmission
      summary: One submission with its rubric, scores and feedback (graders)
      description: Requires `grades.view` (instructor, non-editing instructor) or the administrator role (read-only).
      tags: [Assignments]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ActivityId"
        - $ref: "#/components/parameters/SubmissionId"
      responses:
        "200":
          description: The submission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentSubmissionDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/courses/{id}/activities/{activityId}/submissions/{submissionId}/grade:
    put:
      operationId: gradeAssignmentSubmission
      summary: Grade a submission against its rubric
      description: |
        Requires `grades.grade`: instructors and non-editing instructors assigned to the course. The
        administrator and design-team roles cannot grade. Every criterion of the submission's rubric
        must be scored exactly once, with whole points from 0 to the criterion maximum
        (`INVALID_RUBRIC_SCORES`; the database enforces the maximums too). The server computes the
        total; totals sent by the client are rejected. Regrading is allowed: a grade changed after
        release stays hidden from the student until it is released again. Audited as
        `assignment.graded`.
      tags: [Assignments]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ActivityId"
        - $ref: "#/components/parameters/SubmissionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentGradeInput"
      responses:
        "200":
          description: The graded submission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentSubmissionDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/courses/{id}/activities/{activityId}/grades/release:
    post:
      operationId: releaseGrades
      summary: Release the current grades of a quiz or assignment to its students
      description: |
        Requires `grades.release` (instructor, non-editing instructor; never the administrator or
        design-team roles). In one transaction, copies each graded student's current grade (points,
        feedback and rubric scores; for quizzes the best attempt's score) to the released grade the
        student can see. Grades given or changed later stay hidden until the next release, and
        releasing again without changes releases nothing. Answer keys are never released. Audited as
        `grades.released`. No request body.
      tags: [Grades]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ActivityId"
      responses:
        "200":
          description: How many grades were released.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GradeReleaseResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/courses/{id}/gradebook:
    get:
      operationId: getGradebook
      summary: Course gradebook (staff)
      description: |
        Requires `grades.view` (instructor, non-editing instructor) or the administrator role
        (read-only). Columns are the course's approved quizzes and assignments; rows are active
        students ordered by email and paginated. Cells hold the current server-calculated grade and
        its release status. A quiz counts the best submitted attempt, once per student. The total
        sums points over graded items and converts them to the 0–20 scale.
      tags: [Grades]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of gradebook rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gradebook"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/courses/{id}/grades/mine:
    get:
      operationId: getMyGrades
      summary: The signed-in student's released grades in a course
      description: |
        Students only (`grades.viewOwn`). Lists the course's quizzes and assignments. Released items
        include points, the 0–20 grade and, for assignments, feedback and rubric scores; everything
        else is `pending` without numbers. Answer keys are never included. The total uses released
        grades only. Activities in sections that a prerequisite still locks are omitted unless their
        grade was released.
      tags: [Grades]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: The student's grades.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentGrades"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/courses/{id}/progress:
    get:
      operationId: getMyCourseProgress
      summary: The signed-in student's progress in one course
      description: |
        Students only (`progress.own`, a role-only check: administrators and staff have no progress of
        their own). Returns the course figures and every visible section with its figures, whether it is
        locked by a prerequisite and which visible sections it requires. Draft courses respond `404` to
        students.
      tags: [Progress]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Course progress.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/courses/{id}/sections/{sectionId}/progress:
    get:
      operationId: getMySectionProgress
      summary: The signed-in student's progress in one section
      description: |
        Students only (`progress.own`). Lists the section's eligible activities with their completion
        state. `completion` is `manual` for lessons, links and documents (the student marks them) and
        `automatic` for quizzes and assignments (completed by a submitted attempt or a submission). A
        section that is locked by a prerequisite reports its counts only and an empty `activities`
        list. Hidden sections respond `404`.
      tags: [Progress]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SectionId"
      responses:
        "200":
          description: Section progress.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/courses/{id}/activities/{activityId}/completion:
    put:
      operationId: markActivityComplete
      summary: Mark a lesson, link or document complete
      description: |
        Students only (`progress.own`), for their own progress. Send no request body. The activity must
        be an approved, visible reading activity (`page`, `link` or `file`) in a visible section of this
        course; otherwise `404`. Quizzes and assignments respond `422 COMPLETION_AUTOMATIC`: they are
        completed by submitting them. A section locked by a prerequisite responds `403 SECTION_LOCKED`.
        Idempotent: repeated or concurrent calls keep one record with the first completion time.
        Audited as `activity.completion_marked` (first mark only).
      tags: [Progress]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ActivityId"
      responses:
        "200":
          description: The activity is complete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityCompletion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
    delete:
      operationId: unmarkActivityComplete
      summary: Mark a lesson, link or document incomplete again
      description: |
        Students only (`progress.own`). Same checks as marking. Idempotent. Audited as
        `activity.completion_unmarked` when a mark was removed. Quiz and assignment completion cannot be
        removed (`422 COMPLETION_AUTOMATIC`).
      tags: [Progress]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ActivityId"
      responses:
        "200":
          description: The activity is not complete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityCompletion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/courses/{id}/progress/students:
    get:
      operationId: listStudentProgress
      summary: Progress of the course's students (staff, read-only)
      description: |
        Requires `progress.viewAll` (instructor, non-editing instructor) or the administrator role.
        The design team, students and program-level roles cannot read it. Rows are active students
        ordered by email and paginated, with completed and total eligible activities. No scores,
        grades, time-spent or engagement figures are included. Nobody can change a student's progress
        through this endpoint.
      tags: [Progress]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of student progress rows.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProgressPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/courses/{id}/section-prerequisites:
    get:
      operationId: listSectionPrerequisites
      summary: Section prerequisites of a course (staff)
      description: |
        Requires `sections.viewHidden` (course staff) or the administrator role. One item per section
        that has requirements, with the required sections in course order. Students see their own
        requirements in `GET /api/v1/courses/{id}/progress`.
      tags: [Progress]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: The course's prerequisites.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionPrerequisiteList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/courses/{id}/sections/{sectionId}/prerequisites:
    put:
      operationId: setSectionPrerequisites
      summary: Set the sections a section requires (administrators)
      description: |
        Administrators only. Replaces the section's requirements; an empty list removes them. Every
        required section must belong to the same course (`422 PREREQUISITE_SECTION_NOT_FOUND`), a
        section cannot require itself (`422 PREREQUISITE_SELF`), and requirements that would form a
        cycle are refused (`422 PREREQUISITE_CYCLE`). Changes are serialized per course. Audited as
        `section.prerequisites_updated`.
      tags: [Progress]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectionPrerequisitesUpdate"
      responses:
        "200":
          description: The section's requirements after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionPrerequisites"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
  /api/v1/courses/{id}/tutor/messages:
    post:
      operationId: askTutor
      summary: Ask the course tutor a question (local mock provider, grounded in approved lessons)
      description: |
        Students, instructors and non-editing instructors of the course only (`tutor.use`; the
        administrator and design-team roles never grant it). Students must be enrolled in a published
        course. The answer is built only from approved lesson text this user may read in this course
        (students: visible lessons in visible sections). Draft, submitted or returned revisions,
        quizzes and answer keys, assignments, submissions, grades, review comments and audit entries
        are never used. When a lesson has an unapproved revision, only the approved version is used.

        Responses come from a local, deterministic mock provider (`provider.mode` = `mock`): it quotes
        the retrieved passages verbatim with citations, uses fixed English or Spanish wording, does
        not translate sources, and does not use a language model. Lesson text is treated as data,
        never as instructions. When nothing relevant is found, `grounding` is `insufficient_material`
        and no citations are returned. Requests are limited per user and course (`RATE_LIMITED`) and
        recorded without the question text.
      tags: [Tutor]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TutorMessageRequest"
      responses:
        "200":
          description: The grounded (or insufficient-material) mock response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorMessageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/courses/{id}/tutor/practice:
    post:
      operationId: suggestTutorPractice
      summary: Suggest practice prompts from approved lessons (local mock provider)
      description: |
        Same access, sources, limits and recording as `askTutor`. Returns up to three clearly labelled,
        ungraded practice prompts, each built from a cited approved lesson passage (optionally about
        `topic`). Prompts never contain assessment questions or answer keys.
      tags: [Tutor]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TutorPracticeRequest"
      responses:
        "200":
          description: Practice prompts (or an insufficient-material response).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorPracticeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/courses/{id}/tutor/usage:
    get:
      operationId: getMyTutorUsage
      summary: The signed-in user's own tutor usage in this course
      description: |
        Same access as `askTutor`. Only the caller's own records are returned (most recent first,
        at most 20); other users' usage is never exposed.
      tags: [Tutor]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Usage summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorUsage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `nextCursor`.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    CourseId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SectionId:
      name: sectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActivityId:
      name: activityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuestionId:
      name: questionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProgramId:
      name: programId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TermId:
      name: termId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ap_session
      description: HttpOnly session cookie. Named `__Host-ap_session` in production.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF token from the login response or `GET /api/v1/auth/csrf`.
  headers:
    NoStore:
      description: Authenticated responses must not be cached.
      schema:
        type: string
        const: no-store
  responses:
    BadRequest:
      description: |
        The request is invalid (`VALIDATION_ERROR`), or the activation token is invalid, expired,
        already used or revoked (`INVITATION_INVALID`; one code for all, so tokens cannot be probed).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: This activation link is invalid, has expired or was already used.
            code: INVITATION_INVALID
    ValidationError:
      description: "The request body is missing or invalid (`code`: `VALIDATION_ERROR`)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: Request validation failed.
            code: VALIDATION_ERROR
    Unauthorized:
      description: |
        `code` is `INVALID_CREDENTIALS` for failed sign-in (generic; does not reveal whether the email
        exists), or `UNAUTHENTICATED` when the session cookie is missing, invalid, expired or revoked.
        An invalid session cookie is cleared.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: Invalid email or password.
            code: INVALID_CREDENTIALS
    Forbidden:
      description: "`code` is `CSRF_TOKEN_INVALID`, `ORIGIN_NOT_ALLOWED`, `FORBIDDEN` (for example a non-administrator calling an administrator endpoint), `SELF_REVIEW_NOT_ALLOWED` or `SECTION_LOCKED` (a student opening content of a section that a prerequisite still locks)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: Missing or invalid CSRF token.
            code: CSRF_TOKEN_INVALID
    PayloadTooLarge:
      description: "The uploaded file exceeds the configured size limit (`code`: `PAYLOAD_TOO_LARGE`)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Payload Too Large
            status: 413
            detail: The file exceeds the 10 MB upload limit.
            code: PAYLOAD_TOO_LARGE
    UnsupportedMediaType:
      description: |
        The request is not `multipart/form-data` (`UNSUPPORTED_MEDIA_TYPE`), or the file is not an
        accepted document type: not `.pdf`/`.docx`/`.pptx`, macro-enabled, a template or a slide show
        (`UNSUPPORTED_FILE_TYPE`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Unsupported Media Type
            status: 415
            detail: Only PDF (.pdf), Word (.docx) and PowerPoint (.pptx) files are accepted.
            code: UNSUPPORTED_FILE_TYPE
    RateLimited:
      description: "Too many sign-in or activation attempts, or tutor requests (`code`: `RATE_LIMITED`)."
      headers:
        Retry-After:
          description: Seconds until another attempt is allowed.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            detail: Too many attempts. Try again later.
            code: RATE_LIMITED
    NotFound:
      description: "The resource does not exist or the caller cannot access it (`code`: `NOT_FOUND`)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: Course not found.
            code: NOT_FOUND
    Conflict:
      description: |
        A uniqueness rule was violated: `PROGRAM_CODE_TAKEN`, `TERM_CODE_TAKEN`, `COURSE_CODE_TAKEN`,
        `ENROLLMENT_EXISTS`, `TEMPLATE_CODE_TAKEN` or `TEMPLATE_VERSION_CONFLICT`; or an invalid review transition:
        `ACTIVITY_UNDER_REVIEW`, `INVALID_REVIEW_STATE`; or a quiz rule: `QUIZ_QUESTION_LIMIT`,
        `ATTEMPT_LIMIT_REACHED`, `ATTEMPT_NOT_IN_PROGRESS`, `ATTEMPT_EXPIRED`, `ATTEMPT_CONFLICT`; or an
        assignment rule: `SUBMISSION_EXISTS`, `SUBMISSION_CLOSED`; or an account rule: `EMAIL_TAKEN`,
        `EMAIL_LOCKED`, `LAST_ADMINISTRATOR`, `SELF_ACCOUNT_CHANGE`, `INVITATIONS_DISABLED`,
        `ACCOUNT_ALREADY_ACTIVATED`; or an enrollment rule: `ENROLLMENT_HAS_STUDENT_WORK`,
        `IMPORT_CONFLICT`, `ENROLLMENT_HAS_HISTORY`; or a course lifecycle rule:
        `COURSE_VERSION_CONFLICT`, `INVALID_COURSE_TRANSITION`, `COURSE_CODE_LOCKED`,
        `SECTION_ORDER_STALE`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Conflict
            status: 409
            detail: The user is already enrolled in this course.
            code: ENROLLMENT_EXISTS
    UnprocessableContent:
      description: |
        The request is well-formed but refers to missing or incompatible data: `INVALID_TERM_DATES`,
        `TERM_YEAR_MISMATCH`,
        `PROGRAM_NOT_FOUND`, `PROGRAM_INACTIVE`, `TERM_NOT_FOUND`, `TEMPLATE_NOT_FOUND`,
        `TEMPLATE_VERSION_NOT_FOUND`, `TEMPLATE_PROGRAM_MISMATCH`, `USER_NOT_FOUND`, `USER_INACTIVE`,
        `INVALID_URL`, `CONTENT_TYPE_MISMATCH`, `REVIEW_COMMENT_REQUIRED`, `QUIZ_HAS_NO_QUESTIONS`,
        `INVALID_ANSWER_KEY`, `INVALID_ANSWER`, `INVALID_DUE_DATE` or `INVALID_RUBRIC_SCORES`; or a refused
        document upload: `FILE_SIGNATURE_MISMATCH` (content does not match the extension),
        `DOCUMENT_ENCRYPTED`, `DOCUMENT_MALFORMED`, `DOCUMENT_LIMITS_EXCEEDED` (decompressed size,
        processing time or memory) or `MALWARE_DETECTED`; or an account or enrollment rule:
        `COURSE_NOT_FOUND`, `DUPLICATE_COURSE`, `INVITATION_SYNTHETIC_ONLY`, `PASSWORD_TOO_WEAK`,
        `IMPORT_HAS_ERRORS`, `IMPORT_TOO_LARGE` or `INVALID_SECTION_ORDER`; or a progress rule:
        `COMPLETION_AUTOMATIC` (quizzes and assignments complete on submission), `PREREQUISITE_SELF`,
        `PREREQUISITE_SECTION_NOT_FOUND` or `PREREQUISITE_CYCLE`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: about:blank
            title: Unprocessable Entity
            status: 422
            detail: The course template belongs to a different program.
            code: TEMPLATE_PROGRAM_MISMATCH
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
        - timestamp
      additionalProperties: false
      properties:
