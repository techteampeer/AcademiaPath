      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Section"
    CourseLifecycle:
      type: object
      required: [course, term, template, sections, enrollmentCounts, studentVisibleActivityCount, unapprovedActivityCount, awaitingReviewCount, allowedTransitions]
      additionalProperties: false
      properties:
        course:
          $ref: "#/components/schemas/Course"
        term:
          type: object
          description: Offerings take their dates from their term.
          required: [id, code, name, startsOn, endsOn]
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            code:
              type: string
            name:
              type: string
            startsOn:
              type: string
              format: date
            endsOn:
              type: string
              format: date
        template:
          description: The subject template version the offering was created from (never modified by course administration).
          oneOf:
            - type: object
              required: [id, code, title, version]
              additionalProperties: false
              properties:
                id:
                  type: string
                  format: uuid
                code:
                  type: string
                title:
                  type: string
                version:
                  type: integer
            - type: "null"
        sections:
          type: array
          items:
            type: object
            required: [id, title, summary, position, isVisible, activityCount, studentVisibleActivityCount]
            additionalProperties: false
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
              summary:
                type: [string, "null"]
              position:
                type: integer
              isVisible:
                type: boolean
              activityCount:
                type: integer
              studentVisibleActivityCount:
                type: integer
                description: Approved, visible activities (shown to students only if the section is visible too).
        enrollmentCounts:
          type: array
          items:
            type: object
            required: [role, active, inactive]
            additionalProperties: false
            properties:
              role:
                $ref: "#/components/schemas/CourseRole"
              active:
                type: integer
              inactive:
                type: integer
        studentVisibleActivityCount:
          type: integer
        unapprovedActivityCount:
          type: integer
        awaitingReviewCount:
          type: integer
        allowedTransitions:
          type: array
          items:
            type: string
            enum: [publish, unpublish]
