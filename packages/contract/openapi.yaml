          maxLength: 200
          pattern: "\\S"
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
    CourseTemplateDetail:
      type: object
      description: A reusable subject (course template) with its latest version, including sections.
      required: [id, programId, code, title, description, versionCount, latestVersion, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        programId:
          type: [string, "null"]
          format: uuid
        code:
          $ref: "#/components/schemas/Code"
        title:
          type: string
        description:
          type: [string, "null"]
        versionCount:
          type: integer
        latestVersion:
          oneOf:
            - $ref: "#/components/schemas/CourseTemplateVersion"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SystemRole:
      type: string
