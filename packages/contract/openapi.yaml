      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        systemRole:
          $ref: "#/components/schemas/SystemRole"
        isActive:
          type: boolean
        activationState:
          $ref: "#/components/schemas/UserActivationState"
        activeEnrollmentCount:
          type: integer
          minimum: 0
        courseRoles:
          type: array
          items:
            $ref: "#/components/schemas/CourseRole"
        createdAt:
          type: string
          format: date-time
        institutionalId:
          type: [string, "null"]
        preferredLocale:
          $ref: "#/components/schemas/Locale"
        updatedAt:
          type: string
          format: date-time
        activation:
          $ref: "#/components/schemas/UserActivation"
        enrollments:
          type: array
          items:
            $ref: "#/components/schemas/UserEnrollment"
    UserEnrollmentInput:
      type: object
      required: [courseId, role]
