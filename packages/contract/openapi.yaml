              schema:
                $ref: "#/components/schemas/MessagingSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/me/conversations:
    get:
      operationId: listMyConversations
