        (`409 RESOURCE_FOLDER_NOT_EMPTY`); content is never deleted with a folder. Audited as
        `resource_folder.deleted`.
      tags: [Content]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/FolderId"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/courses/{id}/sections/{sectionId}/activities/order:
    put:
      operationId: orderActivities
      summary: Reorder a section's activities
      description: |
        Requires `content.edit` or the administrator role. `activityIds` must list every activity of the
        section (all types, as staff see them) exactly once; otherwise `409 RESOURCE_ORDER_STALE`.
        Audited as `activity.reordered`.
      tags: [Content]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/SectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityOrder"
      responses:
        "200":
          description: The new order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityOrder"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/courses/{id}/activities/{activityId}/organization:
    put:
      operationId: organizeActivity
      summary: Place a reading activity in a folder, or show or hide it
      description: |
        Requires `content.edit` or the administrator role. Lessons, links and documents only
        (`422 RESOURCE_NOT_ORGANIZABLE` for quizzes and assignments). `folderId` must be a folder of the
        activity's own section (`422 RESOURCE_FOLDER_NOT_FOUND`); `null` takes it out of its folder.
        Hiding removes it from students, their progress totals and the tutor; showing it again only ever
        reveals its approved version. Not a content change, so no review is needed. Audited as
        `activity.organized`.
